<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>创建粉丝群 · FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/messages-im.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<style>
.app-main { padding: 28px 32px; overflow: auto; }
</style>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">FansLoop</div></div>
        <div class="s-item active" onclick="location.href='messages.html'"><span class="ic"><i class="fa-regular fa-comments"></i></span><span class="lb">消息</span></div>
        <div class="s-item" onclick="location.href='settings-privacy.html#group-invite'"><span class="ic"><i class="fa-solid fa-gear"></i></span><span class="lb">隐私设置</span></div>
    </aside>
    <header class="app-header">
        <div class="h-actions" style="margin-left:auto"><a href="messages.html" class="btn btn-sm btn-secondary"><i class="fa-solid fa-arrow-left"></i> 返回消息</a></div>
    </header>
    <main class="app-main">
        <div class="grp-create-wrap">
            <h1 style="font-size:22px;font-weight:800;margin-bottom:8px"><i class="fa-solid fa-users" style="color:var(--brand-purple)"></i> 创建粉丝群</h1>
            <p style="font-size:13px;color:var(--t-tertiary);margin-bottom:20px">私域群聊用于订阅者运营；从现有粉丝/订阅者中选择成员邀请进群。</p>
            <div class="grp-notice" id="gcConsentNotice"></div>

            <div class="grp-create-card">
                <h3>基本信息</h3>
                <div class="grp-field">
                    <label for="gcName">群名称</label>
                    <input id="gcName" type="text" placeholder="例如：VIP 订阅者群" value="VIP 订阅者交流群" />
                </div>
                <div class="grp-field">
                    <label for="gcDesc">群介绍（选填）</label>
                    <textarea id="gcDesc" rows="2" placeholder="说明群内权益、公告规则…">订阅者专属内容预告、直播通知与互动</textarea>
                </div>
                <div class="grp-field">
                    <label for="gcType">群类型</label>
                    <select id="gcType">
                        <option>订阅者专属群</option>
                        <option>直播粉丝群</option>
                        <option>新粉欢迎群</option>
                    </select>
                </div>
            </div>

            <div class="grp-create-card">
                <h3>邀请粉丝 <span style="font-size:12px;font-weight:400;color:var(--t-tertiary)">（可多选）</span></h3>
                <div class="grp-field">
                    <input type="search" id="gcFanSearch" placeholder="搜索昵称…" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--t-primary)" />
                </div>
                <div class="grp-fan-list" id="gcFanList"></div>
            </div>

            <div style="display:flex;gap:12px;justify-content:flex-end">
                <a href="messages.html" class="btn btn-secondary">取消</a>
                <button type="button" class="btn" id="gcSubmit" style="background:var(--brand-grad);color:#fff;border:none"><i class="fa-solid fa-check"></i> 创建并邀请</button>
            </div>
        </div>
    </main>
</div>
<div id="gcToast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;background:rgba(30,30,45,0.95);border-radius:999px;font-size:13px;opacity:0;transition:0.2s;z-index:9000;pointer-events:none"></div>
<style>#gcToast.show{opacity:1}</style>
<script src="../js-web/messages-group-create.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
</body>
</html>
