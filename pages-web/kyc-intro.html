<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>身份认证 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/kyc-subpages.css">
</head>
<body>
<div class="kyc-lite-shell">
    <header class="kyc-lite-top">
        <div class="brand"><span class="lg"><i class="fa-solid fa-shield-halved"></i></span> 身份认证</div>
        <a id="linkBack" href="settings.html"><i class="fa-solid fa-arrow-left"></i> 返回</a>
    </header>
    <main class="kyc-lite-main">
        <div class="kyc-flow-max">
            <div class="kyc-entry-hero">
                <div class="shield"><i class="fa-solid fa-user-shield"></i></div>
                <h1>需要完成身份认证</h1>
                <p>为了保障账户安全，请完成身份认证后继续使用</p>
                <span class="kyc-zk-badge"><i class="fa-brands fa-ethereum"></i> 支持 zkMe 隐私证明 · Verify 混合审核</span>
            </div>
            <div class="kyc-path-cards">
                <button type="button" class="kyc-path-card wallet recommended" id="btnWallet">
                    <span class="ic"><i class="fa-solid fa-wallet"></i></span>
                    <span>
                        <h3>使用钱包快速验证</h3>
                        <p>连接 MetaMask 等钱包，通过 zkMe 提交零知识身份证明，验证通过后即时完成实名。</p>
                        <span class="tag-rec">推荐 · 约 1 分钟</span>
                    </span>
                </button>
                <button type="button" class="kyc-path-card doc" id="btnDoc">
                    <span class="ic"><i class="fa-solid fa-id-card"></i></span>
                    <span>
                        <h3>使用证件进行认证</h3>
                        <p>上传有效证件并完成人脸识别。审核由 Verify 服务商机审与人工混合处理，提交后等待结果即可。</p>
                    </span>
                </button>
            </div>
            <a class="btn btn-secondary btn-block" id="btnStatus" href="kyc-status.html" style="margin-top:8px"><i class="fa-solid fa-signal"></i> 查看当前认证状态</a>
            <div class="kyc-verify-note">
                <strong>说明：</strong>若你已在 zkMe 持有有效身份凭证（ZKP），优先使用钱包验证；若无凭证或验证失败，可使用证件认证作为兜底方案。平台不介入人工审核，仅等待 Verify / zkMe 回传结果。
            </div>
        </div>
    </main>
    <footer class="kyc-lite-foot">GOODFANS 原型 · 状态存于 localStorage · 可中断后继续</footer>
</div>
<script src="../js-web/user-prototype-registry.js"></script>
<script src="../js-web/user-assets-store.js"></script>
<script src="../js-web/auth-session.js"></script>
<script src="../js-web/kyc-store.js"></script>
<script src="../js-web/kyc-flow-nav.js"></script>
<script>
(function () {
    var r = window.KycFlowNav.retParam();
    document.getElementById("linkBack").href = r || "settings.html";
    document.getElementById("btnStatus").href = window.KycFlowNav.hrefWithRet("kyc-status.html");
    document.getElementById("btnWallet").addEventListener("click", function () {
        window.KycFlowNav.go("kyc-wallet-verify.html");
    });
    document.getElementById("btnDoc").addEventListener("click", function () {
        window.KycFlowNav.go("kyc-upload-id.html");
    });
    var k = window.GoodfansKycStore.readKyc();
    if (k.authStatus === "approved") {
        window.KycFlowNav.go("kyc-complete.html");
    } else if (k.authStatus === "reviewing") {
        window.KycFlowNav.go("kyc-doc-pending.html");
    }
})();
</script>
</body>
</html>
