<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>添加收款方式 · FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<link rel="stylesheet" href="../css-web/funds-flow.css">
<style>
.wizard-steps { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.wizard-steps .ws {
    flex: 1; min-width: 100px;
    padding: 10px 12px;
    border-radius: var(--r-md);
    border: 1px solid var(--border);
    background: var(--bg-input);
    font-size: 11px; font-weight: 700; color: var(--t-tertiary);
    text-align: center;
}
.wizard-steps .ws.done { border-color: var(--success); color: var(--success-light); }
.wizard-steps .ws.active { border-color: var(--brand-purple); color: #fff; background: rgba(168,85,247,0.12); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 640px; }
@media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
.field label { display: block; font-size: 11px; color: var(--t-tertiary); margin-bottom: 6px; font-weight: 600; }
.field input, .field select {
    width: 100%; padding: 12px 14px; border-radius: var(--r-md);
    border: 1px solid var(--border); background: var(--bg-input); color: #fff; font-size: 13px;
    box-sizing: border-box;
}
.id-shot {
    border-radius: var(--r-md);
    border: 1px dashed var(--border);
    padding: 20px;
    text-align: center;
    background: var(--bg-input);
    background-image: url('https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=800&q=80');
    background-size: cover;
    background-position: center;
    min-height: 160px;
    position: relative;
}
.id-shot .cap {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 10px;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    font-size: 11px; color: #e5e5e5;
}
</style>
<link rel="stylesheet" href="../css-web/global-lang-switch.css">
<script src="../js-web/ui-i18n.js" defer></script>
<script src="../js-web/global-lang-switch.js" defer></script>
</head>
<body>

<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">FansLoop<span>Web3 Creator</span></div></div>
        <div class="s-section">资产</div>
        <div class="s-item active" onclick="location.href='wallet.html'"><span class="ic"><i class="fa-solid fa-wallet"></i></span><span class="lb">钱包</span></div>
        <div class="s-bottom"><div class="s-user"><div class="av" style="background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div><div class="info"><div class="n">Luna 🌙</div></div></div></div>
    </aside>

    <header class="app-header">
        <div class="h-search h-search-live h-search-unified">
            <div class="hs-inner">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="搜索…" autocomplete="off" />
            </div>
            <div class="gs-drop"></div>
        </div>
        <div class="h-actions"><div class="h-avatar" style="background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div></div>
    </header>

    <main class="app-main">
        <div class="page-head">
            <div class="ph-l">
                <div class="crumb"><a href="withdraw-fiat.html">提现到银行卡</a><i class="fa-solid fa-chevron-right"></i><span class="curr">添加借记卡收款</span></div>
                <h1>添加借记卡收款</h1>
                <p>用于法币提现入账；信息仅用于打款校验，FansLoop 加密存储。</p>
            </div>
            <div class="ph-r">
                <button type="button" class="btn btn-secondary" onclick="location.href='withdraw-fiat.html'"><i class="fa-solid fa-arrow-left"></i> 返回</button>
            </div>
        </div>

        <div class="wizard-steps">
            <div class="ws done">1. 基本信息</div>
            <div class="ws active">2. 银行卡</div>
            <div class="ws">3. 短信验证</div>
            <div class="ws">4. 完成</div>
        </div>

        <div class="card" style="padding: 24px 26px; max-width: 720px">
            <h3 style="font-size:14px;font-weight:700;margin-bottom:16px"><i class="fa-solid fa-id-card"></i> 持卡人信息</h3>
            <div class="form-grid">
                <div class="field"><label>持卡人姓名（与银行一致）</label><input type="text" placeholder="例如：张三" value="张珊"></div>
                <div class="field"><label>证件类型</label><select><option>身份证</option><option>护照</option></select></div>
                <div class="field" style="grid-column:1/-1"><label>证件号码</label><input type="text" placeholder="18 位身份证号码"></div>
            </div>

            <h3 style="font-size:14px;font-weight:700;margin:22px 0 16px"><i class="fa-solid fa-building-columns"></i> 银行卡信息</h3>
            <div class="form-grid">
                <div class="field" style="grid-column:1/-1"><label>借记卡卡号</label><input type="text" placeholder="6222 **** **** ****" inputmode="numeric"></div>
                <div class="field"><label>开户银行</label><select><option>中国工商银行</option><option>中国建设银行</option><option>招商银行</option></select></div>
                <div class="field"><label>开户城市</label><input type="text" placeholder="省 / 市"></div>
            </div>

            <h3 style="font-size:14px;font-weight:700;margin:22px 0 12px"><i class="fa-solid fa-mobile-screen"></i> 预留手机号</h3>
            <div class="form-grid">
                <div class="field"><label>银行预留手机</label><input type="tel" placeholder="11 位手机号" value="138****6280"></div>
                <div class="field"><label>验证码</label><input type="text" placeholder="6 位短信码"></div>
            </div>

            <div style="margin-top:22px">
                <div class="id-shot">
                    <div class="cap"><i class="fa-solid fa-image"></i> 示意图：部分银行需补充卡面照片（以实际风控为准）</div>
                </div>
            </div>

            <div style="display:flex;gap:12px;margin-top:22px;flex-wrap:wrap">
                <button type="button" class="btn btn-primary" onclick="location.href='withdraw-fiat.html'"><i class="fa-solid fa-check"></i> 保存并返回提现</button>
                <button type="button" class="btn btn-secondary" onclick="location.href='withdraw-fiat.html'">取消</button>
            </div>
        </div>
    </main>
</div>
<script src="../js-web/global-search.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
</body>
</html>
