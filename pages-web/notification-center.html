<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知中心高保真原型 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/notification-prototype.css">
</head>
<body>
<div class="np-shell">
    <header class="np-header">
        <div class="np-brand">
            <i class="fa-solid fa-infinity"></i>
            <span>GOODFANS Creator Web</span>
        </div>
        <div class="np-actions">
            <button class="h-icon" title="通知中心">
                <i class="fa-regular fa-bell"></i>
            </button>
        </div>
    </header>

    <main class="np-main">
        <div class="np-title-wrap">
            <h1>通知中心</h1>
            <p>系统通知类型覆盖：开播提醒、订阅提醒、收益通知、系统通知、到期提醒；支持筛选、已读与查看详情。</p>
        </div>

        <div class="nf-filter" id="nfFilter" aria-label="通知筛选"></div>

        <div class="nf-layout">
            <section class="nf-card">
                <div class="nf-toolbar">
                    <i class="fa-solid fa-circle-info"></i>
                    <span id="unreadHint">未读 0</span>
                    <button id="markAllRead">全部标记已读</button>
                </div>
                <div class="nf-list" id="nfList"></div>
            </section>

            <aside class="nf-card nf-side">
                <h4>通知数据概览</h4>
                <ul class="nf-kv">
                    <li><span>全部</span><strong id="allCount">0</strong></li>
                    <li><span>未读</span><strong id="unreadCount">0</strong></li>
                    <li><span>开播提醒</span><strong id="liveCount">0</strong></li>
                    <li><span>收益通知</span><strong id="incomeCount">0</strong></li>
                    <li><span>到期提醒</span><strong id="expiryCount">0</strong></li>
                </ul>
                <p style="margin:10px 0 0;line-height:1.65;color:#8f97ac">
                    已读触发动作：<br>
                    1) 单条点击“标记已读”<br>
                    2) 顶部“全部标记已读”<br>
                    3) 点击“查看详情”会自动标记为已读并进入详情页。<br>
                    三者都会实时减少未读数量，并影响“未读”筛选结果。
                </p>
            </aside>
        </div>
    </main>
</div>

<script src="../js-web/notification-prototype.js"></script>
</body>
</html>
