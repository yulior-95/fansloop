<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBS 推流配置 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<style>
body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #0f0a1a, #1a0b2e 50%, #2d1b4e);
    color: var(--t-primary);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.guide-wrap {
    width: min(640px, 100%);
    max-height: 90vh;
    overflow: auto;
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-xl);
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
}
.gh {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: rgba(18, 15, 32, 0.95);
    backdrop-filter: blur(8px);
    z-index: 2;
}
.gh h1 { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.gh .x {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--t-secondary);
    cursor: pointer;
}
.gb { padding: 18px; }
.step {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
    align-items: start;
}
@media (max-width: 600px) { .step { grid-template-columns: 1fr; } }
.step .num {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, #A855F7, #EC4899);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
}
.step h2 { font-size: 14px; font-weight: 700; margin: 0 0 6px; }
.step p { font-size: 12.5px; color: var(--t-secondary); line-height: 1.55; margin: 0; }
.step .fig {
    border-radius: var(--r-md);
    overflow: hidden;
    border: 1px solid var(--border);
    aspect-ratio: 4/3;
    background-size: cover;
    background-position: center;
}
.foot {
    font-size: 11px;
    color: var(--t-tertiary);
    padding: 0 4px 8px;
    line-height: 1.5;
}
</style>
</head>
<body>
<div class="guide-wrap">
    <div class="gh">
        <h1><i class="fa-solid fa-display" style="color:#A855F7"></i> 电脑直播 · OBS 两步配置</h1>
        <button type="button" class="x" id="btnCloseGuide" title="关闭" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="gb">
        <div class="step">
            <div>
                <div class="num">1</div>
                <h2>填入推流地址与推流码</h2>
                <p>打开 OBS → 设置 → 推流。服务选「自定义」，将 GOODFANS 提供的 <b>推流地址</b> 与 <b>推流码</b> 分别粘贴到服务器与串流密钥。</p>
            </div>
            <div class="fig" style="background-image:url('https://images.unsplash.com/photo-1614680376593-902f74cf0d41?w=800&q=80')" title="工作桌面环境示意"></div>
        </div>
        <div class="step">
            <div>
                <div class="num">2</div>
                <h2>开始推流并回到本站</h2>
                <p>在 OBS 点击「开始推流」。回到 GOODFANS 创建直播页或直播间，<b>检测到信号后画面会自动出现</b>，无需再点开播。</p>
            </div>
            <div class="fig" style="background-image:url('https://images.unsplash.com/photo-1598387993445-a435bd67de8d?w=800&q=80')" title="直播主题氛围示意"></div>
        </div>
        <p class="foot"><i class="fa-solid fa-circle-info" style="color:var(--brand-purple)"></i> 若画面延迟 10～30 秒属正常现象；请保证上行带宽稳定，推流码勿分享给他人。</p>
    </div>
</div>
<script>
(function () {
  function shut() {
    if (window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'goodfans-close-obs-guide' }, '*');
        return;
      } catch (_) {}
    }
    window.history.back();
  }
  document.getElementById('btnCloseGuide').addEventListener('click', shut);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') shut();
  });
})();
</script>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
