<script>
(function(){
function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast-f';
    t.textContent = msg;
    document.getElementById('toastHostF').appendChild(t);
    setTimeout(() => t.remove(), 2400);
}
window.toast = toast;

document.getElementById('btnTroubleFoot')?.addEventListener('click', () => document.getElementById('ovlTroubleHome').classList.add('show'));
document.getElementById('closeTroubleHome')?.addEventListener('click', () => document.getElementById('ovlTroubleHome').classList.remove('show'));
document.getElementById('ovlTroubleHome')?.addEventListener('click', e => { if (e.target.id === 'ovlTroubleHome') document.getElementById('ovlTroubleHome').classList.remove('show'); });
try {
    if (new URLSearchParams(location.search).get('logged_out') === '1') {
        toast('已退出登录，当前为游客模式');
    }
} catch (e) {}
})();
</script>
