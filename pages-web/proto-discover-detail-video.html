<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>发现详情 · 视频 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<link rel="stylesheet" href="../css-web/discover-video-player.css?v=2">
<link rel="stylesheet" href="../css-web/proto-discover-detail.css">
<link rel="stylesheet" href="../css-web/affiliate-commerce.css">
<link rel="stylesheet" href="../css-web/digital-assets.css">
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-section">主导航</div>
        <div class="s-item" onclick="location.href='home.html'"><span class="ic"><i class="fa-solid fa-house"></i></span><span class="lb">首页</span></div>
        <div class="s-item active" onclick="location.href='discover.html'"><span class="ic"><i class="fa-solid fa-compass"></i></span><span class="lb">发现</span></div>
        <div class="s-bottom">
            <div class="s-user">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div>
                <div class="info"><div class="n">Luna 🌙</div><div class="e">Creator</div></div>
            </div>
        </div>
    </aside>
    <header class="app-header">
        <div class="h-search h-search-unified">
            <div class="hs-inner"><i class="fa-solid fa-magnifying-glass"></i><input type="search" placeholder="搜索…" /></div>
        </div>
        <div class="h-actions">
            <button class="h-icon" type="button"><i class="fa-regular fa-bell"></i></button>
            <button class="h-cta" type="button"><i class="fa-solid fa-bolt"></i>充值</button>
            <div class="h-avatar" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div>
        </div>
    </header>
    <main class="app-main app-main--dd">
        <div class="dd-stage" id="ddStage" role="dialog" aria-modal="true" aria-label="视频详情">
            <span class="dd-proto-badge">视频详情 · 播放中</span>

            <div class="dd-media">
                <video data-dd-video playsinline muted loop
                    poster="https://images.unsplash.com/photo-1470071459604-3b5ec3a8fe05?w=1600&q=85"
                    src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
            </div>

            <div class="dd-pause-hint" aria-hidden="true"><div class="ring"><i class="fa-solid fa-play"></i></div></div>

            <div class="disc-vp" data-disc-vp>
                <div class="disc-vp-toolbar" data-disc-vp-controls>
                    <button type="button" class="disc-vp-btn disc-vp-play" data-action="toggle-play" aria-label="暂停">
                        <i class="fa-solid fa-pause"></i>
                    </button>
                    <div class="disc-vp-time">
                        <span data-role="current">0:12</span><span class="sep">/</span><span data-role="duration">1:00</span>
                    </div>
                    <button type="button" class="disc-vp-btn disc-vp-mute is-muted" data-action="toggle-mute" aria-label="开启声音">
                        <i class="fa-solid fa-volume-xmark"></i><i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
                <div class="disc-vp-progress-rail" data-action="seek-wrap">
                    <div class="disc-vp-progress" data-action="seek" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20">
                        <div class="disc-vp-progress-fill" data-role="fill" style="width:20%"></div>
                        <div class="disc-vp-progress-thumb" data-role="thumb" style="left:20%"></div>
                    </div>
                </div>
            </div>

            <div class="dd-top">
                <button type="button" class="dd-close" id="ddClose" aria-label="关闭"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="dd-creator">
                    <div class="av" style="background-image:url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120')"></div>
                    <div class="meta">
                        <div class="n">Lens 旅记</div>
                        <div class="h">@lensjourney</div>
                    </div>
                </div>
                <button type="button" class="dd-follow" id="ddFollow" aria-label="关注"><i class="fa-solid fa-user-plus"></i></button>
            </div>

            <aside class="dd-rail">
                <button type="button" class="dd-rail-btn is-liked" data-dd-like>
                    <i class="fa-solid fa-heart"></i><span>18k</span>
                </button>
                <button type="button" class="dd-rail-btn" data-dd-comment-open>
                    <i class="fa-regular fa-comment-dots"></i><span>428</span>
                </button>
                <button type="button" class="dd-rail-btn" data-dd-share>
                    <i class="fa-solid fa-share"></i><span>分享</span>
                </button>
                <button type="button" class="dd-rail-btn" data-dd-save>
                    <i class="fa-regular fa-bookmark"></i><span>收藏</span>
                </button>
            </aside>

            <footer class="dd-bottom">
                <h1 class="dd-title">环游 Vlog #023 · 北海道冬日雪景延时</h1>
                <div class="dd-tags">
                    <span class="tg">#Vlog</span>
                    <span class="tg">#北海道</span>
                    <span class="tg">#冬日</span>
                </div>
            </footer>

            <div class="dd-comments-backdrop"></div>
            <aside class="dd-comments-panel" aria-label="评论">
                <header class="dd-comments-head">
                    <div><h3>评论</h3><div class="count" id="ddCommentTotal">428 条评论</div></div>
                    <button type="button" class="dd-comments-close" id="ddCommentsClose"><i class="fa-solid fa-xmark"></i></button>
                </header>
                <div class="dd-comments-list" id="ddCommentList">
                    <article class="dd-comment">
                        <div class="av" style="background-image:url('https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80')"></div>
                        <div class="body">
                            <div class="who">SnowWalker <span>30 分钟前</span></div>
                            <p class="txt">画面质感太强了，求 LUT！</p>
                            <div class="acts"><button type="button">回复</button><button type="button">赞 86</button></div>
                        </div>
                    </article>
                </div>
                <div class="dd-comments-compose">
                    <input type="text" id="ddCommentInput" placeholder="说点什么…" />
                    <button type="button" id="ddSendComment">发送</button>
                </div>
            </aside>

            <div class="dd-toast" id="ddToast"></div>
        </div>
    </main>
</div>
<div id="flStandaloneModalRoot" class="fl-modal--default" aria-hidden="true" style="display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;padding:clamp(12px,3vw,24px);background:rgba(0,0,0,0.58);backdrop-filter:blur(10px);">
    <iframe title="GOODFANS 弹窗" style="width:min(600px,calc(100vw - 32px));height:min(880px,calc(100vh - 32px));border:none;border-radius:var(--r-xl);background:transparent;box-shadow:0 28px 70px rgba(0,0,0,0.5);pointer-events:auto;"></iframe>
</div>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/fl-interaction-modal.js"></script>
<script src="../js-web/proto-discover-detail.js"></script>
<script src="../js-web/mall-commerce-config-store.js"></script>
<script src="../js-web/affiliate-catalog-store.js"></script>
<script src="../js-web/affiliate-showcase-store.js"></script>
<script src="../js-web/affiliate-commerce-pages.js"></script>
<script src="../js-web/ai-product-match.js"></script>
</body>
</html>
