<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>认证状态 · FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/kyc-subpages.css">
</head>
<body>
<div class="kyc-lite-shell">
    <header class="kyc-lite-top">
        <div class="brand"><span class="lg"><i class="fa-solid fa-signal"></i></span> 认证状态</div>
        <a id="linkBack" href="settings.html">返回</a>
    </header>
    <main class="kyc-lite-main">
        <div class="kyc-flow-max">
            <div id="blockNone" class="card" style="padding:22px;display:none">
                <h2 style="margin:0 0 8px;font-size:17px">未认证</h2>
                <p style="margin:0 0 16px;font-size:13px;color:var(--t-secondary)">你尚未完成身份认证。</p>
                <a class="btn btn-primary" id="linkGo" href="kyc-intro.html">去认证</a>
            </div>
            <div id="blockSub" class="card" style="padding:22px;display:none;border-color:rgba(245,158,11,0.35)">
                <h2 style="margin:0 0 8px;font-size:17px"><i class="fa-solid fa-hourglass-half" style="color:#FCD34D"></i> 审核中</h2>
                <p style="margin:0 0 12px;font-size:13px;color:var(--t-secondary)">Verify 正在进行混合审核（机审 + 人工），请耐心等待结果回传。</p>
                <div style="font-size:12px;color:var(--t-tertiary);line-height:1.7" id="subMeta"></div>
                <a class="btn btn-secondary btn-block" style="margin-top:14px" id="linkPending" href="#">查看审核进度</a>
            </div>
            <div id="blockOk" class="card" style="padding:22px;display:none;border-color:rgba(16,185,129,0.4)">
                <h2 style="margin:0 0 8px;font-size:17px;color:#6EE7B7"><i class="fa-solid fa-circle-check"></i> 已通过</h2>
                <p style="margin:0 0 8px;font-size:13px;color:var(--t-secondary)">身份验证已通过，可进行提现等受控操作。</p>
                <p style="margin:0;font-size:12px;color:var(--t-tertiary)" id="okMeta"></p>
            </div>
            <div id="blockBad" class="card" style="padding:22px;display:none;border-color:rgba(239,68,68,0.4)">
                <h2 style="margin:0 0 8px;font-size:17px;color:#FCA5A5"><i class="fa-solid fa-circle-xmark"></i> 认证未通过</h2>
                <p style="margin:0 0 12px;font-size:13px;color:var(--t-secondary)">请根据原因修正后重新发起认证。</p>
                <div class="card" style="padding:14px;background:var(--bg-input);margin-bottom:14px;font-size:12.5px;line-height:1.65;color:var(--t-secondary)">
                    <strong style="color:#fff">失败原因</strong><br /><span id="rejReason"></span>
                </div>
                <a class="btn btn-primary" id="linkRetry" href="kyc-intro.html">重新认证</a>
            </div>
        </div>
    </main>
    <footer class="kyc-lite-foot">状态查询接口原型：authStatus / authSource / zkpStatus</footer>
</div>
<script src="../js-web/user-prototype-registry.js"></script>
<script src="../js-web/user-assets-store.js"></script>
<script src="../js-web/auth-session.js"></script>
<script src="../js-web/kyc-store.js"></script>
<script src="../js-web/kyc-flow-nav.js"></script>
<script>
(function () {
    var ret = window.KycFlowNav.retParam();
    document.getElementById("linkBack").href = ret || "settings.html";
    document.getElementById("linkGo").href = window.KycFlowNav.hrefWithRet("kyc-intro.html");
    document.getElementById("linkRetry").href = window.KycFlowNav.hrefWithRet("kyc-intro.html");
    document.getElementById("linkPending").href = window.KycFlowNav.hrefWithRet("kyc-doc-pending.html");
    var k = window.FansloopKycStore.readKyc();
    var st = k.authStatus || "unverified";
    function show(id) { document.getElementById(id).style.display = "block"; }
    var srcLabel = k.authSource === "wallet" ? "钱包验证 (zkMe)" : k.authSource === "document" ? "证件认证" : "—";
  if (st === "approved") {
        show("blockOk");
        document.getElementById("okMeta").textContent = "认证方式：" + srcLabel + " · ZKP：" + (k.zkpStatus || "unknown");
    } else if (st === "rejected") {
        show("blockBad");
        document.getElementById("rejReason").textContent = k.rejectReason || "未填写具体原因";
    } else if (st === "reviewing") {
        show("blockSub");
        document.getElementById("subMeta").innerHTML = "单号：" + (k.lastId || "—") + "<br>认证来源：" + srcLabel + "<br>隐私证明：" + (k.zkpStatus || "unknown");
    } else show("blockNone");
})();
</script>
</body>
</html>
