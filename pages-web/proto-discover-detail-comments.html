<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>发现详情 · 评论展开 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/proto-discover-detail.css">
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-item active"><span class="ic"><i class="fa-solid fa-compass"></i></span><span class="lb">发现</span></div>
        <div class="s-bottom">
            <div class="s-user">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div>
                <div class="info"><div class="n">Luna 🌙</div></div>
            </div>
        </div>
    </aside>
    <header class="app-header">
        <div class="h-search h-search-unified"><div class="hs-inner"><i class="fa-solid fa-magnifying-glass"></i><input type="search" placeholder="搜索…" /></div></div>
        <div class="h-actions"><button class="h-cta" type="button"><i class="fa-solid fa-bolt"></i>充值</button></div>
    </header>
    <main class="app-main app-main--dd">
        <div class="dd-stage dd-comments-open" id="ddStage" role="dialog" aria-modal="true">
            <span class="dd-proto-badge">评论抽屉 · 展开态</span>

            <div class="dd-media">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a8fe05?w=1600&q=85" alt="北海道冬日" />
            </div>

            <div class="dd-top">
                <button type="button" class="dd-close" id="ddClose"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="dd-creator">
                    <div class="av" style="background-image:url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120')"></div>
                    <div class="meta"><div class="n">Lens 旅记</div><div class="h">@lensjourney</div></div>
                </div>
                <button type="button" class="dd-follow is-following" id="ddFollow" aria-label="已关注"><i class="fa-solid fa-check"></i></button>
            </div>

            <aside class="dd-rail">
                <button type="button" class="dd-rail-btn" data-dd-like><i class="fa-regular fa-heart"></i><span>18k</span></button>
                <button type="button" class="dd-rail-btn is-active" data-dd-comment-open><i class="fa-solid fa-comment-dots"></i><span>428</span></button>
                <button type="button" class="dd-rail-btn" data-dd-share><i class="fa-solid fa-share"></i><span>分享</span></button>
                <button type="button" class="dd-rail-btn" data-dd-save><i class="fa-regular fa-bookmark"></i><span>收藏</span></button>
            </aside>

            <footer class="dd-bottom">
                <h1 class="dd-title">环游 Vlog #023 · 北海道冬日</h1>
                <div class="dd-tags"><span class="tg">#Vlog</span><span class="tg">#北海道</span></div>
            </footer>

            <div class="dd-comments-backdrop"></div>
            <aside class="dd-comments-panel" aria-label="评论列表">
                <header class="dd-comments-head">
                    <div><h3>评论</h3><div class="count" id="ddCommentTotal">428 条评论</div></div>
                    <button type="button" class="dd-comments-close" id="ddCommentsClose" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
                </header>
                <div class="dd-comments-list" id="ddCommentList">
                    <article class="dd-comment">
                        <div class="av" style="background-image:url('https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80')"></div>
                        <div class="body">
                            <div class="who">SnowWalker <span>30 分钟前</span></div>
                            <p class="txt">画面质感太强了，求 LUT！</p>
                            <div class="acts"><button type="button">回复</button><button type="button">赞 86</button></div>
                        </div>
                    </article>
                    <article class="dd-comment">
                        <div class="av" style="background-image:url('https://images.unsplash.com/photo-1517841905240-472988babdf9?w=80')"></div>
                        <div class="body">
                            <div class="who">Aoi <span>1 小时前</span></div>
                            <p class="txt">零下拍摄设备怎么防冻？</p>
                            <div class="acts"><button type="button">回复</button><button type="button">赞 34</button></div>
                        </div>
                    </article>
                    <article class="dd-comment">
                        <div class="av" style="background-image:url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=80')"></div>
                        <div class="body">
                            <div class="who">Kenji <span>3 小时前</span></div>
                            <p class="txt">已三连，期待下一期札幌</p>
                            <div class="acts"><button type="button">回复</button><button type="button">赞 19</button></div>
                        </div>
                    </article>
                    <article class="dd-comment">
                        <div class="av" style="background-image:url('https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=80')"></div>
                        <div class="body">
                            <div class="who">Mia <span>昨天</span></div>
                            <p class="txt">BGM 是什么？太好听了</p>
                            <div class="acts"><button type="button">回复</button><button type="button">赞 8</button></div>
                        </div>
                    </article>
                </div>
                <div class="dd-comments-compose">
                    <input type="text" id="ddCommentInput" placeholder="发表你的看法…" value="雪景太治愈了！" />
                    <button type="button" id="ddSendComment">发送</button>
                </div>
            </aside>

            <div class="dd-toast" id="ddToast"></div>
        </div>
    </main>
</div>
<div id="flStandaloneModalRoot" class="fl-modal--default" aria-hidden="true" style="display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;padding:clamp(12px,3vw,24px);background:rgba(0,0,0,0.58);backdrop-filter:blur(10px);">
    <iframe title="GOODFANS 弹窗" style="width:min(600px,calc(100vw - 32px));height:min(880px,calc(100vh - 32px));border:none;border-radius:var(--r-xl);background:transparent;box-shadow:0 28px 70px rgba(0,0,0,0.5);pointer-events:auto;"></iframe>
</div>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/fl-interaction-modal.js"></script>
<script src="../js-web/proto-discover-detail.js"></script>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
