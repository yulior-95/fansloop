<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人脸识别（手机）· FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<style>
    body { margin: 0; min-height: 100vh; background: var(--bg-app); color: #fff; font-family: system-ui, sans-serif; }
    .wrap { max-width: 420px; margin: 0 auto; padding: 20px 18px 32px; }
    .top { text-align: center; margin-bottom: 20px; }
    .top .logo { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #a855f7, #ec4899); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 10px; }
    h1 { font-size: 18px; font-weight: 800; margin: 0 0 8px; }
    p { font-size: 13px; color: var(--t-secondary); line-height: 1.55; margin: 0; }
    .cam { border-radius: var(--r-lg); overflow: hidden; border: 2px solid rgba(168, 85, 247, 0.45); margin: 20px 0; aspect-ratio: 3/4; background: #000; position: relative; }
    .cam img, .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cam .ring { position: absolute; inset: 12%; border: 2px dashed rgba(168,85,247,0.8); border-radius: 50%; pointer-events: none; }
    .fail { margin-top: 12px; padding: 12px; border-radius: 10px; background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.35); font-size: 12px; color: #fca5a5; display: none; }
    .token { font-size: 11px; color: var(--t-tertiary); word-break: break-all; margin-bottom: 16px; font-family: ui-monospace, monospace; }
    .btn { width: 100%; justify-content: center; }
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div class="logo"><i class="fa-solid fa-shield-heart"></i></div>
        <h1>安全人脸识别</h1>
        <p>授权摄像头后，将校验取景框内人像并保存快照，电脑端自动同步。</p>
    </div>
    <div class="token" id="tok"></div>
    <div class="cam">
        <img id="illus" src="https://images.unsplash.com/photo-1531746790731-9c087f06e611?w=600&h=800&fit=crop" alt="取景" />
        <video id="video" playsinline muted style="display:none"></video>
        <canvas id="canvas" hidden></canvas>
        <div class="ring"></div>
    </div>
    <div class="fail" id="failBox"></div>
    <button type="button" class="btn btn-primary btn-lg btn-block" id="btnStart"><i class="fa-solid fa-camera"></i> 开始识别</button>
</div>
<script src="../js-web/kyc-store.js"></script>
<script src="../js-web/kyc-face-detect.js"></script>
<script>
(function () {
    var token = new URLSearchParams(location.search).get("token") || "mobile";
    document.getElementById("tok").textContent = "session: " + token;
    var video = document.getElementById("video");
    var illus = document.getElementById("illus");
    var canvas = document.getElementById("canvas");
    var btn = document.getElementById("btnStart");
    var failBox = document.getElementById("failBox");

    function reportFail(reason) {
        failBox.style.display = "block";
        failBox.textContent = reason;
        if (window.FansloopKycStore) {
            window.FansloopKycStore.setFaceDone(token, null, { passed: false, reason: reason });
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-camera"></i> 重新识别';
    }

    function reportOk(snapshot) {
        failBox.style.display = "none";
        if (window.FansloopKycStore) {
            window.FansloopKycStore.setFaceDone(token, snapshot, { passed: true });
        }
        btn.innerHTML = '<i class="fa-solid fa-check"></i> 已完成，可关闭本页';
        alert("识别成功，请返回电脑浏览器继续。");
    }

    btn.addEventListener("click", function () {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> 识别中…';
        failBox.style.display = "none";

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            reportFail("当前环境不支持摄像头");
            return;
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(function (stream) {
                illus.style.display = "none";
                video.style.display = "block";
                video.srcObject = stream;
                return video.play().then(function () { return stream; });
            })
            .then(function (stream) {
                setTimeout(function () {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext("2d").drawImage(video, 0, 0);
                    stream.getTracks().forEach(function (t) { t.stop(); });
                    var shot = canvas.toDataURL("image/jpeg", 0.88);
                    var result = window.KycFaceDetect.detectFaceInCanvas(canvas);
                    if (!result.ok) {
                        reportFail(result.reason);
                        return;
                    }
                    reportOk(shot);
                }, 3000);
            })
            .catch(function () {
                reportFail("无法访问摄像头，请检查权限");
            });
    });
})();
</script>
</body>
</html>
