<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人脸识别（移动端）· FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-app);
        color: #fff;
        font-family: system-ui, sans-serif;
    }
    .wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 20px 18px 32px;
    }
    .top {
        text-align: center;
        margin-bottom: 20px;
    }
    .top .logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(135deg, #a855f7, #ec4899);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin-bottom: 10px;
    }
    h1 {
        font-size: 18px;
        font-weight: 800;
        margin: 0 0 8px;
    }
    p {
        font-size: 13px;
        color: var(--t-secondary);
        line-height: 1.55;
        margin: 0;
    }
    .cam {
        border-radius: var(--r-lg);
        overflow: hidden;
        border: 2px solid rgba(168, 85, 247, 0.45);
        margin: 20px 0;
        aspect-ratio: 3/4;
        background: #000;
    }
    .cam img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .token {
        font-size: 11px;
        color: var(--t-tertiary);
        word-break: break-all;
        margin-bottom: 16px;
        font-family: ui-monospace, monospace;
    }
    .btn {
        width: 100%;
        justify-content: center;
    }
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div class="logo"><i class="fa-solid fa-shield-heart"></i></div>
        <h1>安全人脸识别</h1>
        <p>此页面模拟在手机浏览器中打开的一次性识别会话。完成后请回到电脑端流程页点击「已完成」。</p>
    </div>
    <div class="token" id="tok"></div>
    <div class="cam">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=600&h=800&fit=crop&crop=face" alt="活体检测取景示意" />
    </div>
    <button type="button" class="btn btn-primary btn-lg btn-block" id="btnOk"><i class="fa-solid fa-check"></i> 模拟识别成功</button>
</div>
<script>
(function () {
    var q = new URLSearchParams(location.search).get("token") || "—";
    document.getElementById("tok").textContent = "token: " + q;
    document.getElementById("btnOk").addEventListener("click", function () {
        alert("识别成功（原型）。请返回电脑浏览器继续提交审核。");
    });
})();
</script>
</body>
</html>
