<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>侧栏 Pro 卡片 · 会员有效 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/sidebar-bottom.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<style>
.proto-banner {
    padding: 14px 18px;
    margin-bottom: 20px;
    border-radius: var(--r-lg);
    background: linear-gradient(135deg, rgba(16,185,129,0.12), rgba(6,182,212,0.08));
    border: 1px solid rgba(16,185,129,0.35);
}
.proto-banner h2 { font-size: 16px; font-weight: 800; margin: 0 0 6px; }
.proto-banner p { font-size: 12px; color: var(--t-secondary); line-height: 1.55; margin: 0; }
.proto-perks {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}
@media (max-width: 720px) { .proto-perks { grid-template-columns: 1fr; } }
.proto-perk {
    padding: 16px;
    border-radius: var(--r-lg);
    background: var(--bg-card);
    border: 1px solid var(--border);
}
.proto-perk i { font-size: 18px; color: var(--brand-purple); margin-bottom: 8px; }
.proto-perk h3 { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
.proto-perk p { font-size: 12px; color: var(--t-tertiary); margin: 0; line-height: 1.45; }
</style>
</head>
<body>

<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand">
            <div class="logo"><i class="fa-solid fa-infinity"></i></div>
            <div class="name">GOODFANS<span>Web3 Creator</span></div>
        </div>
    </aside>

    <header class="app-header">
        <div class="h-search h-search-live h-search-unified">
            <div class="hs-inner">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="搜索创作者、内容或话题…" autocomplete="off" />
            </div>
            <div class="gs-drop"></div>
        </div>
        <div class="h-actions">
            <button class="h-icon"><i class="fa-regular fa-bell"></i></button>
            <button class="h-icon" onclick="location.href='messages.html'"><i class="fa-regular fa-comments"></i></button>
            <button class="h-cta" onclick="location.href='wallet.html'"><i class="fa-solid fa-bolt"></i>充值</button>
            <div class="h-avatar" style="background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')" onclick="location.href='profile.html'"></div>
        </div>
    </header>

    <main class="app-main">
        <div class="proto-banner">
            <h2><i class="fa-solid fa-circle-check" style="color:#34D399"></i> 侧栏状态：Creator Pro 会员有效</h2>
            <p>当前登录用户<strong style="color:#fff">已购买且在有效期内</strong>时，无论切换到哪个菜单，侧栏底部<strong style="color:#6EE7B7">不展示</strong>升级卡片，仅保留用户头像行。用户菜单中显示 Pro 徽章。</p>
        </div>
        <div class="proto-perks">
            <div class="proto-perk"><i class="fa-solid fa-chart-line"></i><h3>高级数据分析</h3><p>粉丝画像、内容转化与收益趋势已解锁</p></div>
            <div class="proto-perk"><i class="fa-solid fa-clock"></i><h3>定时发布队列</h3><p>3 篇内容已排期，将于本周自动发布</p></div>
            <div class="proto-perk"><i class="fa-solid fa-signal"></i><h3>直播推流优先级</h3><p>蓝光码率保障 · 高峰时段优先带宽</p></div>
            <div class="proto-perk"><i class="fa-solid fa-headset"></i><h3>优先客服</h3><p>创作者专属支持通道 · 平均响应 &lt; 2h</p></div>
        </div>
    </main>
</div>

<script>
(function () {
    var p = new URLSearchParams(location.search);
    if (!p.has('fl_creator_pro')) {
        var q = location.search ? location.search + '&' : '?';
        location.replace(location.pathname + q + 'fl_creator_pro=active');
    }
    function ensureLogin() {
        if (globalThis.GoodfansAuth && !globalThis.GoodfansAuth.isLoggedIn()) {
            globalThis.GoodfansAuth.login({ email: 'luna@goodfans.io' });
        }
    }
    globalThis.addEventListener('fl-auth-prototype-ready', ensureLogin);
    document.addEventListener('DOMContentLoaded', function () { setTimeout(ensureLogin, 600); });
})();
</script>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
