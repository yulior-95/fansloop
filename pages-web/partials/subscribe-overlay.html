<div class="inline-overlay" id="ovlSubscribe" aria-hidden="true">
    <div class="iol-panel">
        <div class="iol-head">
            <h3><i class="fa-solid fa-crown" style="color:var(--brand-purple)"></i> <span id="subModalTitle">订阅创作者</span></h3>
            <button type="button" class="iol-close" id="closeSubscribe" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sub-modal-step active" id="subStep1">
            <div class="sub-creator">
                <div class="av av-sm" id="subCreatorAv" style="background-image:url('https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=100')"></div>
                <div>
                    <div style="font-size:13px;font-weight:700" id="subCreatorName">—</div>
                    <div style="font-size:11px;color:var(--t-tertiary)" id="subCreatorHint">订阅后可解锁专属内容与直播回放</div>
                </div>
            </div>
            <div class="sub-balance-bar" id="subBalanceBar"><span><i class="fa-solid fa-wallet"></i> 钱包可用余额</span><b id="subBalanceVal">— USDT</b></div>
            <div class="sub-plan-list">
                <button type="button" class="sub-plan active" data-price="28"><span><div class="p1">月度计划</div><div class="p2">可随时取消</div></span><span class="price">28 USDT</span></button>
                <button type="button" class="sub-plan" data-price="42"><span><div class="p1">季度计划</div><div class="p2">节省 12%</div></span><span class="price">42 USDT</span></button>
                <button type="button" class="sub-plan" data-price="150"><span><div class="p1">年度计划</div><div class="p2">含专属徽章</div></span><span class="price">150 USDT</span></button>
            </div>
            <p style="font-size:11px;color:var(--t-tertiary);margin:0 0 12px;line-height:1.45">支付将从钱包 USDT 余额扣除；余额不足将引导充值。</p>
            <button type="button" class="btn btn-primary btn-block" id="btnConfirmSubscribe"><i class="fa-solid fa-bolt"></i> 确认订阅并支付</button>
        </div>
        <div class="sub-modal-step" id="subStepRecharge">
            <div class="sub-recharge-hint" id="subRechargeHint">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>余额不足，需充值 <b id="subRechargeNeed">—</b> USDT 后再完成订阅。</span>
            </div>
            <div class="sub-pay-summary">
                <div class="row"><span>当前余额</span><span class="v" id="subRechargeBalNow">—</span></div>
                <div class="row"><span>订阅应付</span><span class="v" id="subRechargePayDue">—</span></div>
            </div>
            <div class="sub-recharge-amt-grid">
                <button type="button" class="sub-recharge-amt" data-amt="50">50 USDT</button>
                <button type="button" class="sub-recharge-amt active" data-amt="100">100 USDT</button>
                <button type="button" class="sub-recharge-amt" data-amt="200">200 USDT</button>
            </div>
            <p style="font-size:11px;color:var(--t-tertiary);line-height:1.45;margin-bottom:12px" id="subRechargeDemoNote"><i class="fa-solid fa-shield-halved"></i> 原型演示：确认充值即入账。</p>
            <div class="sub-step-actions">
                <button type="button" class="btn btn-secondary" id="btnSubRechargeBack">返回</button>
                <button type="button" class="btn btn-primary" id="btnSubRechargeConfirm"><i class="fa-solid fa-bolt"></i> 确认充值</button>
            </div>
            <button type="button" class="btn btn-secondary btn-block btn-sm" id="btnSubGoRecharge" style="margin-top:8px"><i class="fa-solid fa-arrow-up-right-from-square"></i> 前往充值页</button>
        </div>
        <div class="sub-modal-step" id="subStepPayPwd">
            <div class="sub-pay-summary">
                <div class="row"><span>订阅创作者</span><span class="v" id="subPayCreator">—</span></div>
                <div class="row"><span>支付金额</span><span class="v" id="subPayAmount">— USDT</span></div>
                <div class="row"><span>扣款后余额</span><span class="v" id="subPayAfterBal">— USDT</span></div>
            </div>
            <div class="sub-pwd-stage">
                <div class="ic-wrap"><i class="fa-solid fa-lock"></i></div>
                <h4 style="font-size:15px;font-weight:800;margin-bottom:4px">请输入支付密码</h4>
                <p style="font-size:11px;color:var(--t-tertiary)">6 位资金密码 · 演示密码 123456</p>
            </div>
            <div class="sub-pwd-input" id="subPwdDots" aria-hidden="true">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <div class="sub-pwd-pad" id="subPwdPad">
                <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
                <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
                <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
                <button type="button" data-action="clear"><i class="fa-solid fa-delete-left"></i></button>
                <button type="button" data-digit="0">0</button>
                <button type="button" data-action="submit"><i class="fa-solid fa-check"></i></button>
            </div>
            <div class="sub-step-actions">
                <button type="button" class="btn btn-secondary" id="btnSubPwdBack">上一步</button>
            </div>
        </div>
        <div class="sub-modal-step" id="subStep2">
            <div class="sub-result"><i class="fa-solid fa-circle-check"></i><h4>订阅成功</h4><p id="subResultText">你已成功订阅该创作者，专属内容已解锁。</p></div>
            <button type="button" class="btn btn-primary btn-block mt-16" id="btnDoneSubscribe">完成</button>
        </div>
    </div>
</div>
<div id="subToastHost" aria-live="polite" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9500;pointer-events:none"></div>
