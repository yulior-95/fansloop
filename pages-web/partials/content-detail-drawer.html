<!-- 内容详情右侧抽屉 · 由 profile / notifications 等页引入 -->
<div class="cdd-root" id="contentDetailDrawer" aria-hidden="true" role="dialog" aria-label="内容详情">
    <div class="cdd-backdrop"></div>
    <aside class="cdd-panel">
        <header class="cdd-head">
            <div class="cdd-author">
                <div class="av" id="cddAuthorAv"></div>
                <div class="meta">
                    <div class="n" id="cddAuthorName">Luna 🌙</div>
                    <div class="s">创作者</div>
                </div>
            </div>
            <button type="button" class="cdd-close" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
        </header>
        <div class="cdd-scroll">
            <div class="cdd-media">
                <img id="cddMediaImg" src="" alt="内容配图">
            </div>
            <div class="cdd-body">
                <h2 class="cdd-title" id="cddTitle">—</h2>
                <p class="cdd-desc" id="cddDesc">—</p>
                <div class="cdd-tags">#摄影 #富士山 #创作者日常</div>
            </div>
            <div class="cdd-actions">
                <button type="button" data-cdd-act="like"><i class="fa-regular fa-heart"></i><span id="cddLikeCount">0</span></button>
                <button type="button" data-cdd-act="forward"><i class="fa-solid fa-share"></i>转发</button>
                <button type="button" data-cdd-act="share"><i class="fa-solid fa-link"></i>分享</button>
                <button type="button" data-cdd-act="save"><i class="fa-regular fa-bookmark"></i>收藏</button>
            </div>
            <div class="cdd-comments-head">
                <span>评论</span>
                <span id="cddCommentsTotal">0 条评论</span>
            </div>
            <div class="cdd-comments" id="cddCommentList"></div>
        </div>
        <div class="cdd-compose">
            <input type="text" id="cddCommentInput" placeholder="说点什么…" autocomplete="off">
            <button type="button" id="cddSendComment">发送</button>
        </div>
        <div class="cdd-toast"></div>
    </aside>
</div>
