<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数字商品详情 · 跳转中</title>
<script>
(function () {
    var q = new URLSearchParams(location.search || '');
    var id = q.get('id') || '';
    var from = q.get('from') || 'store';
    var target;
    if (from === 'showcase' || from === 'creator-showcase') {
        target = 'creator-showcase.html?open=' + encodeURIComponent(id);
        if (q.get('name')) target += '&name=' + encodeURIComponent(q.get('name'));
        if (q.get('owner') === '1') target += '&owner=1';
    } else if (from === 'my') {
        target = 'my-digital-assets.html?open=' + encodeURIComponent(id);
    } else {
        target = 'digital-asset-store.html?open=' + encodeURIComponent(id);
    }
    location.replace(target);
})();
</script>
</head>
<body>
<p style="font-family:sans-serif;padding:24px;color:#666">正在打开商品详情… <a id="daDetailFallback" href="digital-asset-store.html">返回 Store</a></p>
<script>
(function () {
    var q = new URLSearchParams(location.search || '');
    var a = document.getElementById('daDetailFallback');
    if (a && q.get('id')) a.href = 'digital-asset-store.html?open=' + encodeURIComponent(q.get('id'));
})();
</script>
</body>
</html>
