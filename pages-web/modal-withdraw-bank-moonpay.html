<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MoonPay 提现到银行卡 · 确认</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/funds-moonpay.css">
<style>
body { background: var(--bg-app); }
.modal-mask { background: rgba(0,0,0,0.78); align-items: center; justify-content: center; }
.modal { max-width: 480px; width: 100%; margin: 20px; }
</style>
</head>
<body>

<div class="modal-mask" style="display:flex">
    <div class="modal">
        <div class="modal-head">
            <h2 style="font-size:15px"><span class="ic"><i class="fa-solid fa-money-bill-transfer"></i></span>提现到银行卡 · MoonPay
                <span class="sub" id="lbl">MoonPay Sell → 二次密码</span>
            </h2>
            <button class="close" onclick="location.href='withdraw-fiat.html'"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div id="mp">
                <div class="moonpay-mock-shot" style="background-image:url('https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=640&q=80'); min-height:200px;">
                    <div class="overlay">
                        <div class="capt"><i class="fa-solid fa-building-columns"></i> Off-ramp · USDT → EUR · SEPA / Card</div>
                        <div class="amt">卖出 500 USDT · 预计收款 ≈ €451.20</div>
                    </div>
                </div>

                <div class="moonpay-brand-row" style="margin-top:14px">
                    <div class="mp-logo">MP</div>
                    <div class="txt">
                        <div class="n">MoonPay 手续费已在页面展示</div>
                        <div class="s">平台另计配置费率 · 请以最终撮合与回执为准并形成账变</div>
                    </div>
                </div>

                <button type="button" class="btn btn-primary btn-block btn-lg" onclick="document.getElementById('mp').style.display='none';document.getElementById('pwd').style.display='block';document.getElementById('lbl').textContent='请输入二次密码';">
                    <i class="fa-regular fa-circle-check"></i> 我已确认 MoonPay 提现信息
                </button>
            </div>

            <div id="pwd" style="display:none">
                <div style="text-align:center;margin-bottom:12px;color:var(--t-secondary);font-size:13px">
                    二次密码通过后向平台提交提现单，MoonPay 完成后扣减余额
                </div>
                <div style="display:flex;gap:8px;justify-content:center;margin-bottom:14px;">
                    <span style="width:44px;height:50px;background:var(--bg-input);border:1px solid var(--brand-purple);border-radius:10px"></span>
                    <span style="width:44px;height:50px;background:var(--bg-input);border:1px solid var(--border);border-radius:10px"></span>
                    <span style="width:44px;height:50px;background:var(--bg-input);border:1px solid var(--border);border-radius:10px"></span>
                    <span style="width:44px;height:50px;background:var(--bg-input);border:1px solid var(--border);border-radius:10px"></span>
                    <span style="width:44px;height:50px;background:var(--bg-input);border:1px solid var(--border);border-radius:10px"></span>
                    <span style="width:44px;height:50px;background:var(--bg-input);border:1px solid var(--border);border-radius:10px"></span>
                </div>
                <div class="kv-list card" style="padding:14px">
                    <div class="kv-row" style="padding:6px 0"><span class="k">扣减</span><span class="v num">500.00 USDT + 费用</span></div>
                    <div class="kv-row" style="padding:6px 0;border-bottom:none"><span class="k">收款</span><span class="v num">EUR · **** 4421</span></div>
                </div>
                <button type="button" class="btn btn-primary btn-block btn-lg" style="margin-top:14px" onclick="location.href='withdraw-fiat-success.html'">
                    <i class="fa-solid fa-paper-plane"></i> 提交提现申请
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
