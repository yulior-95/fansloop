<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知入口原型 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/notification-prototype.css">
</head>
<body>
<div class="np-shell">
    <header class="np-header">
        <div class="np-brand">
            <i class="fa-solid fa-infinity"></i>
            <span>GOODFANS Creator Web</span>
        </div>
        <div class="np-actions">
            <button class="h-icon" title="通知" onclick="location.href='notifications.html?tab=unread'">
                <i class="fa-regular fa-bell"></i>
                <span class="dot"></span>
            </button>
            <button class="h-icon" title="消息">
                <i class="fa-regular fa-comments"></i>
            </button>
        </div>
    </header>

    <main class="np-main">
        <section class="nf-card" style="padding:24px">
            <h1 style="margin:0 0 8px">首页头部交互（高保真）</h1>
            <p style="margin:0;color:#9ca3af;font-size:13px;line-height:1.65">
                设计目标：点击右上角通知图标后，直接进入通知中心的「未读」列表。该页面用于还原你给出的 DOM 节点
                <code>button.h-icon[title=通知]</code> 的交互入口。
            </p>
            <div style="margin-top:16px;padding:12px;border:1px dashed rgba(148,163,184,.35);border-radius:10px;font-size:12px;color:#aeb4c3">
                交互规则：<br>
                1) 点击通知图标 -> 跳转 `notifications.html?tab=unread`<br>
                2) 未读总量将由通知中心页面内部状态驱动
            </div>
        </section>
    </main>
</div>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
