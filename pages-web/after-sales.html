<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>售后与帮助 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="../js-web/fl-theme-boot.js"></script>
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/after-sales.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
</head>
<body class="page-after-sales">

<div class="app-shell">
    <aside class="app-sidebar"></aside>

    <header class="app-header">
        <div class="h-search h-search-live h-search-unified">
            <div class="hs-inner">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="搜索…" autocomplete="off" />
            </div>
            <div class="gs-drop"></div>
        </div>
        <div class="h-actions">
            <button class="h-icon"><i class="fa-regular fa-bell"></i></button>
            <div class="h-avatar" style="background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div>
        </div>
    </header>

    <main class="app-main">
        <div class="page-head">
            <div class="ph-l">
                <div class="crumb"><a href="settings.html">设置</a><i class="fa-solid fa-chevron-right"></i><span class="curr">售后与帮助</span></div>
                <h1>售后与帮助</h1>
                <p>订单争议、充值提现、数字商品与订阅问题</p>
            </div>
        </div>

        <div class="as-web-wrap">
            <p class="as-web-intro">数字作品购买后 <strong>7 日内</strong>可申请退款（如无法打开 / 无法播放）。遇异常请先保存订单号与截图，再通过下方入口提交。</p>

            <div class="as-web-card">
                <div class="hd">快速处理</div>
                <a class="as-web-row" href="transaction-contact.html" id="asSupportLink">
                    <div class="ic" style="background:linear-gradient(135deg,#06b6d4,#3b82f6)"><i class="fa-solid fa-headset"></i></div>
                    <div class="m"><div class="t">联系客服</div><div class="s">充值、提现、订阅与账号问题 · IM 工单</div></div>
                    <i class="fa-solid fa-chevron-right chev"></i>
                </a>
                <a class="as-web-row" href="my-appeals.html">
                    <div class="ic" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"><i class="fa-solid fa-gavel"></i></div>
                    <div class="m"><div class="t">我的申诉</div><div class="s">账变 / 提现 / 打赏争议 · 查看进度</div></div>
                    <i class="fa-solid fa-chevron-right chev"></i>
                </a>
                <a class="as-web-row" href="transactions.html">
                    <div class="ic" style="background:linear-gradient(135deg,#a855f7,#ec4899)"><i class="fa-solid fa-receipt"></i></div>
                    <div class="m"><div class="t">账变记录</div><div class="s">从单条交易发起申诉或联系客服</div></div>
                    <i class="fa-solid fa-chevron-right chev"></i>
                </a>
            </div>

            <div class="as-web-card">
                <div class="hd">说明</div>
                <div class="as-web-tip">链上交易提交后一般不可撤销。严重违规可配合平台风控处理；客服与申诉入口与 H5 一致，均从本页进入。</div>
            </div>
        </div>
    </main>
</div>

<script src="../js-web/app-sidebar-global.js"></script>
<script>
(function () {
    var params = new URLSearchParams(location.search || '');
    if (params.get('support') === '1') {
        var link = document.getElementById('asSupportLink');
        if (link) link.click();
    }
})();
</script>
</body>
</html>
