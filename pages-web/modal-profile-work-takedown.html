<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>下架确认弹窗 · 作品管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/profile-works.css">
<style>
body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-canvas);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
.demo-bg {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(180deg, rgba(7,7,13,0.3), rgba(7,7,13,0.92)),
        url('https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?w=1600&q=80') center/cover;
    filter: blur(2px);
    z-index: 0;
}
.demo-caption {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    font-size: 11px;
    color: var(--t-tertiary);
    background: rgba(0,0,0,0.55);
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
}
.pf-modal { display: flex; position: relative; z-index: 2; background: rgba(0,0,0,0.62); }
</style>
</head>
<body>
<div class="demo-bg" aria-hidden="true"></div>
<p class="demo-caption">高保真片段 · 个人主页作品「下架」二次确认（叠在个人主页之上）</p>

<div class="pf-modal show" role="dialog" aria-labelledby="modalWorkTakedownHd">
    <div class="md-panel">
        <div class="md-head" id="modalWorkTakedownHd">
            <span class="ic-warn"><i class="fa-solid fa-eye-slash"></i></span>
            确认下架作品？
        </div>
        <div class="md-body">
            下架后作品将从<strong>已发布</strong>列表移除，并出现在「下架」Tab；访客在创作者首页与作品流中不可见。可随时在「下架」中删除。
            <br><br>作品：<strong>富士山脚下晨雾 · 4K 航拍</strong>
        </div>
        <div class="md-actions">
            <button type="button" class="ghost">取消</button>
            <button type="button" class="danger">确认下架</button>
        </div>
    </div>
</div>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
