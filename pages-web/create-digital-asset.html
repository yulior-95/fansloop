<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>创建数字资产 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/digital-assets.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-section">橱窗</div>
        <div class="s-item active"><span class="ic"><i class="fa-solid fa-gem"></i></span><span class="lb">创建数字资产</span></div>
        <div class="s-item" onclick="location.href='creator-showcase.html?owner=1'"><span class="ic"><i class="fa-solid fa-store"></i></span><span class="lb">我的橱窗</span></div>
        <div class="s-item" onclick="location.href='affiliate-catalog.html'"><span class="ic"><i class="fa-solid fa-bag-shopping"></i></span><span class="lb">实体选品库</span></div>
        <div class="s-item" onclick="location.href='creator-profile.html'"><span class="ic"><i class="fa-regular fa-user"></i></span><span class="lb">创作者主页</span></div>
    </aside>
    <header class="app-header">
        <div class="h-actions" style="margin-left:auto">
            <button class="btn" onclick="location.href='creator-showcase.html?owner=1'">返回我的橱窗</button>
        </div>
    </header>
    <main class="app-main">
        <div class="page-head">
            <div class="ph-l">
                <h1>创建数字资产</h1>
                <p>上传数字内容并设置发行信息，提交后经平台审核上架 Creator Store。</p>
            </div>
        </div>
        <form class="da-form" id="daCreateForm" onsubmit="return false">
            <div class="field">
                <label for="daTitle">商品名称</label>
                <input id="daTitle" type="text" placeholder="例如：Neon Echo · Genesis Pass" maxlength="80">
            </div>
            <div class="field">
                <label for="daDesc">商品描述</label>
                <textarea id="daDesc" placeholder="描述权益、使用方式与发放说明"></textarea>
            </div>
            <div class="field">
                <label for="daCover">商品封面 URL</label>
                <input id="daCover" type="url" placeholder="https://…">
            </div>
            <div class="row2">
                <div class="field">
                    <label for="daAssetType">商品类型</label>
                    <select id="daAssetType"></select>
                </div>
                <div class="field">
                    <label for="daPrice">价格（USDT）</label>
                    <input id="daPrice" type="number" min="0.01" step="0.01" value="10">
                </div>
            </div>
            <div class="field">
                <label for="daContent">数字内容文件 URL</label>
                <input id="daContent" type="url" placeholder="图片 / 视频 / 权益凭证链接">
            </div>
            <div class="row2">
                <div class="field">
                    <label for="daSupplyMode">发行方式</label>
                    <select id="daSupplyMode">
                        <option value="limited">限量发行</option>
                        <option value="unlimited">无限发行</option>
                    </select>
                </div>
                <div class="field" id="daSupplyTotalWrap">
                    <label for="daSupplyTotal">发行数量</label>
                    <input id="daSupplyTotal" type="number" min="1" step="1" value="100">
                </div>
            </div>
            <div class="da-form-actions">
                <button type="button" class="btn" id="btnDaSaveDraft"><i class="fa-regular fa-floppy-disk"></i> 保存草稿</button>
                <button type="button" class="btn btn-primary" id="btnDaSubmit"><i class="fa-solid fa-paper-plane"></i> 提交审核</button>
            </div>
            <p class="da-note" style="margin-top:14px">销售状态由审核与库存自动驱动：草稿 → 待审核 → 上架 / 驳回；限量售罄自动标记售罄。</p>
        </form>
    </main>
</div>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/mall-commerce-config-store.js"></script>
<script src="../js-web/digital-assets-store.js"></script>
<script src="../js-web/digital-asset-orders-store.js"></script>
<script src="../js-web/digital-asset-pages.js"></script>
<script>DigitalAssetPages.initCreatePage();</script>
</body>
</html>
