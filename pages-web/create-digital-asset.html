<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>创建数字商品 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/digital-assets.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-section">橱窗</div>
        <div class="s-item active"><span class="ic"><i class="fa-solid fa-images"></i></span><span class="lb">创建数字商品</span></div>
        <div class="s-item" onclick="location.href='creator-showcase.html?owner=1&tab=digital'"><span class="ic"><i class="fa-solid fa-store"></i></span><span class="lb">我的橱窗</span></div>
        <div class="s-item" onclick="location.href='affiliate-catalog.html'"><span class="ic"><i class="fa-solid fa-bag-shopping"></i></span><span class="lb">实体选品库</span></div>
        <div class="s-item" onclick="location.href='creator-profile.html'"><span class="ic"><i class="fa-regular fa-user"></i></span><span class="lb">创作者主页</span></div>
    </aside>
    <header class="app-header">
        <div class="h-actions" style="margin-left:auto">
            <button class="btn" type="button" id="daBackShowcase">返回我的橱窗</button>
        </div>
    </header>
    <main class="app-main">
        <div class="page-head">
            <div class="ph-l">
                <h1>创建数字商品</h1>
            </div>
        </div>

        <form class="da-form" id="daCreateForm" onsubmit="return false">
            <h2 class="da-step-title">类型与基础</h2>
            <div class="field">
                <label>商品类型 <span class="req">*</span></label>
                <div class="da-type-cards da-type-cards--3" id="daTypeCards" role="radiogroup" aria-label="商品类型">
                    <button type="button" class="da-type-card is-active" data-type="image" role="radio" aria-checked="true">
                        <i class="fa-solid fa-images"></i>
                        <strong>图片合集</strong>
                        <span>多张写真打包售卖</span>
                    </button>
                    <button type="button" class="da-type-card" data-type="video" role="radio" aria-checked="false">
                        <i class="fa-solid fa-film"></i>
                        <strong>视频作品</strong>
                        <span>单个或多个成片售卖</span>
                    </button>
                    <button type="button" class="da-type-card" data-type="bundle" role="radio" aria-checked="false">
                        <i class="fa-solid fa-layer-group"></i>
                        <strong>图视作品包</strong>
                        <span>图片 + 视频一起交付</span>
                    </button>
                </div>
                <select id="daAssetType" hidden></select>
            </div>
            <div class="field">
                <label for="daTitle">作品名称 <span class="req">*</span></label>
                <input id="daTitle" type="text" placeholder="例如：富士山日出 · 4K 写真合集" maxlength="80">
            </div>
            <div class="field">
                <label for="daDesc">作品描述 <span class="req">*</span></label>
                <textarea id="daDesc" placeholder="介绍拍摄主题、张数 / 时长、交付内容等"></textarea>
            </div>

            <h2 class="da-step-title" style="margin-top:8px">作品素材</h2>
            <div class="field">
                <label>商品首图 <span class="req">*</span></label>
                <p class="da-field-hint">列表与详情主图，建议 1:1</p>
                <div class="da-hero-pick">
                    <div class="da-hero-preview" id="daCoverPreview">
                        <img alt="首图预览" id="daCoverImg" hidden>
                        <span class="ph" id="daCoverPh"><i class="fa-solid fa-image"></i>暂无首图</span>
                        <span class="tag" id="daCoverTag" hidden>首图</span>
                    </div>
                    <div class="da-hero-ops">
                        <input type="file" id="daCoverFile" accept="image/*" hidden>
                        <div class="da-hero-btns">
                            <button type="button" class="btn btn-sm btn-primary" id="btnDaCoverUpload"><i class="fa-solid fa-arrow-up-from-bracket"></i> 上传首图</button>
                            <button type="button" class="btn btn-sm" id="btnDaCoverClear" hidden>移除首图</button>
                        </div>
                        <input id="daCover" type="url" placeholder="或粘贴图片 URL：https://…">
                        <p class="da-field-hint" id="daCoverState">未设置首图，可上传本地图片或粘贴 URL</p>
                    </div>
                </div>
            </div>
            <div class="field" id="daImageField">
                <label>写真图片</label>
                <p class="da-field-hint">可上传多张。至少 1 张（无写真时用首图）</p>
                <div class="da-work-grid" id="daImageGrid"></div>
                <div class="da-hero-btns" style="margin-top:8px">
                    <input type="file" id="daImageFiles" accept="image/*" multiple hidden>
                    <button type="button" class="btn btn-sm" id="btnDaImageUpload"><i class="fa-solid fa-plus"></i> 上传图片</button>
                    <input id="daImageUrl" type="url" placeholder="或粘贴图片 URL 后回车" style="flex:1;min-width:180px">
                </div>
            </div>
            <div class="field" id="daVideoField" hidden>
                <label>视频</label>
                <p class="da-field-hint">可添加多个视频 URL，至少 1 个</p>
                <div class="da-work-grid" id="daVideoGrid"></div>
                <div class="da-hero-btns" style="margin-top:8px">
                    <button type="button" class="btn btn-sm" id="btnDaVideoAdd"><i class="fa-solid fa-plus"></i> 添加视频</button>
                    <input id="daVideoUrl" type="url" placeholder="粘贴视频 URL，例如 https://…/clip.mp4" style="flex:1;min-width:180px">
                </div>
            </div>

            <h2 class="da-step-title" style="margin-top:8px">售卖设置</h2>
            <div class="field">
                <label for="daPrice">价格（USDT） <span class="req">*</span></label>
                <input id="daPrice" type="number" min="0.01" step="0.01" value="4.5">
            </div>
            <div class="field">
                <label>商品个数 <span class="req">*</span></label>
                <div class="da-type-cards" id="daSupplyCards" role="radiogroup" aria-label="商品个数">
                    <button type="button" class="da-type-card is-active" data-supply="limited" role="radio" aria-checked="true">
                        <i class="fa-solid fa-hashtag"></i>
                        <strong>限量</strong>
                        <span>设定可售份数，卖完自动变为「已售罄」</span>
                    </button>
                    <button type="button" class="da-type-card" data-supply="unlimited" role="radio" aria-checked="false">
                        <i class="fa-solid fa-infinity"></i>
                        <strong>不限个数</strong>
                        <span>不限制购买份数，可一直售卖</span>
                    </button>
                </div>
                <select id="daSupplyMode" hidden>
                    <option value="limited" selected>限量</option>
                    <option value="unlimited">不限个数</option>
                </select>
            </div>
            <div class="field" id="daSupplyTotalWrap">
                <label for="daSupplyTotal">可售份数 <span class="req">*</span></label>
                <input id="daSupplyTotal" type="number" min="1" step="1" value="100">
            </div>
            <div class="field">
                <label>上架状态 <span class="req">*</span></label>
                <div class="da-type-cards" id="daListCards" role="radiogroup" aria-label="上架状态">
                    <button type="button" class="da-type-card is-active" data-list="auto" role="radio" aria-checked="true">
                        <i class="fa-solid fa-shop"></i>
                        <strong>上架</strong>
                        <span>审核通过后立即出现在橱窗与 Creator Store</span>
                    </button>
                    <button type="button" class="da-type-card" data-list="manual" role="radio" aria-checked="false">
                        <i class="fa-solid fa-box-archive"></i>
                        <strong>下架</strong>
                        <span>审核通过后保持下架，橱窗再手动上架</span>
                    </button>
                </div>
                <select id="daListState" hidden>
                    <option value="auto" selected>上架</option>
                    <option value="manual">下架</option>
                </select>
            </div>

            <label class="da-check">
                <input type="checkbox" id="daAgree" checked>
                我确认拥有该作品版权，内容符合平台规范，同意提交审核
            </label>

            <div class="da-form-actions">
                <button type="button" class="btn" id="btnDaSaveDraft">保存草稿</button>
                <div style="flex:1"></div>
                <button type="button" class="btn btn-primary" id="btnDaSubmit">提交审核</button>
            </div>
        </form>
    </main>
</div>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/user-prototype-registry.js"></script>
<script src="../js-web/digital-assets-store.js"></script>
<script src="../js-web/digital-asset-pages.js"></script>
<script>DigitalAssetPages.initCreatePage();</script>
</body>
</html>
