<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>审核中 · KYC · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/kyc-subpages.css">
</head>
<body>
<div class="kyc-lite-shell">
    <header class="kyc-lite-top">
        <div class="brand"><span class="lg"><i class="fa-solid fa-hourglass-half"></i></span> 审核</div>
        <a id="linkBack" href="#">返回</a>
    </header>
    <main class="kyc-lite-main">
        <div class="kyc-flow-max">
            <div class="kyc-step-bar">
                <div class="step done">1</div><div class="step done">2</div><div class="step done">3</div>
                <div class="step on">4 审核</div><div class="step">5</div>
            </div>

            <div id="panelReview" class="kyc-state-center" style="padding-top:28px">
                <div class="kyc-state-icon wait pulse"><i class="fa-solid fa-spinner"></i></div>
                <h2>资料已提交，正在审核，请稍候</h2>
                <p>Verify 正在进行审核。完成后将通过状态查询接口更新结果，请耐心等待。</p>
                <div class="kyc-meta-grid card" style="padding:14px 16px;margin-top:20px">
                    <div>申请单号 <span id="metaId">—</span></div>
                    <div>认证来源 <span>证件认证</span></div>
                    <div>当前状态 <span style="color:#FCD34D">审核中</span></div>
                </div>
                <div class="kyc-actions-row" style="margin-top:18px;justify-content:center">
                    <button type="button" class="btn btn-secondary btn-sm" id="btnSimOk">模拟审核通过</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="btnSimFail">模拟审核未通过</button>
                </div>
            </div>

            <div id="panelOk" class="kyc-state-center" style="padding-top:28px;display:none">
                <div class="kyc-state-icon ok"><i class="fa-solid fa-circle-check"></i></div>
                <h2>审核通过</h2>
                <p>你的 KYC 认证已通过，可进行提现等操作。</p>
                <button type="button" class="btn btn-primary btn-lg btn-block" id="btnOkContinue" style="margin-top:18px"><i class="fa-solid fa-arrow-right"></i> 继续</button>
            </div>

            <div id="panelFail" class="kyc-state-center" style="padding-top:28px;display:none">
                <div class="kyc-state-icon fail"><i class="fa-solid fa-circle-xmark"></i></div>
                <h2>审核未通过</h2>
                <p id="failReasonPending" style="font-size:13px;color:var(--t-secondary)"></p>
                <button type="button" class="btn btn-primary btn-lg" id="btnRetryPending" style="margin-top:16px"><i class="fa-solid fa-rotate-right"></i> 重新人脸识别</button>
            </div>
        </div>
    </main>
    <footer class="kyc-lite-foot">结果将同步至设置页与提现门槛校验</footer>
</div>
<script src="../js-web/user-prototype-registry.js"></script>
<script src="../js-web/user-assets-store.js"></script>
<script src="../js-web/auth-session.js"></script>
<script src="../js-web/kyc-store.js"></script>
<script src="../js-web/kyc-flow-nav.js"></script>
<script src="../js-web/kyc-toast.js"></script>
<script src="../js-web/kyc-doc-pending.js"></script>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
