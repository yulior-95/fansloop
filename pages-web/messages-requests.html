<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消息请求 · FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/messages-im.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<style>
.app-main { padding: 24px 28px; overflow: auto; }
.req-hint {
    padding: 12px 14px;
    background: rgba(168,85,247,0.08);
    border: 1px solid rgba(168,85,247,0.2);
    border-radius: var(--r-md);
    font-size: 12.5px;
    color: var(--t-secondary);
    line-height: 1.55;
    margin-bottom: 18px;
}
#msgSubToast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 10px 18px; background: rgba(30,30,45,0.95); border-radius: 999px;
    font-size: 13px; opacity: 0; transition: 0.2s; z-index: 9000; pointer-events: none;
}
#msgSubToast.show { opacity: 1; }
</style>
</head>
<body data-msg-sub="requests" class="msg-sub-page">

<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">FansLoop<span>Web3 Creator</span></div></div>
        <div class="s-section">主导航</div>
        <div class="s-item" onclick="location.href='home.html'"><span class="ic"><i class="fa-solid fa-house"></i></span><span class="lb">首页</span></div>
        <div class="s-item active" onclick="location.href='messages.html'"><span class="ic"><i class="fa-regular fa-comments"></i></span><span class="lb">消息</span></div>
        <div class="s-item" onclick="location.href='notifications.html'"><span class="ic"><i class="fa-regular fa-bell"></i></span><span class="lb">通知</span></div>
    </aside>
    <header class="app-header">
        <div class="h-search h-search-live h-search-unified"><div class="hs-inner"><i class="fa-solid fa-magnifying-glass"></i><input type="search" placeholder="搜索…" /></div><div class="gs-drop"></div></div>
        <div class="h-actions"><button class="h-cta" onclick="location.href='wallet.html'"><i class="fa-solid fa-bolt"></i>充值</button></div>
    </header>
    <main class="app-main">
        <div class="msg-sub-wrap">
            <a class="back" href="messages.html"><i class="fa-solid fa-arrow-left"></i> 返回私信</a>
            <h1>消息请求 <span class="tag req-count-badge" style="font-size:12px;vertical-align:middle">3</span></h1>
            <p style="font-size:13px;color:var(--t-tertiary);margin-bottom:16px">未关注你的用户发来的私信会出现在这里，接受后才会进入主会话列表（与设置 · 谁可以私信我 一致）。</p>
            <div class="req-hint"><i class="fa-solid fa-shield-halved" style="color:var(--brand-purple)"></i> 接受前对方无法知道你已读；拒绝后将不再收到该用户的请求。</div>

            <div class="req-row" data-name="旅行小白">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=120')"></div>
                <div class="body">
                    <div style="font-weight:700;font-size:14px">旅行小白</div>
                    <div style="font-size:12px;color:var(--t-tertiary);margin-top:4px">你好，想咨询一下摄影工作坊怎么报名？</div>
                    <div style="font-size:11px;color:var(--t-tertiary);margin-top:6px">10 分钟前 · 陌生人</div>
                </div>
                <div class="acts">
                    <button type="button" class="btn btn-sm" data-reject>拒绝</button>
                    <button type="button" class="btn btn-sm" style="background:var(--brand-grad);color:#fff;border:none" data-accept>接受</button>
                </div>
            </div>
            <div class="req-row" data-name="胶片爱好者">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120')"></div>
                <div class="body">
                    <div style="font-weight:700;font-size:14px">胶片爱好者</div>
                    <div style="font-size:12px;color:var(--t-tertiary);margin-top:4px">很喜欢你的作品，可以合作吗？</div>
                    <div style="font-size:11px;color:var(--t-tertiary);margin-top:6px">1 小时前</div>
                </div>
                <div class="acts">
                    <button type="button" class="btn btn-sm" data-reject>拒绝</button>
                    <button type="button" class="btn btn-sm" style="background:var(--brand-grad);color:#fff;border:none" data-accept>接受</button>
                </div>
            </div>
            <div class="req-row" data-name="ad_robot_888">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?w=120')"></div>
                <div class="body">
                    <div style="font-weight:700;font-size:14px">ad_robot_888</div>
                    <div style="font-size:12px;color:var(--t-tertiary);margin-top:4px">加微信领福利…</div>
                    <div style="font-size:11px;color:#F87171;margin-top:6px"><i class="fa-solid fa-triangle-exclamation"></i> 命中关键词「加微信」已自动折叠</div>
                </div>
                <div class="acts">
                    <button type="button" class="btn btn-sm" data-reject>拒绝</button>
                    <button type="button" class="btn btn-sm" data-accept>接受</button>
                </div>
            </div>
        </div>
    </main>
</div>
<div id="msgSubToast"></div>
<script src="../js-web/global-search.js"></script>
<script src="../js-web/messages-sub-pages.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
</body>
</html>
