<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>积分流水 · FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/dev-glass-note.css">
<link rel="stylesheet" href="../css-web/home-points.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<style>
.pl-page-head { margin-bottom: 20px; }
.pl-page-head h1 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.pl-page-head p { font-size: 13px; color: var(--t-secondary); margin-top: 6px; line-height: 1.55; }
.pl-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 22px;
}
@media (max-width: 900px) { .pl-summary { grid-template-columns: repeat(2, 1fr); } }
.pl-summary .card {
    padding: 16px;
    border-radius: var(--r-lg);
    background: var(--bg-card);
    border: 1px solid var(--border);
}
.pl-summary .card .k { font-size: 11px; color: var(--t-tertiary); margin-bottom: 6px; }
.pl-summary .card .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pl-summary .card.avail .v { color: #FDE68A; }
.pl-summary .card.frozen .v { color: #93C5FD; }
.pl-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}
.pl-filters button {
    padding: 7px 14px;
    border-radius: var(--r-pill);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--t-secondary);
    cursor: pointer;
}
.pl-filters button.active {
    background: rgba(168,85,247,0.15);
    border-color: rgba(168,85,247,0.45);
    color: #E9D5FF;
}
.pl-table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
}
.pl-table { width: 100%; border-collapse: collapse; }
.pl-table th {
    text-align: left;
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 700;
    color: var(--t-tertiary);
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
}
.pl-table td {
    padding: 14px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
}
.pl-table tr:last-child td { border-bottom: none; }
.pl-table tr:hover td { background: var(--bg-hover); }
.pl-status {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 700;
}
.pl-status.available { background: rgba(16,185,129,0.15); color: #6EE7B7; }
.pl-status.frozen { background: rgba(59,130,246,0.15); color: #93C5FD; }
.pl-status.spent { background: rgba(148,163,184,0.12); color: #94A3B8; }
.pl-amt.plus { color: #6EE7B7; font-weight: 800; }
.pl-amt.minus { color: #FCA5A5; font-weight: 800; }
</style>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand">
            <div class="logo"><i class="fa-solid fa-infinity"></i></div>
            <div class="name">FansLoop<span>Web3 Creator</span></div>
        </div>
        <div class="s-section">主导航</div>
        <div class="s-item" onclick="location.href='home.html'"><span class="ic"><i class="fa-solid fa-house"></i></span><span class="lb">首页</span></div>
        <div class="s-section">资产</div>
        <div class="s-item" onclick="location.href='wallet.html'"><span class="ic"><i class="fa-solid fa-wallet"></i></span><span class="lb">钱包</span></div>
        <div class="s-item" onclick="location.href='points-mall.html'"><span class="ic"><i class="fa-solid fa-store"></i></span><span class="lb">积分商城</span></div>
        <div class="s-item active"><span class="ic"><i class="fa-solid fa-list-ul"></i></span><span class="lb">积分流水</span></div>
        <div class="s-section">个人</div>
        <div class="s-item" onclick="location.href='profile.html'"><span class="ic"><i class="fa-regular fa-user"></i></span><span class="lb">我的主页</span></div>
    </aside>

    <header class="app-header">
        <div class="h-search h-search-live h-search-unified">
            <div class="hs-inner">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="搜索任务名称、订单号…" />
            </div>
        </div>
        <div class="h-actions">
            <button type="button" class="h-points" id="hPointsBtn" title="积分"></button>
            <button class="h-cta" onclick="location.href='points-mall.html'"><i class="fa-solid fa-store"></i>积分商城</button>
            <div class="h-avatar" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div>
        </div>
    </header>

    <main class="app-main">
        <div class="breadcrumb-row">
            <a href="home.html">首页</a><i class="fa-solid fa-chevron-right"></i>
            <a href="points-mall.html">积分商城</a><i class="fa-solid fa-chevron-right"></i>
            <span style="color:var(--t-secondary)">积分流水</span>
        </div>

        <div class="pl-page-head">
            <h1><i class="fa-solid fa-receipt" style="color:#FBBF24"></i>积分获取与消耗明细</h1>
            <p>完整记录每一笔积分变动：任务奖励、邀请冷静期、商城兑换与转盘消耗。数据与首页积分条、抽屉同源 <code>home-points-store.js</code>。</p>
        </div>

        <div class="pl-summary" id="plSummary"></div>

        <div class="pl-filters" id="plFilters">
            <button type="button" class="active" data-filter="all">全部</button>
            <button type="button" data-filter="earn">获取</button>
            <button type="button" data-filter="spend">消耗</button>
            <button type="button" data-filter="frozen">冷静中</button>
        </div>

        <div class="pl-table-wrap">
            <table class="pl-table">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>来源 / 用途</th>
                        <th>状态</th>
                        <th style="text-align:right">积分变动</th>
                    </tr>
                </thead>
                <tbody id="plTableBody"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="../js-web/invite-reward-config.js"></script>
<script src="../js-web/points-tier-config.js"></script>
<script src="../js-web/home-points-store.js"></script>
<link rel="stylesheet" href="../css-web/points-tier.css">
<script src="../js-web/points-tier-ledger.js"></script>
<script>
(function () {
    var S = window.FLHomePoints;
    var currentFilter = 'all';

    function statusLabel(row) {
        if (row.status === 'frozen') return '<span class="pl-status frozen">冷静中</span>';
        if (row.type === 'spend') return '<span class="pl-status spent">已消耗</span>';
        return '<span class="pl-status available">可用</span>';
    }

    function renderSummary(data) {
        var w = data.wallet;
        document.getElementById('plSummary').innerHTML =
            '<div class="card avail"><div class="k">可用积分</div><div class="v">' + S.formatPoints(w.available) + '</div></div>' +
            '<div class="card frozen"><div class="k">冷静中</div><div class="v">' + S.formatPoints(w.frozen) + '</div></div>' +
            '<div class="card"><div class="k">今日已获</div><div class="v" style="color:#C084FC">' + S.formatPoints(w.todayEarned) + '</div></div>' +
            '<div class="card"><div class="k">今日上限</div><div class="v">' + S.formatPoints(w.todayCap) + '</div></div>';
    }

    function renderTable(data) {
        var rows = data.ledger.filter(function (r) {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'earn') return r.type === 'earn';
            if (currentFilter === 'spend') return r.type === 'spend';
            if (currentFilter === 'frozen') return r.status === 'frozen';
            return true;
        });
        document.getElementById('plTableBody').innerHTML = rows.map(function (r) {
            var cls = r.points > 0 ? 'plus' : 'minus';
            var txt = r.points > 0 ? '+' + S.formatPoints(r.points) : S.formatPoints(r.points);
            var note = r.status === 'frozen' && r.unfreezeAt ? ' · ' + r.unfreezeAt + ' 解冻' : '';
            return '<tr><td style="font-size:12px;color:var(--t-tertiary)">' + r.time + '</td>' +
                '<td><strong>' + r.task + '</strong>' + (note ? '<div style="font-size:11px;color:var(--t-tertiary);margin-top:2px">' + note + '</div>' : '') + '</td>' +
                '<td>' + statusLabel(r) + '</td>' +
                '<td style="text-align:right" class="pl-amt ' + cls + '">' + txt + '</td></tr>';
        }).join('');
    }

    S.fetchPointsData().then(function (data) {
        renderSummary(data);
        renderTable(data);
        var btn = document.getElementById('hPointsBtn');
        if (btn) {
            btn.innerHTML = '<span class="ic"><i class="fa-solid fa-coins"></i></span><span class="val">' +
                S.formatPoints(data.wallet.available) + '</span><span class="sub">积分</span>';
            btn.onclick = function () { location.href = 'home.html?pointsDrawer=open'; };
        }
    });

    document.getElementById('plFilters').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-filter]');
        if (!btn) return;
        currentFilter = btn.getAttribute('data-filter');
        document.querySelectorAll('#plFilters button').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        S.fetchPointsData().then(renderTable);
    });
})();
</script>
</body>
</html>
