<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>确认链上提现 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/funds-moonpay.css">
<style>
body { background: var(--bg-app); }
.modal-mask { background: rgba(0,0,0,0.78); align-items: center; justify-content: center; }
.modal { max-width: 480px; width: 100%; margin: 20px; }
</style>
</head>
<body>

<div class="modal-mask" style="display:flex">
    <div class="modal">
        <div class="modal-head">
            <h2 style="font-size:15px"><span class="ic"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>确认链上提现
                <span class="sub" id="lbl">安全收银台 · 二次密码</span>
            </h2>
            <button class="close" onclick="location.href='withdraw-usdt.html'"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <div id="mp">
                <div class="moonpay-mock-shot" style="background-image:url('https://images.unsplash.com/photo-1621761191319-6d1d78054d17?w=640&q=80'); min-height:200px;">
                    <div class="overlay">
                        <div class="capt"><i class="fa-solid fa-wallet"></i> Send USDT (TRC20) · 含网络费用</div>
                        <div class="amt">200 USDT → TG3X…Jozs</div>
                    </div>
                </div>
                <div class="notice notice-info" style="margin-top:12px">
                    <i class="fa-solid fa-circle-info ni"></i>
                    <span>参考实时汇率与预览费用仅供参考；链上清算完成后以实际回执为准。</span>
                </div>
                <button type="button" class="btn btn-primary btn-block btn-lg" style="margin-top:14px" onclick="document.getElementById('mp').style.display='none';document.getElementById('pwd').style.display='block';document.getElementById('lbl').textContent='二次密码';">
                    <i class="fa-solid fa-check"></i> 提交提现订单
                </button>
            </div>
            <div id="pwd" style="display:none">
                <div style="text-align:center;font-size:13px;color:var(--t-secondary);margin-bottom:12px">输入二次密码以确认平台侧扣款与提现订单</div>
                <div style="display:flex;gap:8px;justify-content:center;">
                    <span style="width:42px;height:48px;border-radius:10px;border:1.5px solid var(--brand-purple);background:var(--bg-input)"></span>
                    <span style="width:42px;height:48px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-input)"></span>
                    <span style="width:42px;height:48px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-input)"></span>
                    <span style="width:42px;height:48px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-input)"></span>
                    <span style="width:42px;height:48px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-input)"></span>
                    <span style="width:42px;height:48px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg-input)"></span>
                </div>
                <button type="button" class="btn btn-primary btn-block btn-lg" style="margin-top:18px" onclick="location.href='withdraw-fiat-success.html'">
                    <i class="fa-solid fa-bolt"></i> 确认提交
                </button>
            </div>
        </div>
    </div>
</div>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
