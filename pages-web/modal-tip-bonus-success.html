<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>打赏成功 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/gift-tip-bonus.css">
<style>
body {
    background: linear-gradient(135deg, #1B0B3A, #2D1B69 50%, #4A1063);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
}
.tip-success-recipient {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    border: 1px solid var(--border);
}
.tip-success-recipient .av {
    width: 40px; height: 40px; border-radius: 50%;
    background-size: cover; flex-shrink: 0;
}
.tip-success-recipient .nm { font-size: 13px; font-weight: 700; }
.tip-success-recipient .sub { font-size: 11px; color: var(--t-tertiary); }
.tip-success-ft {
    padding: 0 24px 24px;
    display: flex; gap: 10px;
}
.tip-success-ft .btn { flex: 1; height: 44px; }
</style>
</head>
<body>

<div class="tip-success-card">
    <div class="tip-success-hero">
        <div class="burst">💎</div>
        <h2>打赏已送出！</h2>
        <p>礼物特效已送达直播间 · 创作者已收到款项</p>
    </div>
    <div class="tip-success-bd">
        <div class="tip-success-recipient">
            <div class="av" style="background-image:url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=120')"></div>
            <div>
                <div class="nm">NovaPlay <i class="fa-solid fa-circle-check" style="color:#06B6D4;font-size:11px"></i></div>
                <div class="sub">钻石礼物 × 1 · 直播打赏</div>
            </div>
        </div>
        <div class="tip-success-split">
            <div class="sr"><span>你支付</span><span>200 USDT</span></div>
            <div class="sr"><span>平台补贴（加成卡 · 10%）</span><span class="green">+20 USDT</span></div>
            <div class="sr total"><span>创作者实收</span><span class="gold">220 USDT</span></div>
        </div>
        <div class="tip-success-note">
            <i class="fa-solid fa-ticket"></i>
            已消耗打赏加成卡 1 次 · 剩余 <b style="color:#FDE68A">1/3 次</b> · 须在 2026-06-30 前使用完毕
        </div>
    </div>
    <div class="tip-success-ft">
        <button type="button" class="btn btn-secondary" data-fl-modal-dismiss><i class="fa-solid fa-xmark"></i> 关闭</button>
        <button type="button" class="btn btn-primary"><i class="fa-solid fa-gift"></i> 继续打赏</button>
    </div>
</div>

<script src="../js-web/fl-embed-modal-dismiss.js"></script>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
