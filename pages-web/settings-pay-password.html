<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>支付密码 · 设置 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/settings-layout.css">
<link rel="stylesheet" href="../css-web/subscribe-modal.css">
<link rel="stylesheet" href="../css-web/settings-pay-password.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<link rel="stylesheet" href="../css-web/global-search.css">
<link rel="stylesheet" href="../css-web/global-lang-switch.css">
<script src="../js-web/ui-i18n.js" defer></script>
<script src="../js-web/global-lang-switch.js" defer></script>
</head>
<body class="page-settings" data-settings-nav-active="security">

<div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar" aria-label="主导航"></aside>

    <header class="app-header">
        <div class="h-search h-search-live h-search-unified">
            <div class="hs-inner">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="搜索创作者、内容或话题…" autocomplete="off" />
            </div>
            <div class="gs-drop"></div>
        </div>
        <div class="h-actions">
            <button type="button" class="h-icon"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
            <button type="button" class="h-icon" onclick="location.href='messages.html'"><i class="fa-regular fa-comments"></i></button>
            <button type="button" class="h-cta" onclick="location.href='wallet.html'"><i class="fa-solid fa-bolt"></i>充值</button>
            <div class="h-avatar" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')" onclick="location.href='profile.html'"></div>
        </div>
    </header>

    <main class="app-main">
        <div class="page-head page-head--detail">
            <div class="ph-l">
                <div class="crumb">
                    <a href="settings.html"><i class="fa-solid fa-gear"></i> 设置</a>
                    <i class="fa-solid fa-chevron-right" style="font-size:10px"></i>
                    <a href="settings-security.html">账户安全</a>
                    <i class="fa-solid fa-chevron-right" style="font-size:10px"></i>
                    <span class="curr">支付密码</span>
                </div>
                <h1 id="payPwdPageTitle">设置支付密码</h1>
                <p id="payPwdPageLead">首次使用前须设置 6 位数字支付密码，与登录密码相互独立。</p>
            </div>
            <div class="ph-r">
                <button type="button" class="btn" onclick="location.href='settings-security.html'"><i class="fa-solid fa-arrow-left"></i> 返回安全设置</button>
            </div>
        </div>

        <div class="set-grid">
            <aside class="set-nav" data-settings-nav aria-label="设置导航"></aside>
            <div>
                <div class="pay-pwd-return-banner" id="payPwdReturnBanner" hidden>
                    <i class="fa-solid fa-circle-info"></i>
                    <span data-return-label>设置完成后可返回上一页继续支付。</span>
                </div>

                <div class="pay-pwd-page-card">
                    <div class="pay-pwd-steps" aria-hidden="true">
                        <span class="pay-pwd-step-dot active"></span>
                        <span class="pay-pwd-step-dot"></span>
                    </div>

                    <div class="pay-pwd-pane active" data-step="verify">
                        <div class="ic-wrap"><i class="fa-solid fa-lock"></i></div>
                        <h2 data-pane-title>验证当前密码</h2>
                        <p class="lead" data-pane-sub>请输入当前 6 位支付密码以继续</p>
                    </div>
                    <div class="pay-pwd-pane" data-step="set">
                        <div class="ic-wrap"><i class="fa-solid fa-key"></i></div>
                        <h2 data-pane-title>设置支付密码</h2>
                        <p class="lead" data-pane-sub>请输入 6 位数字，勿与登录密码相同</p>
                    </div>
                    <div class="pay-pwd-pane" data-step="confirm">
                        <div class="ic-wrap"><i class="fa-solid fa-check-double"></i></div>
                        <h2 data-pane-title>确认支付密码</h2>
                        <p class="lead" data-pane-sub>请再次输入以确认</p>
                    </div>
                    <div class="pay-pwd-pane pay-pwd-done" data-step="done">
                        <div class="ok-ic"><i class="fa-solid fa-circle-check"></i></div>
                        <h2>设置完成</h2>
                        <p class="lead" id="payPwdDoneText">支付密码设置成功，现在可以完成订阅与付费解锁。</p>
                        <div class="pay-pwd-actions">
                            <button type="button" class="btn btn-secondary" id="btnPayPwdLater">留在设置</button>
                            <button type="button" class="btn btn-primary" id="btnPayPwdDone"><i class="fa-solid fa-arrow-left"></i> 返回继续</button>
                        </div>
                    </div>

                    <div id="payPwdPadWrap">
                        <div class="sub-pwd-input" id="payPwdDots" aria-hidden="true">
                            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        </div>
                        <div class="sub-pwd-pad" id="payPwdPad">
                            <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
                            <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
                            <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
                            <button type="button" data-action="clear"><i class="fa-solid fa-delete-left"></i></button>
                            <button type="button" data-digit="0">0</button>
                            <button type="button" data-action="submit"><i class="fa-solid fa-check"></i></button>
                        </div>
                        <p class="pay-pwd-hint"><i class="fa-solid fa-shield-halved"></i> 连续输错 5 次将冻结 24 小时 · 请勿使用 123456 等弱密码</p>
                        <div class="pay-pwd-actions">
                            <button type="button" class="btn btn-secondary" id="btnPayPwdBack">上一步</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="payPwdToast" class="toast-f" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 18px;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg)"></div>
<style>#payPwdToast.show{display:block!important}</style>

<script src="../js-web/user-prototype-registry.js"></script>
<script src="../js-web/user-assets-store.js"></script>
<script src="../js-web/pay-password-store.js"></script>
<script src="../js-web/auth-session.js"></script>
<script src="../js-web/auth-ui-sync.js"></script>
<script src="../js-web/settings-nav.js"></script>
<script src="../js-web/settings-logout.js"></script>
<script src="../js-web/global-search.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/settings-pay-password.js"></script>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
