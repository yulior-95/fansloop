<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>通讯录已下线 · FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/messages-im.css">
<style>
.app-main { padding: 48px 28px; text-align: center; max-width: 520px; margin: 0 auto; }
.deprec-icon { font-size: 48px; color: var(--t-tertiary); margin-bottom: 16px; }
</style>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">FansLoop</div></div>
        <div class="s-item active" onclick="location.href='messages.html'"><span class="ic"><i class="fa-regular fa-comments"></i></span><span class="lb">消息</span></div>
    </aside>
    <header class="app-header"></header>
    <main class="app-main">
        <div class="deprec-icon"><i class="fa-solid fa-ban"></i></div>
        <h1 style="font-size:22px;font-weight:800;margin-bottom:10px">通讯录功能已取消</h1>
        <p style="font-size:14px;color:var(--t-secondary);line-height:1.6;margin-bottom:20px">
            消息模块已移除通讯录入口。请通过<strong>新建私聊</strong>（互关好友）或<strong>会话列表</strong>管理对话；建群/拉人从互关列表选择成员。
        </p>
        <a href="messages.html" class="btn" style="background:var(--brand-grad);color:#fff;border:none"><i class="fa-regular fa-comments"></i> 返回消息</a>
    </main>
</div>
<script src="../js-web/app-sidebar-global.js"></script>
</body>
</html>
