<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>通讯录 · FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/messages-im.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
</head>
<body class="im-contacts-page">

<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">FansLoop</div></div>
        <div class="s-item active" onclick="location.href='messages.html'"><span class="ic"><i class="fa-regular fa-comments"></i></span><span class="lb">消息</span></div>
    </aside>
    <header class="app-header">
        <div class="h-actions" style="margin-left:auto">
            <a href="messages.html" class="btn btn-sm btn-secondary"><i class="fa-solid fa-arrow-left"></i> 返回消息</a>
            <a href="messages-group-create.html" class="btn btn-sm" style="background:var(--brand-grad);color:#fff;border:none"><i class="fa-solid fa-user-group"></i> 建群</a>
        </div>
    </header>
    <main class="app-main">
        <div class="im-contacts-layout">
            <div class="im-contacts-top">
                <h1><i class="fa-solid fa-address-book" style="color:var(--brand-purple)"></i> 通讯录</h1>
                <div class="search-wrap">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="contactsSearch" placeholder="搜索群聊、好友昵称…" autocomplete="off" />
                </div>
            </div>
            <div class="im-contacts-tabs" id="contactsTabs">
                <button type="button" class="on" data-tab="group">群聊</button>
                <button type="button" data-tab="friend">好友</button>
            </div>
            <div class="im-contacts-body" id="contactsBody"></div>
        </div>
    </main>
</div>
<script src="../js-web/messages-contacts.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
</body>
</html>
