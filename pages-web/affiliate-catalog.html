<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>实体选品库 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/affiliate-commerce.css">
<link rel="stylesheet" href="../css-web/digital-assets.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-section">橱窗</div>
        <div class="s-item" onclick="location.href='creator-profile.html'"><span class="ic"><i class="fa-regular fa-user"></i></span><span class="lb">创作者主页</span></div>
        <div class="s-item" onclick="location.href='create-digital-asset.html'"><span class="ic"><i class="fa-solid fa-images"></i></span><span class="lb">创建数字商品</span></div>
        <div class="s-item active"><span class="ic"><i class="fa-solid fa-boxes-stacked"></i></span><span class="lb">实体选品库</span></div>
        <div class="s-item" onclick="location.href='creator-showcase.html?owner=1&tab=affiliate&from=catalog'"><span class="ic"><i class="fa-solid fa-store"></i></span><span class="lb">我的橱窗</span></div>
    </aside>
    <header class="app-header">
        <div class="h-actions" style="margin-left:auto;display:flex;gap:8px">
            <button type="button" class="btn" onclick="location.href='creator-showcase.html?owner=1&tab=affiliate&from=catalog'"><i class="fa-solid fa-arrow-left"></i> 返回</button>
        </div>
    </header>
    <main class="app-main">
        <div class="af-hero">
            <h1>实体选品库</h1>
            <p>来自 Amazon / Shopify 等联盟商城的商品库。加入橱窗后可在内容与视频 AI 识别中推广；支付、库存、物流均由第三方完成。</p>
            <div class="af-hero-actions">
                <span class="da-chip">无平台库存</span>
                <span class="da-chip">无物流履约</span>
                <span class="da-chip">佣金回传结算</span>
            </div>
        </div>
        <div class="af-toolbar">
            <input type="search" id="afSearch" placeholder="搜索标题 / 标签…">
            <select id="afCatFilter"></select>
        </div>
        <div id="afCatalogRoot"></div>
    </main>
</div>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/mall-commerce-config-store.js"></script>
<script src="../js-web/affiliate-catalog-store.js"></script>
<script src="../js-web/affiliate-showcase-store.js"></script>
<script src="../js-web/affiliate-commerce-pages.js"></script>
<script>AffiliateCommercePages.initCatalogPage();</script>
</body>
</html>
