<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>跳转 · 广告中心</title>
<script>
(function () {
    var sp = new URLSearchParams(location.search);
    var q = new URLSearchParams();
    q.set('panel', 'ad');
    var view = sp.get('view');
    var id = sp.get('id');
    if (view) q.set('view', view);
    if (id) q.set('id', id);
    location.replace('settings.html?' + q.toString());
})();
</script>
</head>
<body><p>正在进入设置 · 广告中心… <a href="settings.html?panel=ad">点此继续</a></p></body>
</html>
