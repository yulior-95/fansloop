<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>创作者橱窗 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/subscribe-modal.css">
<link rel="stylesheet" href="../css-web/affiliate-commerce.css">
<link rel="stylesheet" href="../css-web/digital-assets.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-section">创作者</div>
        <div class="s-item" onclick="location.href='creator-profile.html'"><span class="ic"><i class="fa-regular fa-user"></i></span><span class="lb">创作者主页</span></div>
        <div class="s-item active"><span class="ic"><i class="fa-solid fa-store"></i></span><span class="lb">创作者橱窗</span></div>
        <div class="s-item" onclick="location.href='creator-income.html'"><span class="ic"><i class="fa-solid fa-coins"></i></span><span class="lb">创作者收入</span></div>
    </aside>
    <header class="app-header">
        <div class="cs-h-title" id="csHeaderTitle">创作者橱窗</div>
        <div class="h-actions" style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn btn-secondary" id="csSwitchMode" style="display:none">预览访客</button>
            <button type="button" class="btn" id="csBackProfile"><i class="fa-solid fa-arrow-left"></i> 返回</button>
        </div>
    </header>
    <main class="app-main">
        <div class="page-head">
            <div class="ph-l">
                <h1 id="csHeroTitle">创作者橱窗 <span class="chip" id="csModeTag">访客浏览</span></h1>
            </div>
            <div class="ph-r" id="csOwnerBar" hidden>
                <button type="button" class="btn" onclick="location.href='affiliate-catalog.html'"><i class="fa-solid fa-boxes-stacked"></i> 从商品中心选品</button>
                <button type="button" class="btn" id="csCreateDigitalBtn"><i class="fa-solid fa-gem"></i> 创建数字商品</button>
                <button type="button" class="btn" onclick="location.href='creator-income.html'"><i class="fa-solid fa-chart-line"></i> 收益明细</button>
            </div>
        </div>

        <div id="csStats" hidden></div>

        <div class="cs-tabs" id="csTabs" role="tablist">
            <button type="button" class="tt active" role="tab" data-cs-tab="digital" aria-selected="true">
                <i class="fa-solid fa-gem"></i> 数字资产 <span class="cnt" id="csTabDigCnt">0</span>
            </button>
            <button type="button" class="tt" role="tab" data-cs-tab="affiliate" aria-selected="false">
                <i class="fa-solid fa-car"></i> 实体选品 <span class="cnt" id="csTabAffCnt">0</span>
            </button>
        </div>

        <div id="csPanelRoot"></div>
    </main>
</div>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/user-prototype-registry.js"></script>
<script src="../js-web/user-assets-store.js"></script>
<script src="../js-web/live-wallet-store.js"></script>
<script src="../js-web/pay-password-store.js"></script>
<script src="../js-web/mall-commerce-config-store.js"></script>
<script src="../js-web/digital-assets-store.js"></script>
<script src="../js-web/digital-asset-orders-store.js"></script>
<script src="../js-web/digital-asset-pages.js"></script>
<script src="../js-web/digital-asset-commerce-modal.js"></script>
<script src="../js-web/affiliate-catalog-store.js"></script>
<script src="../js-web/affiliate-showcase-store.js"></script>
<script src="../js-web/affiliate-commerce-pages.js"></script>
<script src="../js-web/creator-showcase-page.js"></script>
<script>CreatorShowcasePage.init();</script>
</body>
</html>
