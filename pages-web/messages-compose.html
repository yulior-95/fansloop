<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>新建私信 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/messages-im.css">
<link rel="stylesheet" href="../css-web/dev-glass-note.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<style>
.app-main { padding: 24px 28px; }
.compose-search {
    width: 100%; max-width: 480px;
    height: 40px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    padding: 0 14px 0 40px;
    color: var(--t-primary);
    font-size: 13px;
    margin-bottom: 18px;
    outline: none;
}
.compose-search-wrap { position: relative; max-width: 480px; }
.compose-search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--t-tertiary); }
.compose-row { cursor: pointer; }
.compose-row:hover { border-color: var(--brand-purple); }
</style>
</head>
<body data-msg-sub="compose" class="msg-sub-page">

<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-item active" onclick="location.href='messages.html'"><span class="ic"><i class="fa-regular fa-comments"></i></span><span class="lb">消息</span></div>
    </aside>
    <header class="app-header"></header>
    <main class="app-main">
        <div class="msg-sub-wrap">
            <a class="back" href="messages.html"><i class="fa-solid fa-arrow-left"></i> 返回私信</a>
            <h1 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                新建私信
                <span class="dev-glass-wrap">
                    <span class="dev-glass-sphere" tabindex="0" aria-describedby="devComposePageTip">
                        <span class="dev-glass-sphere-shine"></span>
                        <span class="dev-glass-sphere-txt">To 研发</span>
                    </span>
                    <span class="dev-glass-pop" id="devComposePageTip" role="tooltip">
                        数据源 = <strong>互相关注列表</strong>。非互关用户请从其主页「私信」发首条消息（限 1 条）。
                    </span>
                </span>
            </h1>
            <p style="font-size:13px;color:var(--t-tertiary);margin-bottom:14px"><i class="fa-solid fa-user-check"></i> 仅显示互相关注好友</p>
            <div class="compose-search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="compose-search" id="composeSearch" type="search" placeholder="搜索互关好友昵称…" autocomplete="off" />
            </div>

            <div class="compose-row" data-name="Lens 旅记">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=120')"></div>
                <div class="body" style="flex:1"><div style="font-weight:700">Lens 旅记</div><div style="font-size:12px;color:var(--t-tertiary)">互相关注 · 粉丝</div></div>
                <i class="fa-solid fa-chevron-right" style="color:var(--t-tertiary)"></i>
            </div>
            <div class="compose-row" data-name="夜雨听弦">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120')"></div>
                <div class="body" style="flex:1"><div style="font-weight:700">夜雨听弦</div><div style="font-size:12px;color:var(--t-tertiary)">互相关注</div></div>
                <i class="fa-solid fa-chevron-right" style="color:var(--t-tertiary)"></i>
            </div>
            <div class="compose-row" data-name="代码诗人">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1502685104226-ee32379fefbe?w=120')"></div>
                <div class="body" style="flex:1"><div style="font-weight:700">代码诗人</div><div style="font-size:12px;color:var(--t-tertiary)">互相关注</div></div>
                <i class="fa-solid fa-chevron-right" style="color:var(--t-tertiary)"></i>
            </div>
            <div class="compose-row" data-name="Mila">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120')"></div>
                <div class="body" style="flex:1"><div style="font-weight:700">Mila</div><div style="font-size:12px;color:var(--t-tertiary)">互相关注</div></div>
                <i class="fa-solid fa-chevron-right" style="color:var(--t-tertiary)"></i>
            </div>
        </div>
    </main>
</div>
<script src="../js-web/dev-glass-viewport.js"></script>
<script src="../js-web/messages-sub-pages.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
