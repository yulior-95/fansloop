<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>钱包地址管理 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<link rel="stylesheet" href="../css-web/funds-flow.css">
<style>
.book-toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: center; }
.addr-card {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 16px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    margin-bottom: 12px;
}
.addr-card .meta .nm { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.addr-card .meta .nm .pill {
    font-size: 9px; padding: 2px 7px; border-radius: 999px;
    background: rgba(168,85,247,0.2); color: #E9D5FF; font-weight: 800;
}
.addr-card .meta .ad { font-family: ui-monospace, monospace; font-size: 12px; color: var(--t-secondary); margin-top: 6px; word-break: break-all; }
.addr-card .meta .tg { font-size: 11px; color: var(--t-tertiary); margin-top: 6px; }
.addr-card .acts { display: flex; flex-direction: column; gap: 8px; }
.add-form { max-width: 560px; }
</style>
<link rel="stylesheet" href="../css-web/global-lang-switch.css">
<script src="../js-web/ui-i18n.js" defer></script>
<script src="../js-web/global-lang-switch.js" defer></script>
</head>
<body>

<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-section">资产</div>
        <div class="s-item active" onclick="location.href='wallet.html'"><span class="ic"><i class="fa-solid fa-wallet"></i></span><span class="lb">钱包</span></div>
        <div class="s-bottom"><div class="s-user"><div class="av" style="background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div><div class="info"><div class="n">Luna 🌙</div></div></div></div>
    </aside>

    <header class="app-header">
        <div class="h-search h-search-live h-search-unified">
            <div class="hs-inner">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="搜索…" autocomplete="off" />
            </div>
            <div class="gs-drop"></div>
        </div>
        <div class="h-actions"><div class="h-avatar" style="background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div></div>
    </header>

    <main class="app-main">
        <div class="page-head">
            <div class="ph-l">
                <div class="crumb"><a href="withdraw-usdt.html">钱包提现</a><i class="fa-solid fa-chevron-right"></i><span class="curr">通讯录</span></div>
                <h1>钱包地址管理</h1>
                <p>保存常用 USDT 收款地址；提现页「通讯录」与此列表同步。仅展示与本账户绑定的地址簿。</p>
            </div>
            <div class="ph-r">
                <button type="button" class="btn btn-secondary" onclick="location.href='withdraw-usdt.html'"><i class="fa-solid fa-arrow-left"></i> 返回提现</button>
            </div>
        </div>

        <div class="book-toolbar">
            <button type="button" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> 新建地址</button>
            <div class="h-search" style="flex:1;max-width:320px;margin:0;padding:8px 12px;font-size:12px;border-radius:10px;border:1px solid var(--border);background:var(--bg-input)">
                <i class="fa-solid fa-magnifying-glass"></i><span style="color:var(--t-tertiary)">搜索备注 / 地址</span>
            </div>
        </div>

        <div class="addr-card">
            <div class="meta">
                <div class="nm">My MetaMask <span class="pill">TRC20</span> <span class="pill" style="background:rgba(16,185,129,0.15);color:#6EE7B7">默认</span></div>
                <div class="ad">TG3XXyExBkPp9nzdajDZsozEu4BkaSJozs</div>
                <div class="tg">最近使用 · 2026-05-08 13:40</div>
            </div>
            <div class="acts">
                <button type="button" class="btn btn-secondary btn-sm">编辑</button>
                <button type="button" class="btn btn-secondary btn-sm" style="color:var(--danger-light);border-color:rgba(248,113,113,0.35)">删除</button>
            </div>
        </div>

        <div class="addr-card">
            <div class="meta">
                <div class="nm">Trust Wallet <span class="pill">TRC20</span></div>
                <div class="ad">TQ4q9xgsQyKkCepXyGMDazh2UcqA6XrXVT</div>
                <div class="tg">创建于 2026-04-02</div>
            </div>
            <div class="acts">
                <button type="button" class="btn btn-secondary btn-sm">设为默认</button>
                <button type="button" class="btn btn-secondary btn-sm">编辑</button>
            </div>
        </div>

        <div class="card add-form" style="padding:22px 24px;margin-top:22px">
            <h3 style="font-size:14px;font-weight:700;margin-bottom:14px"><i class="fa-solid fa-plus"></i> 添加新地址（示意表单）</h3>
            <div style="display:grid;gap:12px">
                <div>
                    <label style="font-size:11px;color:var(--t-tertiary);display:block;margin-bottom:6px;font-weight:600">备注名称</label>
                    <input type="text" class="input-like" style="width:100%;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-input);color:#fff" placeholder="例如：冷钱包">
                </div>
                <div>
                    <label style="font-size:11px;color:var(--t-tertiary);display:block;margin-bottom:6px;font-weight:600">网络</label>
                    <select style="width:100%;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-input);color:#fff">
                        <option>TRC20</option>
                        <option>ERC20</option>
                        <option>BEP20</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:11px;color:var(--t-tertiary);display:block;margin-bottom:6px;font-weight:600">USDT 地址</label>
                    <input type="text" style="width:100%;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-input);color:#fff;font-family:ui-monospace,monospace" placeholder="粘贴或扫描">
                </div>
                <button type="button" class="btn btn-primary" onclick="location.href='withdraw-usdt.html'"><i class="fa-solid fa-floppy-disk"></i> 保存并使用</button>
            </div>
        </div>
    </main>
</div>
<script src="../js-web/global-search.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
