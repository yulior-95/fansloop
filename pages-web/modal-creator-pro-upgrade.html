<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Creator Pro 升级弹层 · FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/sidebar-bottom.css">
<style>
body {
    background: linear-gradient(135deg, #1B0B3A, #2D1B69 50%, #4A1063);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
.demo-wrap { width: min(440px, 100%); }
</style>
</head>
<body>

<div class="demo-wrap">
    <div class="fl-pro-upgrade-panel" role="dialog" aria-labelledby="flProUpgradeTitle">
        <div class="hd">
            <div>
                <h3 id="flProUpgradeTitle"><i class="fa-solid fa-crown"></i> 升级 Creator Pro</h3>
                <p>为创作者解锁数据分析、定时发布与直播推流优先级</p>
            </div>
            <button type="button" class="close" data-fl-modal-dismiss aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="bd">
            <ul class="feat">
                <li><i class="fa-solid fa-chart-line"></i>高级数据分析 · 粉丝画像、内容转化与收益趋势</li>
                <li><i class="fa-solid fa-clock"></i>定时发布队列 · 多内容排期一键发布</li>
                <li><i class="fa-solid fa-signal"></i>直播蓝光推流优先级 · 高峰时段稳定码率</li>
                <li><i class="fa-solid fa-headset"></i>优先客服响应 · 创作者专属支持通道</li>
            </ul>
            <div class="plans">
                <div class="plan selected" data-fl-pro-plan="monthly">
                    <div class="lbl">月付</div>
                    <div class="price">$19</div>
                    <div class="hint">按月自动续费</div>
                </div>
                <div class="plan" data-fl-pro-plan="yearly">
                    <div class="lbl">年付</div>
                    <div class="price">$190</div>
                    <div class="hint">省 2 个月 · 推荐</div>
                </div>
            </div>
        </div>
        <div class="ft">
            <button type="button" class="btn btn-secondary" data-fl-modal-dismiss>稍后再说</button>
            <button type="button" class="btn btn-primary"><i class="fa-solid fa-bolt"></i> 前往结算</button>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('[data-fl-pro-plan]').forEach(function (plan) {
    plan.addEventListener('click', function () {
        document.querySelectorAll('[data-fl-pro-plan]').forEach(function (p) { p.classList.remove('selected'); });
        plan.classList.add('selected');
    });
});
</script>
<script src="../js-web/fl-embed-modal-dismiss.js"></script>
</body>
</html>
