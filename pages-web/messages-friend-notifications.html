<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>私信请求 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/messages-im.css">
<link rel="stylesheet" href="../css-web/dev-glass-note.css">
<style>
.app-main { padding: 24px 28px; overflow: auto; max-width: 880px; margin: 0 auto; }
.fn-toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
.fn-toolbar .search-wrap { flex: 1; min-width: 200px; position: relative; }
.fn-toolbar .search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--t-tertiary); font-size: 12px; }
.fn-toolbar input { width: 100%; height: 40px; padding: 0 12px 0 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-input); color: var(--t-primary); outline: none; }
</style>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS</div></div>
        <div class="s-item active" onclick="location.href='messages.html'"><span class="ic"><i class="fa-regular fa-comments"></i></span><span class="lb">消息</span></div>
    </aside>
    <header class="app-header">
        <div class="h-actions" style="margin-left:auto"><a href="messages.html?inbox=stranger" class="btn btn-sm btn-secondary"><i class="fa-solid fa-arrow-left"></i> 返回消息</a></div>
    </header>
    <main class="app-main">
        <a href="messages.html" style="font-size:13px;color:var(--brand-purple);text-decoration:none;display:inline-flex;gap:6px;margin-bottom:12px"><i class="fa-solid fa-arrow-left"></i> 消息</a>
        <h1 style="font-size:22px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            私信请求 <span class="tag" id="fnCount">0</span>
            <span class="dev-glass-wrap">
                <span class="dev-glass-sphere" tabindex="0" aria-describedby="devFnTip">
                    <span class="dev-glass-sphere-shine"></span>
                    <span class="dev-glass-sphere-txt">To 研发</span>
                </span>
                <span class="dev-glass-pop" id="devFnTip" role="tooltip">
                    已取消「好友申请」。仅展示<strong>陌生人私信</strong>；接受后移入会话列表。非互关用户发送方仅可发 1 条，直至对方回复或互关。
                </span>
            </span>
        </h1>
        <p style="font-size:13px;color:var(--t-tertiary);margin-bottom:16px">非互关用户通过主页「私信」发来的首条消息；接受后可查看并回复。</p>
        <div class="fn-toolbar">
            <div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="fnSearch" placeholder="搜索昵称、摘要…" autocomplete="off" /></div>
            <button type="button" class="btn btn-sm btn-secondary" id="fnRejectAll">全部忽略</button>
        </div>
        <div class="grp-notice"><i class="fa-solid fa-lightbulb"></i> 主消息页左侧仅显示汇总入口；全量列表在此页处理，避免挤占会话列表。</div>
        <div id="fnList"></div>
    </main>
</div>
<div id="fnToast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;background:rgba(30,30,45,0.95);border-radius:999px;font-size:13px;opacity:0;transition:0.2s;z-index:9000"></div>
<style>#fnToast.show{opacity:1}</style>
<script src="../js-web/dev-glass-viewport.js"></script>
<script src="../js-web/messages-friend-notifications.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
</body>
</html>
