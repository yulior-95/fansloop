<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Creator Store · 数字资产 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/subscribe-modal.css">
<link rel="stylesheet" href="../css-web/digital-assets.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<link rel="stylesheet" href="../css-web/global-lang-switch.css">
<script src="../js-web/ui-i18n.js" defer></script>
<script src="../js-web/global-lang-switch.js" defer></script>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-section">主导航</div>
        <div class="s-item" onclick="location.href='home.html'"><span class="ic"><i class="fa-solid fa-house"></i></span><span class="lb">首页</span></div>
        <div class="s-item" onclick="location.href='discover.html'"><span class="ic"><i class="fa-solid fa-compass"></i></span><span class="lb">发现</span></div>
        <div class="s-item" onclick="location.href='create.html'"><span class="ic"><i class="fa-solid fa-pen-to-square"></i></span><span class="lb">创建内容</span></div>
        <div class="s-section">资产</div>
        <div class="s-item" onclick="location.href='wallet.html'"><span class="ic"><i class="fa-solid fa-wallet"></i></span><span class="lb">钱包</span></div>
        <div class="s-item" onclick="location.href='creator-income.html'"><span class="ic"><i class="fa-solid fa-coins"></i></span><span class="lb">创作者收入</span></div>
        <div class="s-item" onclick="location.href='points-mall.html'"><span class="ic"><i class="fa-solid fa-store"></i></span><span class="lb">积分商城</span></div>
        <div class="s-item" onclick="location.href='my-digital-assets.html'"><span class="ic"><i class="fa-solid fa-gem"></i></span><span class="lb">我的数字资产</span></div>
        <div class="s-section">个人</div>
        <div class="s-item" onclick="location.href='creator-profile.html'"><span class="ic"><i class="fa-regular fa-user"></i></span><span class="lb">创作者主页</span></div>
        <div class="s-item" onclick="location.href='settings.html'"><span class="ic"><i class="fa-solid fa-gear"></i></span><span class="lb">设置</span></div>
    </aside>
    <header class="app-header">
        <div class="h-search h-search-live h-search-unified">
            <div class="hs-inner"><i class="fa-solid fa-magnifying-glass"></i><input type="search" placeholder="搜索数字资产…" autocomplete="off" /></div>
            <div class="gs-drop"></div>
        </div>
        <div class="h-actions">
            <button class="h-cta" onclick="location.href='wallet.html'"><i class="fa-solid fa-bolt"></i>充值</button>
            <div class="h-avatar" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')" onclick="location.href='profile.html'"></div>
        </div>
    </header>
    <main class="app-main">
        <div class="da-hero">
            <h1>Creator Store · 数字资产专区</h1>
            <p>创作者自主创造的 NFT、数字图片、视频、独家内容与会员权益。购买后立即获得，无需物流。</p>
            <div class="da-hero-actions">
                <button class="btn btn-primary" onclick="location.href='create-digital-asset.html'"><i class="fa-solid fa-plus"></i> 创建数字资产</button>
                <button class="btn" onclick="location.href='my-digital-assets.html'"><i class="fa-solid fa-gem"></i> 我的资产</button>
                <button class="btn" id="daToggleMine"><i class="fa-solid fa-filter"></i> <span id="daToggleLabel">仅看我的商品</span></button>
            </div>
        </div>
        <div id="daStoreGrid"></div>
    </main>
</div>
<script src="../js-web/global-search.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/user-prototype-registry.js"></script>
<script src="../js-web/user-assets-store.js"></script>
<script src="../js-web/live-wallet-store.js"></script>
<script src="../js-web/pay-password-store.js"></script>
<script src="../js-web/mall-commerce-config-store.js"></script>
<script src="../js-web/digital-assets-store.js"></script>
<script src="../js-web/digital-asset-orders-store.js"></script>
<script src="../js-web/digital-asset-pages.js"></script>
<script src="../js-web/digital-asset-commerce-modal.js"></script>
<script>
(function () {
    var mine = /[?&]mine=1/.test(location.search);
    function render() {
        var filter = mine
            ? { creatorId: DigitalAssetsStore.DEMO_CREATOR }
            : { listedOnly: true };
        DigitalAssetPages.renderStoreGrid(document.getElementById('daStoreGrid'), filter);
        document.getElementById('daToggleLabel').textContent = mine ? '查看全部上架' : '仅看我的商品';
    }
    window.__daReloadStore = render;
    document.getElementById('daToggleMine').addEventListener('click', function () {
        mine = !mine;
        history.replaceState(null, '', mine ? 'digital-asset-store.html?mine=1' : 'digital-asset-store.html');
        render();
    });
    render();
    try {
        var openId = new URLSearchParams(location.search).get('open');
        if (openId && window.DigitalAssetCommerceModal) {
            DigitalAssetCommerceModal.openDetail(openId, { onDone: render });
        }
    } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
