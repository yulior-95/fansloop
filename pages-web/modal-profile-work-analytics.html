<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数据看板弹窗 · 作品</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/dev-glass-note.css">
<link rel="stylesheet" href="../css-web/profile-works.css">
<style>
body { margin: 0; min-height: 100vh; background: var(--bg-canvas); }
.demo-bg {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, rgba(7,7,13,0.35), rgba(7,7,13,0.9)),
        url('https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?w=1600&q=80') center/cover;
    z-index: 0;
}
.demo-caption {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1;
    font-size: 11px; color: var(--t-tertiary);
    background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
}
.pf-modal--analytics { display: flex; position: relative; z-index: 2; min-height: 100vh; }
</style>
</head>
<body>
<div class="demo-bg" aria-hidden="true"></div>
<p class="demo-caption">高保真片段 · 作品「数据看板」弹窗（含粉丝指标研发玻璃球）</p>

<div class="pf-modal pf-modal--analytics show" role="dialog">
    <div class="wa-panel">
        <div class="wa-head">
            <h2><i class="fa-solid fa-chart-line"></i> 数据看板</h2>
            <button type="button" class="wa-close" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="wa-body">
            <div class="wa-hero">
                <div class="wa-cover" style="background-image:url('https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?w=800&q=80')"></div>
                <div class="wa-meta">
                    <h3>富士山脚下晨雾 · 4K 航拍</h3>
                    <div class="wa-dt"><i class="fa-regular fa-clock"></i> 2026年5月23日 08:30</div>
                </div>
            </div>
            <section class="wa-overview">
                <h4>数据总览</h4>
                <div class="wa-stat-grid">
                    <div class="wa-stat"><div class="k">播放量</div><div class="v">2.4w</div></div>
                    <div class="wa-stat"><div class="k">点赞量</div><div class="v">2.4k</div></div>
                    <div class="wa-stat"><div class="k">评论量</div><div class="v">312</div></div>
                    <div class="wa-stat"><div class="k">分享量</div><div class="v">186</div></div>
                    <div class="wa-stat"><div class="k">弹幕量</div><div class="v">94</div></div>
                    <div class="wa-stat"><div class="k">完播率</div><div class="v pct">68.4</div></div>
                </div>
            </section>
            <section class="wa-chart-block">
                <h4>每日播放人数峰值</h4>
                <div class="wa-chart-wrap">
                    <div class="wa-chart-sub"><span>近 14 日</span><span>峰值 412 人/日</span></div>
                    <svg class="wa-chart-svg" viewBox="0 0 560 140" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="waBarGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#A855F7"/>
                                <stop offset="100%" stop-color="#6366F1" stop-opacity="0.35"/>
                            </linearGradient>
                        </defs>
                        <line class="grid-line" x1="28" y1="8" x2="552" y2="8"/>
                        <line class="grid-line" x1="28" y1="52" x2="552" y2="52"/>
                        <line class="grid-line" x1="28" y1="96" x2="552" y2="96"/>
                        <rect class="bar" x="30" y="42" width="32" height="78" rx="3"/>
                        <rect class="bar" x="68" y="58" width="32" height="62" rx="3"/>
                        <rect class="bar" x="106" y="28" width="32" height="92" rx="3"/>
                        <rect class="bar" x="144" y="50" width="32" height="70" rx="3"/>
                        <rect class="bar" x="182" y="35" width="32" height="85" rx="3"/>
                        <rect class="bar" x="220" y="22" width="32" height="98" rx="3"/>
                        <rect class="bar" x="258" y="40" width="32" height="80" rx="3"/>
                        <rect class="bar" x="296" y="18" width="32" height="102" rx="3"/>
                        <rect class="bar" x="334" y="45" width="32" height="75" rx="3"/>
                        <rect class="bar" x="372" y="32" width="32" height="88" rx="3"/>
                        <rect class="bar" x="410" y="55" width="32" height="65" rx="3"/>
                        <rect class="bar" x="448" y="25" width="32" height="95" rx="3"/>
                        <rect class="bar" x="486" y="12" width="32" height="108" rx="3"/>
                        <text class="axis" x="30" y="136" text-anchor="start">14天前</text>
                        <text class="axis" x="296" y="136" text-anchor="middle">7天前</text>
                        <text class="axis" x="518" y="136" text-anchor="end">今日</text>
                    </svg>
                </div>
            </section>
            <section class="wa-fans">
                <h4><i class="fa-solid fa-users" style="color:var(--brand-purple);font-size:12px"></i> 粉丝</h4>
                <div class="wa-fan-grid">
                    <div class="wa-fan-card">
                        <div class="fan-hd">
                            <span class="k">粉丝量</span>
                            <span class="dev-glass-wrap dev-glass-wrap--inline dev-glass-wrap--pop-left">
                                <span class="dev-glass-sphere" tabindex="0"><span class="dev-glass-sphere-shine"></span><span class="dev-glass-sphere-txt">To 研发</span></span>
                                <span class="dev-glass-pop" role="tooltip">粉丝量 = 当前订阅中的总人头数（去重）。</span>
                            </span>
                        </div>
                        <div class="v">892</div>
                    </div>
                    <div class="wa-fan-card">
                        <div class="fan-hd">
                            <span class="k">订阅断开量</span>
                            <span class="dev-glass-wrap dev-glass-wrap--inline dev-glass-wrap--pop-left">
                                <span class="dev-glass-sphere" tabindex="0"><span class="dev-glass-sphere-shine"></span><span class="dev-glass-sphere-txt">To 研发</span></span>
                                <span class="dev-glass-pop" role="tooltip">订阅断开量 = 曾订阅、当前未续订的去重人头；断订 +1、续订 -1、再断订 +1。</span>
                            </span>
                        </div>
                        <div class="v">47</div>
                    </div>
                    <div class="wa-fan-card">
                        <div class="fan-hd">
                            <span class="k">粉丝播放占比</span>
                            <span class="dev-glass-wrap dev-glass-wrap--inline dev-glass-wrap--pop-left">
                                <span class="dev-glass-sphere" tabindex="0"><span class="dev-glass-sphere-shine"></span><span class="dev-glass-sphere-txt">To 研发</span></span>
                                <span class="dev-glass-pop" role="tooltip">粉丝播放占比 = 观看人数中粉丝占比。</span>
                            </span>
                        </div>
                        <div class="v pct">72.3</div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>
<script src="../js-web/dev-glass-viewport.js" defer></script>
</body>
</html>
