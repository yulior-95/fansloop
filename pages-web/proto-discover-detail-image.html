<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>发现详情 · 图文 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<script>try{if(localStorage.getItem('fl_sidebar_collapsed')==='1')document.documentElement.classList.add('sidebar-collapsed-pre')}catch(e){}</script>
<link rel="stylesheet" href="../css-web/discover-video-player.css?v=2">
<link rel="stylesheet" href="../css-web/proto-discover-detail.css">
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">GOODFANS<span>Web3 Creator</span></div></div>
        <div class="s-section">主导航</div>
        <div class="s-item" onclick="location.href='home.html'"><span class="ic"><i class="fa-solid fa-house"></i></span><span class="lb">首页</span></div>
        <div class="s-item" onclick="location.href='subscriptions.html'"><span class="ic"><i class="fa-solid fa-crown"></i></span><span class="lb">订阅</span></div>
        <div class="s-item active" onclick="location.href='discover.html'"><span class="ic"><i class="fa-solid fa-compass"></i></span><span class="lb">发现</span></div>
        <div class="s-item" onclick="location.href='create.html'"><span class="ic"><i class="fa-solid fa-pen-to-square"></i></span><span class="lb">创建内容</span></div>
        <div class="s-section">互动</div>
        <div class="s-item"><span class="ic"><i class="fa-regular fa-comments"></i></span><span class="lb">消息</span><span class="badge">8</span></div>
        <div class="s-item"><span class="ic"><i class="fa-regular fa-bell"></i></span><span class="lb">通知</span></div>
        <div class="s-bottom">
            <div class="s-user">
                <div class="av" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div>
                <div class="info"><div class="n">Luna 🌙</div><div class="e">Creator</div></div>
            </div>
        </div>
    </aside>
    <header class="app-header">
        <div class="h-search h-search-unified">
            <div class="hs-inner"><i class="fa-solid fa-magnifying-glass"></i><input type="search" placeholder="搜索创作者、内容或话题…" /></div>
        </div>
        <div class="h-actions">
            <button class="h-icon" type="button"><i class="fa-regular fa-bell"></i></button>
            <button class="h-cta" type="button"><i class="fa-solid fa-bolt"></i>充值</button>
            <div class="h-avatar" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80')"></div>
        </div>
    </header>
    <main class="app-main app-main--dd">
        <div class="dd-stage" id="ddStage" role="dialog" aria-modal="true" aria-label="内容详情">
            <span class="dd-proto-badge">图文详情 · 免费 · 完整观看</span>

            <div class="dd-media">
                <img src="https://images.unsplash.com/photo-1542642745-f03d8e3aa54c?w=1600&q=85" alt="富士山五合目拍摄手记" />
            </div>

            <div class="dd-top">
                <button type="button" class="dd-close" id="ddClose" aria-label="关闭详情"><i class="fa-solid fa-arrow-left"></i></button>
                <div class="dd-creator">
                    <div class="av" style="background-image:url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120')"></div>
                    <div class="meta">
                        <div class="n">Lens 旅记</div>
                        <div class="h">@lensjourney · 摄影旅拍</div>
                    </div>
                </div>
                <button type="button" class="dd-follow" id="ddFollow" aria-label="关注"><i class="fa-solid fa-user-plus"></i></button>
            </div>

            <aside class="dd-rail" aria-label="互动操作">
                <button type="button" class="dd-rail-btn" data-dd-like aria-label="点赞">
                    <i class="fa-regular fa-heart"></i><span>2.4k</span>
                </button>
                <button type="button" class="dd-rail-btn" data-dd-comment-open aria-label="评论">
                    <i class="fa-regular fa-comment-dots"></i><span>312</span>
                </button>
                <button type="button" class="dd-rail-btn" data-dd-share aria-label="分享">
                    <i class="fa-solid fa-share"></i><span>分享</span>
                </button>
                <button type="button" class="dd-rail-btn" data-dd-save aria-label="收藏">
                    <i class="fa-regular fa-bookmark"></i><span>收藏</span>
                </button>
            </aside>

            <footer class="dd-bottom">
                <h1 class="dd-title">富士山五合目零下 4℃ 拍摄手记</h1>
                <div class="dd-tags">
                    <span class="tg">#富士山</span>
                    <span class="tg">#日出</span>
                    <span class="tg">#摄影</span>
                </div>
            </footer>

            <div class="dd-comments-backdrop" aria-hidden="true"></div>
            <aside class="dd-comments-panel" aria-label="评论">
                <header class="dd-comments-head">
                    <div><h3>评论</h3><div class="count" id="ddCommentTotal">312 条评论</div></div>
                    <button type="button" class="dd-comments-close" id="ddCommentsClose" aria-label="关闭评论"><i class="fa-solid fa-xmark"></i></button>
                </header>
                <div class="dd-comments-list" id="ddCommentList">
                    <article class="dd-comment">
                        <div class="av" style="background-image:url('https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80')"></div>
                        <div class="body">
                            <div class="who">SakuraFan <span>2 小时前</span></div>
                            <p class="txt">机位太绝了！求具体坐标和最佳拍摄时间 🌸</p>
                            <div class="acts"><button type="button">回复</button><button type="button">赞 48</button></div>
                        </div>
                    </article>
                    <article class="dd-comment">
                        <div class="av" style="background-image:url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80')"></div>
                        <div class="body">
                            <div class="who">Mike.Lens <span>5 小时前</span></div>
                            <p class="txt">第 7 张的色调是怎么调的？偏胶片吗</p>
                            <div class="acts"><button type="button">回复</button><button type="button">赞 21</button></div>
                        </div>
                    </article>
                    <article class="dd-comment">
                        <div class="av" style="background-image:url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=80')"></div>
                        <div class="body">
                            <div class="who">Yuki <span>昨天</span></div>
                            <p class="txt">已订阅，期待北海道系列！</p>
                            <div class="acts"><button type="button">回复</button><button type="button">赞 12</button></div>
                        </div>
                    </article>
                </div>
                <div class="dd-comments-compose">
                    <input type="text" id="ddCommentInput" placeholder="说点什么…" autocomplete="off" maxlength="500" />
                    <button type="button" id="ddSendComment">发送</button>
                </div>
            </aside>

            <div class="dd-toast" id="ddToast" role="status" aria-live="polite"></div>
        </div>
    </main>
</div>
<div id="flStandaloneModalRoot" class="fl-modal--default" aria-hidden="true" style="display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;padding:clamp(12px,3vw,24px);background:rgba(0,0,0,0.58);backdrop-filter:blur(10px);">
    <iframe title="GOODFANS 弹窗" style="width:min(600px,calc(100vw - 32px));height:min(880px,calc(100vh - 32px));border:none;border-radius:var(--r-xl);background:transparent;box-shadow:0 28px 70px rgba(0,0,0,0.5);pointer-events:auto;"></iframe>
</div>
<script src="../js-web/app-sidebar-global.js"></script>
<script src="../js-web/fl-interaction-modal.js"></script>
<script src="../js-web/proto-discover-detail.js"></script>
<script src="../js-web/page-back-nav.js"></script>
</body>
</html>
