<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>进群邀请 · FansLoop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css-web/common-web.css">
<link rel="stylesheet" href="../css-web/messages-im.css">
<style>
.app-main{padding:28px 32px;overflow:auto;max-width:880px;margin:0 auto}
.gi-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.gi-toolbar .search-wrap{flex:1;min-width:200px;position:relative}
.gi-toolbar .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t-tertiary);font-size:12px}
.gi-toolbar input{width:100%;height:40px;padding:0 12px 0 36px;border-radius:10px;border:1px solid var(--border);background:var(--bg-input);color:var(--t-primary);outline:none}
</style>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="s-brand"><div class="logo"><i class="fa-solid fa-infinity"></i></div><div class="name">FansLoop</div></div>
        <div class="s-item active" onclick="location.href='messages.html'"><span class="ic"><i class="fa-regular fa-comments"></i></span><span class="lb">消息</span></div>
    </aside>
    <header class="app-header">
        <div class="h-actions" style="margin-left:auto"><a href="messages.html?inbox=group" class="btn btn-sm btn-secondary"><i class="fa-solid fa-arrow-left"></i> 返回消息</a></div>
    </header>
    <main class="app-main">
        <a href="messages.html" style="font-size:13px;color:var(--brand-purple);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px"><i class="fa-solid fa-arrow-left"></i> 消息</a>
        <h1 style="font-size:22px;font-weight:800;margin-bottom:8px">进群邀请 <span class="tag" id="giCount" style="font-size:12px">2</span></h1>
        <p style="font-size:13px;color:var(--t-tertiary);margin-bottom:16px">全量处理进群邀请；主消息页左侧仅保留一条「群聊通知」汇总，避免 12+ 条平铺挤占会话。</p>
        <div class="gi-toolbar">
            <div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="giSearch" placeholder="搜索群名、群主…" autocomplete="off" /></div>
            <button type="button" class="btn btn-sm btn-secondary" id="giRejectAll">全部忽略</button>
            <button type="button" class="btn btn-sm" id="giAcceptAll" style="background:var(--brand-grad);color:#fff;border:none">批量同意</button>
        </div>
        <div class="grp-notice"><i class="fa-solid fa-circle-info"></i> 同意后加入对应粉丝群；可在 <a href="settings-privacy.html#group-invite" style="color:var(--brand-purple)">隐私设置</a> 关闭「进群需确认」改为直接入群。</div>
        <div id="giList"></div>
    </main>
</div>
<div id="giToast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;background:rgba(30,30,45,0.95);border-radius:999px;font-size:13px;opacity:0;transition:0.2s;z-index:9000"></div>
<style>#giToast.show{opacity:1}</style>
<script src="../js-web/messages-group-invites.js"></script>
<script src="../js-web/app-sidebar-global.js"></script>
</body>
</html>
