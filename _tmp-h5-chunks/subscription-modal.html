<div class="inline-overlay" id="ovlPromoEdit" aria-hidden="true">
    <div class="iol-panel promo-edit-modal">
        <div class="iol-head">
            <h3 id="promoModalTitle">新建优惠码</h3>
            <button type="button" class="iol-close" data-promo-close aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="promo-form-body">
            <div class="promo-field">
                <label for="promoFormCode">优惠码</label>
                <input type="text" id="promoFormCode" class="input" placeholder="如 LUNA20" maxlength="20" autocomplete="off">
                <p class="promo-field-hint">大写字母与数字，粉丝订阅时输入相同代码</p>
            </div>
            <div class="promo-field">
                <label for="promoFormType">折扣类型</label>
                <select id="promoFormType" class="select">
                    <option value="percent">首月折扣（如 8 折）</option>
                    <option value="fixed_first">首月固定价</option>
                </select>
            </div>
            <div class="promo-field">
                <label for="promoFormValue" id="promoFormValueLabel">折扣力度</label>
                <input type="number" id="promoFormValue" class="input" min="1" max="9" step="1" placeholder="8">
                <p class="promo-field-hint" id="promoFormValueHint">填写 1–9 的数字，如 8 表示 8 折首月</p>
            </div>
            <div class="promo-field-row">
                <div class="promo-field">
                    <label for="promoFormMaxUses">使用上限</label>
                    <input type="number" id="promoFormMaxUses" class="input" min="1" step="1" value="100">
                </div>
                <div class="promo-field">
                    <label for="promoFormExpires">有效期</label>
                    <input type="date" id="promoFormExpires" class="input">
                </div>
            </div>
            <div class="promo-field">
                <label for="promoFormStatus">状态</label>
                <select id="promoFormStatus" class="select">
                    <option value="active">启用</option>
                    <option value="disabled">停用</option>
                </select>
            </div>
        </div>
        <div class="promo-form-foot">
            <button type="button" class="btn btn-ghost btn-sm" id="btnPromoDelete" style="color:var(--danger-light);margin-right:auto"><i class="fa-solid fa-trash"></i> 删除</button>
            <button type="button" class="btn btn-secondary" data-promo-close>取消</button>
            <button type="button" class="btn btn-primary" id="btnPromoSave"><i class="fa-solid fa-floppy-disk"></i> 保存</button>
        </div>
    </div>
</div>
