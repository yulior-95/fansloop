<div class="inline-overlay" id="ovlAboutFeedback" aria-hidden="true">
    <div class="iol-panel about-feedback-modal" role="dialog" aria-labelledby="aboutFbTitle">
        <div class="iol-head">
            <h3 id="aboutFbTitle"><i class="fa-regular fa-paper-plane" style="color:var(--brand-purple)"></i> 提交产品反馈</h3>
            <button type="button" class="iol-close" id="aboutFeedbackClose" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="about-fb-body">
            <div id="aboutFbStepForm">
                <p class="about-fb-hint">感谢你帮助改进 GOODFANS，我们会认真阅读每一条反馈。</p>
                <div class="about-fb-field">
                    <label>反馈类型</label>
                    <div class="about-fb-types" role="group" aria-label="反馈类型">
                        <button type="button" class="about-fb-type active" data-fb-type="feature">功能建议</button>
                        <button type="button" class="about-fb-type" data-fb-type="experience">体验问题</button>
                        <button type="button" class="about-fb-type" data-fb-type="bug">Bug 报告</button>
                    </div>
                </div>
                <div class="about-fb-field">
                    <label for="aboutFbContent">详细描述 <span class="req">*</span></label>
                    <textarea id="aboutFbContent" class="input about-fb-textarea" rows="4" maxlength="1000" placeholder="请描述你的建议、遇到的问题或复现步骤…"></textarea>
                    <span class="about-fb-count"><span id="aboutFbCharCount">0</span> / 1000</span>
                </div>
                <div class="about-fb-field">
                    <label for="aboutFbContact">联系邮箱 <span class="opt">（选填，便于回复）</span></label>
                    <input type="email" id="aboutFbContact" class="input" autocomplete="email" placeholder="name@example.com">
                </div>
                <div class="about-fb-field">
                    <label>截图附件 <span class="opt">（选填）</span></label>
                    <label class="about-fb-upload" id="aboutFbUpload" for="aboutFbFile">
                        <i class="fa-solid fa-image"></i>
                        <span>点击添加截图</span>
                    </label>
                    <input type="file" id="aboutFbFile" accept="image/*" hidden>
                    <div class="about-fb-preview" id="aboutFbPreview" hidden>
                        <img id="aboutFbPreviewImg" alt="截图预览">
                        <button type="button" class="about-fb-preview-rm" id="aboutFbPreviewRm" aria-label="移除截图"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div class="about-fb-error" id="aboutFbErr" role="alert"></div>
            </div>
            <div id="aboutFbStepDone" hidden>
                <div class="about-fb-success">
                    <div class="ic"><i class="fa-solid fa-circle-check"></i></div>
                    <h4>反馈已提交</h4>
                    <p>工单号 <strong id="aboutFbTicket">—</strong>。若留下邮箱，我们将在 24 小时内回复（原型演示）。</p>
                </div>
            </div>
        </div>
        <div class="about-fb-foot" id="aboutFbFoot">
            <button type="button" class="btn btn-secondary" id="aboutFbCancel">取消</button>
            <button type="button" class="btn btn-primary" id="aboutFbSubmit"><i class="fa-solid fa-paper-plane"></i> 提交反馈</button>
        </div>
    </div>
</div>
