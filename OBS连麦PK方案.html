## 2. 产品背景与目标

### 2.1 背景
平台已支持主播通过 **OBS** 推流直播（RTMP 协议）。现需增加 **连麦** 与 **PK** 功能，**核心约束**：主播端不改变 OBS 推流方式，所有合流由服务端完成。

### 2.2 目标
- 连麦延迟 < 800ms（主播-观众场景），双主播场景可放宽至 2~3s。
- PK 分屏清晰，比分实时更新。
- 主播零感知（OBS 配置不变）。
- 观众只拉一路流。
- 混流服务 CPU < 70%，支持 100 路并发。

---

## 3. 功能需求

### 3.1 连麦功能
- **发起**：主播发起 → 连麦方收到邀请 → 接受/拒绝。
- **进行**：服务端混流，观众看到合成画面（画中画或左右分屏）。
- **挂断**：任意方挂断，恢复单主播画面。

#### 3.1.1 连麦场景区分（重要！）
系统根据**被连麦方的当前状态**自动选择最优技术路径：

| 被连麦方状态 | 采用的媒体源 | 优点 | 延迟 | 画质 |
| :--- | :--- | :--- | :--- | :--- |
| **对方正在使用 OBS 推流**（双主播） | 直接复用其 RTMP 流 | 无需额外采集，画质无损，节省资源 | ~2~3s | 与独播一致（高清） |
| **对方未开播 / 是普通观众** | 通过浏览器 WebRTC 临时采集 | 低延迟，抗弱网，适合实时对话 | < 800ms | 自适应（最高1080p） |

> **决策逻辑**：后端在收到连麦请求时，先查询对方是否正在推流（通过 SRS 流状态）。若在推流，则使用 RTMP 地址；否则通知对方启动 WebRTC 推流。

### 3.2 PK 功能
- **发起**：主播 A 发起 → 主播 B 接受 → 开始 PK。
- **进行**：左右分屏，实时比分 + 倒计时（默认 60 秒）。
- **结束**：显示胜者。

> **注意**：PK 双方均为主播，通常双方都在 OBS 推流，故直接采用 RTMP 复用方案，无需 WebRTC 介入。

## 5. 第三方工具对接

### 5.1 SRS 流媒体服务器
**部署（Docker）**：
\`\`\`bash
docker run -d --name srs -p 1935:1935 -p 1985:1985 -p 8080:8080 -p 8000:8000/udp ossrs/srs:4
\`\`\`

**关键配置**（srs.conf）：
\`\`\`nginx
listen 1935;
vhost __defaultVhost__ {
    rtmp { enabled on; }
    rtc { enabled on; rtmp_to_rtc on; rtc_to_rtmp on; }
    http_api { enabled on; listen 1985; }
}
\`\`\`

### 5.2 FFmpeg 混流服务
**画中画（连麦）**：
\`\`\`bash
# 输入为两路 RTMP（双主播场景）或 RTMP + WebRTC（通过 SRS 转 RTMP）
ffmpeg -i rtmp://srs/live/stream_A -i rtmp://srs/live/stream_B_or_cohost \\
  -filter_complex "[0:v]scale=1280:720[main];[1:v]scale=180:320[sub];[main][sub]overlay=W-w-20:H-h-20[outv];[0:a][1:a]amix=inputs=2[outa]" \\
  -map "[outv]" -map "[outa]" -c:v libx264 -preset veryfast -f flv rtmp://srs/live/mix_room
\`\`\`

**左右分屏（PK）**：
\`\`\`bash
ffmpeg -i rtmp://srs/live/stream_A -i rtmp://srs/live/stream_B \\
  -filter_complex "[0:v]scale=640:720[left];[1:v]scale=640:720[right];[left][right]hstack=inputs=2[outv];[0:a][1:a]amix=inputs=2[outa]" \\
  -map "[outv]" -map "[outa]" -c:v libx264 -f flv rtmp://srs/live/mix_room
\`\`\`

**封装为微服务 API**：
- \`POST /api/mix/start\` 启动混流（参数包含输入流列表、布局、输出地址）
- \`POST /api/mix/stop\` 停止混流

## 7. 双主播连麦场景优化详解

### 7.1 为什么双主播直接复用 RTMP 更好？
- **画质无损**：OBS 推的码率较高（通常 4~6 Mbps），直接使用无需二次编码。
- **节省资源**：不需要额外的 WebRTC 采集和转码。
- **简化流程**：无需信令交换 SDP 和 ICE，降低复杂度。

### 7.2 何时使用 WebRTC？
- 连麦方为普通观众（无 OBS）。
- 连麦方为另一主播，但该主播当前**未开播**（例如刚上线，还未启动 OBS）。
- 此时，通过信令通知对方打开浏览器摄像头，使用 WebRTC 临时推流。

### 7.3 研发实现决策代码
\`\`\`javascript
// 后端连麦邀请处理
async function handleInvite(fromUserId, toUserId, roomId) {
    // 查询对方是否正在推流（通过 SRS 的 on_publish 状态）
    const isStreaming = await checkStreamStatus(toUserId);
    let streamUrl;
    if (isStreaming) {
        // 方案A：复用 RTMP
        streamUrl = \`rtmp://srs/live/stream_\${toUserId}\`;
    } else {
        // 方案B：触发 WebRTC 推流
        await notifyUserToStartWebRTC(toUserId, roomId);
        streamUrl = \`webrtc://srs/cohost_\${roomId}_\${toUserId}\`; // 等待对方推送
    }
    // 启动混流
    await mixService.start(roomId, [\`rtmp://srs/live/stream_\${fromUserId}\`, streamUrl]);
}
\`\`\`

### 7.4 常见问题
**Q：双主播连麦时，如果一方网络不好，会不会影响另一方？**  
A：不会。混流服务分别拉取两路流，互不影响。如果某路流中断，混流服务会持续重试，直到恢复或超时。

**Q：主播-观众连麦时，观众端画质能保证吗？**  
A：WebRTC 具备自适应码率，会根据网络状况动态调整清晰度，优先保证流畅。在良好网络下可达 720p~1080p。

## 9. 风险应对

| 风险 | 应对 |
|------|------|
| FFmpeg CPU 过高 | 使用 GPU 加速或限制并发数 |
| WebRTC NAT 穿透失败 | 部署 TURN 服务器，并提供备用 STUN |
| 双主播流不同步 | FFmpeg 使用 \`setpts=PTS-STARTPTS\` 对齐时间戳 |
| 延迟超标 | 调整 SRS \`gop_cache=false\`，启用低延迟模式 |

                const html = marked.parse(PRD_MARKDOWN);
                container.innerHTML = html;

                // 高亮代码块
                if (typeof hljs !== 'undefined') {
                    container.querySelectorAll('pre code').forEach(block => {
                        hljs.highlightElement(block);
                    });
                }

                // 渲染 Mermaid 图表（如果有）
                if (typeof mermaid !== 'undefined') {
                    const mermaidBlocks = container.querySelectorAll('pre code.language-mermaid');
                    mermaidBlocks.forEach((codeBlock) => {
                        const content = codeBlock.textContent;
                        const pre = codeBlock.parentElement;
                        const div = document.createElement('div');
                        div.className = 'mermaid';
                        div.textContent = content;
                        pre.parentElement.replaceChild(div, pre);
                    });
                    if (!mermaidInitialized) {
                        mermaid.initialize({ theme: 'default', startOnLoad: false });
                        mermaidInitialized = true;
                    }
                    mermaid.run({ nodes: container.querySelectorAll('.mermaid') }).catch(err => {
                        console.warn('Mermaid 渲染警告:', err);
                    });
                }
            } catch (e) {
                container.innerHTML = `<div class="error">❌ 渲染失败：${e.message}</div>`;
                console.error(e);
            }
        }

        // ================================================================
        //  3. 导出功能
        // ================================================================

        // 导出 PDF（调用浏览器打印）
        function exportPDF() {
            window.print();
        }

        // 导出 Markdown（下载 .md 文件）
        function exportMarkdown() {
            const blob = new Blob([PRD_MARKDOWN], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '直播连麦与PK_PRD_v2.0.md';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ================================================================
        //  4. 页面加载
        // ================================================================
        window.onload = function() {
            renderDocument();
        };

        // 暴露导出函数到全局
        window.exportPDF = exportPDF;
        window.exportMarkdown = exportMarkdown;

        // CDN 加载失败时的备用提示
        setTimeout(() => {
            if (typeof marked === 'undefined') {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ⚠️ Markdown 库加载失败，请检查网络或刷新页面。<br>
                        您可以 <a href="javascript:location.reload()">刷新</a> 重试。
                    </div>
                `;
            }
        }, 8000);
    </script>
</body>
</html>
