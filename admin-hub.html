<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运营后台原型 · admin-hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #1677ff;
      --bg: #f0f2f5;
      --line: #f0f0f0;
      --text: rgba(0, 0, 0, 0.88);
      --muted: rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      color: var(--text);
    }
    .hub-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 480px;
      background: var(--bg);
    }
    .hub-toolbar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .hub-toolbar .title { font-weight: 600; flex: 1; min-width: 160px; }
    .hub-toolbar .title code { font-size: 12px; color: var(--muted); font-weight: 500; }
    .hub-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #d9d9d9;
      background: #fff;
      color: var(--text);
    }
    .hub-btn:hover { border-color: var(--primary); color: var(--primary); }
    .hub-btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .hub-btn.primary:hover { filter: brightness(1.05); color: #fff; }
    .hub-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .hub-frame-wrap { flex: 1; min-height: 0; padding: 12px; }
    .hub-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      display: block;
    }
  </style>
</head>
<body>
<div class="hub-app">
  <div class="hub-toolbar">
    <div class="title"><span id="hubPageName">首页仪表盘</span> <code id="hubFile">admin-prototype/dashboard.html</code></div>
    <button type="button" class="hub-btn" id="btnPrev" title="上一页"><i class="fa-solid fa-chevron-left"></i> 上一个</button>
    <button type="button" class="hub-btn" id="btnNext" title="下一页">下一个 <i class="fa-solid fa-chevron-right"></i></button>
    <button type="button" class="hub-btn primary" id="btnOpenTab"><i class="fa-solid fa-arrow-up-right-from-square"></i> 新标签打开</button>
  </div>
  <div class="hub-frame-wrap">
    <iframe id="hubFrame" title="当前原型页" src="admin-prototype/dashboard.html"></iframe>
  </div>
</div>
<script src="admin-prototype/js/admin-nav.js"></script>
<script>
(function () {
  var PAGES_PREFIX = "admin-prototype/";
  var PAGES = window.AdminNavConfig ? AdminNavConfig.flattenForHub() : [];
  var frame = document.getElementById("hubFrame");
  var nameEl = document.getElementById("hubPageName");
  var fileEl = document.getElementById("hubFile");
  var btnPrev = document.getElementById("btnPrev");
  var btnNext = document.getElementById("btnNext");
  var btnOpenTab = document.getElementById("btnOpenTab");
  var idx = 0;

  function current() { return PAGES[idx]; }
  function srcFor(p) { return PAGES_PREFIX + p.file; }

  function setIndex(i) {
    if (!PAGES.length) return;
    if (i < 0) i = 0;
    if (i >= PAGES.length) i = PAGES.length - 1;
    idx = i;
    var p = current();
    frame.src = srcFor(p);
    nameEl.textContent = p.title;
    fileEl.textContent = srcFor(p);
    btnPrev.disabled = idx <= 0;
    btnNext.disabled = idx >= PAGES.length - 1;
  }

  btnPrev.addEventListener("click", function () { setIndex(idx - 1); });
  btnNext.addEventListener("click", function () { setIndex(idx + 1); });
  btnOpenTab.addEventListener("click", function () {
    window.open(srcFor(current()), "_blank", "noopener,noreferrer");
  });

  setIndex(0);
})();
</script>
</body>
</html>
