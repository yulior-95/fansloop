<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>实体选品库</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/digital-h5.css">
</head>
<body>
<div class="status-bar dark-mode">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>
<div class="nav-bar da-nav solid">
    <div class="nav-left"><div class="nav-btn" data-go="creator-showcase-affiliate.html"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title">实体选品库</div>
    <div class="nav-right"><span style="font-size:12px;color:#c4b5fd;font-weight:700;cursor:pointer" data-go="creator-showcase-affiliate.html">完成</span></div>
</div>

<div class="app-content da-page">
    <div class="da-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" placeholder="搜商品名 / SKU">
    </div>
    <div class="da-chips" id="catChips">
        <div class="da-chip on">全部</div>
        <div class="da-chip">摄影周边</div>
        <div class="da-chip">服饰</div>
        <div class="da-chip">数码</div>
    </div>
    <div style="padding:0 16px">
        <div class="da-aff-row">
            <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=300&q=80" alt="">
            <div class="main">
                <div class="t">35mm 胶片相机肩带</div>
                <div class="s">SKU · CAM-STRAP-35 · 供应商发货</div>
                <div class="c">佣金 18% · 售价 29.9 USDT</div>
                <div class="da-btns"><button class="mini" disabled>已加入</button></div>
            </div>
        </div>
        <div class="da-aff-row">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300&q=80" alt="">
            <div class="main">
                <div class="t">复古拍立得相纸套装</div>
                <div class="s">SKU · FILM-INST-20 · 现货</div>
                <div class="c">佣金 12% · 售价 16.0 USDT</div>
                <div class="da-btns"><button class="mini" disabled>已加入</button></div>
            </div>
        </div>
        <div class="da-aff-row">
            <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=300&q=80" alt="">
            <div class="main">
                <div class="t">城市夜拍灯牌钥匙扣</div>
                <div class="s">SKU · GIFT-NEON-01</div>
                <div class="c">佣金 22% · 售价 8.5 USDT</div>
                <div class="da-btns"><button class="mini pri js-add">加入橱窗</button></div>
            </div>
        </div>
    </div>
</div>

<div class="tab-bar">
    <div class="tab-item"><i class="fa-solid fa-house"></i><span>首页</span></div>
    <div class="tab-item"><i class="fa-regular fa-heart"></i><span>订阅</span></div>
    <div class="tab-create"><div class="create-btn"><i class="fa-solid fa-plus"></i></div></div>
    <div class="tab-item"><i class="fa-regular fa-message"></i><span>消息</span></div>
    <div class="tab-item active"><i class="fa-solid fa-user"></i><span>我的</span></div>
</div>
<div class="da-toast" id="daToast"></div>
<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
DigitalH5Nav.bindChips('#catChips');
document.querySelector('.js-add').addEventListener('click', function () {
    var btn = this;
    btn.textContent = '已加入';
    btn.disabled = true;
    btn.classList.remove('pri');
    DigitalH5Nav.toast('已加入橱窗');
    setTimeout(function () { location.href = 'creator-showcase-affiliate.html'; }, 800);
});
</script>
</body>
</html>
