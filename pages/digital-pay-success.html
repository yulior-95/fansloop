<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>购买成功</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/digital-h5.css">
</head>
<body>
<div class="status-bar dark-mode">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>
<div class="nav-bar da-nav solid">
    <div class="nav-left"></div>
    <div class="nav-title">购买成功</div>
    <div class="nav-right"></div>
</div>

<div class="app-content da-page no-tab" style="display:flex;flex-direction:column;align-items:center;padding-top:100px">
    <div style="width:76px;height:76px;border-radius:50%;background:rgba(16,185,129,.15);display:flex;align-items:center;justify-content:center;color:#34D399;font-size:34px;margin-bottom:14px">
        <i class="fa-solid fa-circle-check"></i>
    </div>
    <h2 style="font-size:22px;font-weight:800">购买成功</h2>
    <p class="da-desc" style="text-align:center;padding:10px 28px 0;max-width:320px" id="msg">权益已写入「我的作品」。</p>
    <div class="da-manage-card" style="margin:20px 16px 0;width:calc(100% - 32px)">
        <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=300&q=80" alt="">
        <div class="main">
            <div class="t" id="okTitle">富士山日出 · 4K 写真合集</div>
            <div class="id">订单 · DO202608241102</div>
            <div class="row"><span class="da-pill ok">已解锁</span><span class="da-pill off" id="okPrice">-4.50 USDT</span></div>
        </div>
    </div>
    <div style="width:100%;padding:22px 16px 0;display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-primary btn-block" data-go="digital-owned.html">查看已购作品</button>
        <button class="btn btn-secondary btn-block" data-go="my-digital-assets.html">我的作品库</button>
        <button class="btn btn-ghost btn-block" data-go="creator-showcase.html">返回橱窗</button>
    </div>
</div>
<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
(function () {
    var q = new URLSearchParams(location.search);
    var title = q.get('title') || '富士山日出 · 4K 写真合集';
    var price = q.get('price') || '4.5';
    document.getElementById('okTitle').textContent = title;
    document.getElementById('okPrice').textContent = '-' + Number(price).toFixed(2) + ' USDT';
    document.getElementById('msg').textContent = '已获得「' + title + '」。权益已写入「我的作品」。';
})();
</script>
</body>
</html>
