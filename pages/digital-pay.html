<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>确认订单</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<script src="../js/h5-theme-boot.js"></script>
<link rel="stylesheet" href="../css/digital-h5.css">
<link rel="stylesheet" href="../css/h5-light-theme.css">
<style>
.iol-overlay {
    position: absolute;
    inset: 0;
    background: var(--bg-overlay);
    z-index: 70;
    display: none;
    align-items: flex-end;
    justify-content: center;
}
.iol-overlay.show { display: flex; }
.iol-panel {
    width: 100%;
    border-radius: 18px 18px 0 0;
    background: var(--bg-sheet);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
}
.iol-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 0.5px solid var(--border-color);
}
.iol-head .t { font-size: 14px; font-weight: 700; }
.iol-close {
    width: 28px; height: 28px; border: 0; border-radius: 50%;
    background: var(--bg-elevated); color: var(--text-primary);
}
.iol-body { padding: 14px 14px 18px; }
.iol-msg { font-size: 13px; color: var(--text-secondary); line-height: 1.55; margin: 0 0 16px; }
.iol-actions { display: flex; gap: 10px; }
.iol-actions button {
    flex: 1;
    height: 44px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    border: none;
}
.iol-actions .sec { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-color); }
.iol-actions .pri { background: linear-gradient(135deg,#A855F7,#6366F1); color: #fff; }
</style>
</head>
<body>
<div class="status-bar dark-mode">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>
<div class="nav-bar da-nav solid">
    <div class="nav-left"><div class="nav-btn" data-back="digital-detail.html"><i class="fa-solid fa-xmark"></i></div></div>
    <div class="nav-title">确认订单</div>
    <div class="nav-right"></div>
</div>

<div class="app-content da-page no-tab">
    <div class="da-manage-card" style="margin:16px">
        <img id="coverImg" src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=300&q=80" alt="">
        <div class="main">
            <div class="t" id="payTitle">富士山日出 · 4K 写真合集</div>
            <div class="id">Luna 🌙 · 数字商品</div>
            <div class="row">
                <span class="da-pill ok">即时交付</span>
                <span class="da-pill off">无需物流</span>
            </div>
        </div>
    </div>

    <div class="list-group">
        <div class="list-item">
            <div class="main"><div class="title">可用余额</div><div class="subtitle">USDT 账户</div></div>
            <div class="value" style="font-weight:800" id="balVal">128.56 USDT</div>
        </div>
        <div class="list-item">
            <div class="main"><div class="title">支付金额</div></div>
            <div class="value" style="color:#c4b5fd;font-weight:800" id="priceVal">4.50 USDT</div>
        </div>
        <div class="list-item">
            <div class="main"><div class="title">扣款后余额</div></div>
            <div class="value" id="afterVal">124.06 USDT</div>
        </div>
    </div>

    <p class="da-desc" style="padding:0 16px;margin-top:12px">平台服务费 10% · 购买成功后立即获得数字权益，无物流与地址。</p>

    <div style="padding:20px 16px 0">
        <button class="btn btn-primary btn-block" id="btnConfirm"><i class="fa-solid fa-bolt"></i> 确认支付</button>
        <p class="text-center text-xs text-muted" style="margin-top:10px;cursor:pointer" id="demoLow">模拟余额不足 →</p>
    </div>
</div>

<div class="iol-overlay" id="ovlDaPayConfirm" aria-hidden="true">
    <div class="iol-panel" role="dialog" aria-labelledby="daPayConfirmTitle">
        <div class="iol-head">
            <div class="t" id="daPayConfirmTitle">确认支付</div>
            <button type="button" class="iol-close" id="daPayConfirmClose" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="iol-body">
            <p class="iol-msg">数字商品购买之后不可退款，是否确认购买？</p>
            <div class="iol-actions">
                <button type="button" class="sec" id="daPayConfirmCancel">取消</button>
                <button type="button" class="pri" id="daPayConfirmOk">确认购买</button>
            </div>
        </div>
    </div>
</div>

<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
(function () {
    var q = new URLSearchParams(location.search);
    var price = parseFloat(q.get('price') || '4.5') || 4.5;
    var title = q.get('title') || '富士山日出 · 4K 写真合集';
    var forceLow = q.get('low') === '1';
    var bal = forceLow ? 2.1 : 128.56;
    document.getElementById('payTitle').textContent = title;
    document.getElementById('priceVal').textContent = price.toFixed(2) + ' USDT';
    document.getElementById('balVal').textContent = bal.toFixed(2) + ' USDT';
    document.getElementById('afterVal').textContent = (bal - price).toFixed(2) + ' USDT';
    if (bal < price) {
        document.getElementById('balVal').style.color = '#FBBF24';
        document.getElementById('afterVal').textContent = '不足';
    }
    var next = 'digital-pay-pwd.html?price=' + encodeURIComponent(price) + '&title=' + encodeURIComponent(title);
    var low = 'digital-pay-recharge.html?price=' + encodeURIComponent(price) + '&title=' + encodeURIComponent(title) + '&bal=' + bal;
    var ovlConfirm = document.getElementById('ovlDaPayConfirm');
    function openPayConfirm() {
        ovlConfirm.classList.add('show');
        ovlConfirm.setAttribute('aria-hidden', 'false');
    }
    function closePayConfirm() {
        ovlConfirm.classList.remove('show');
        ovlConfirm.setAttribute('aria-hidden', 'true');
    }
    function proceedPay() {
        closePayConfirm();
        location.href = bal < price ? low : next;
    }
    document.getElementById('btnConfirm').addEventListener('click', openPayConfirm);
    document.getElementById('daPayConfirmOk').addEventListener('click', proceedPay);
    document.getElementById('daPayConfirmCancel').addEventListener('click', closePayConfirm);
    document.getElementById('daPayConfirmClose').addEventListener('click', closePayConfirm);
    ovlConfirm.addEventListener('click', function (e) {
        if (e.target === ovlConfirm) closePayConfirm();
    });
    document.getElementById('demoLow').addEventListener('click', function () {
        location.href = low;
    });
})();
</script>
</body>
</html>
