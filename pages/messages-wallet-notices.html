<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>钱包通知</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<style>
.nav-bar { background: var(--bg-primary); }
.app-content { padding-top: calc(var(--status-bar-height) + var(--nav-bar-height)); padding-bottom: calc(var(--tab-bar-height) + 10px); }
.wn-list { margin: 10px 16px 0; background: var(--bg-card); border-radius: 12px; overflow: hidden; }
.wn-item { padding: 12px; border-bottom: .5px solid var(--border-color); }
.wn-item:last-child { border-bottom: none; }
.wn-head { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; }
.wn-time { margin-left: auto; font-size: 10px; color: var(--text-tertiary); font-weight: 500; }
.wn-desc { margin-top: 6px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.wn-link { margin-top: 7px; font-size: 11px; color: var(--brand-primary); cursor: pointer; }
</style>
</head>
<body>
<div class="status-bar">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>
<div class="nav-bar solid">
    <div class="nav-left"><div class="nav-btn" data-back="messages.html"><i class="fa-solid fa-angle-left"></i></div></div>
    <div class="nav-title">钱包通知</div>
    <div class="nav-right"></div>
</div>
<div class="app-content">
    <div class="wn-list" id="wnList">
        <div class="wn-item">
            <div class="wn-head"><i class="fa-solid fa-circle-check" style="color:#22c55e"></i>订阅扣款成功 <span class="wn-time">09:12</span></div>
            <div class="wn-desc">你已成功续费 Luna 月度订阅，支出 28 USDT。</div>
            <div class="wn-link" data-go="transactions.html">查看账变明细</div>
        </div>
        <div class="wn-item">
            <div class="wn-head"><i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b"></i>余额不足提醒 <span class="wn-time">昨天</span></div>
            <div class="wn-desc">你的钱包余额不足，可能影响自动续费与打赏，请及时充值。</div>
            <div class="wn-link" data-go="digital-pay-recharge.html">立即充值</div>
        </div>
        <div class="wn-item">
            <div class="wn-head"><i class="fa-solid fa-gift" style="color:#a855f7"></i>收到打赏分账 <span class="wn-time">2 天前</span></div>
            <div class="wn-desc">你从订阅直播获得分账收入 10 USDT，已到账。</div>
            <div class="wn-link" data-go="creator-income.html">查看创作者收入</div>
        </div>
    </div>
</div>
<div class="tab-bar">
    <div class="tab-item"><i class="fa-solid fa-house"></i><span>首页</span></div>
    <div class="tab-item"><i class="fa-regular fa-heart"></i><span>订阅</span></div>
    <div class="tab-create"><div class="create-btn"><i class="fa-solid fa-plus"></i></div></div>
    <div class="tab-item active"><i class="fa-solid fa-message"></i><span>消息</span></div>
    <div class="tab-item"><i class="fa-regular fa-user"></i><span>我的</span></div>
</div>
<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
</body>
</html>
