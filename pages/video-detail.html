<style>
body { background: #000; }

.video-wrap {
    position: absolute; inset: 0;
}
.video-wrap.cover-press-hold {
    transform: scale(0.985);
    transition: transform 0.15s ease;
}
.video-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
}

.top-controls {
    position: absolute;
    top: var(--status-bar-height);
    left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px;
    z-index: 50;
}
.ctrl-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.ctrl-btn.is-on {
    background: rgba(168, 85, 247, 0.45);
    box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.55);
}
.top-controls .right-group { display: flex; gap: 10px; }

.feed-more-sheet { height: auto; max-height: 52%; z-index: 146; }
.feed-more-list { display: flex; flex-direction: column; gap: 8px; }
.feed-more-row {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 14px;
    border: 0; border-radius: 12px;
    background: rgba(255,255,255,0.06);
    color: #fff; text-align: left;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
}
.feed-more-row .ic {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
    background: rgba(255,255,255,0.08);
}
.feed-more-row.danger { color: #fca5a5; }
.feed-more-row.danger .ic { background: rgba(239,68,68,0.18); color: #f87171; }
.feed-more-sheet.is-report { max-height: 82%; }
.feed-more-sheet.is-report .feed-more-main { display: none; }
.feed-more-sheet .feed-more-report { display: none; }
.feed-more-sheet.is-report .feed-more-report { display: block; }
.feed-more-sheet .feed-more-report .fl-report-bd { padding: 0 2px 4px; max-height: min(52vh, 360px); }
.feed-more-sheet .feed-more-report .fl-report-ft { padding: 12px 0 4px; }
.feed-more-sheet .hs-head .feed-more-back {
    display: none;
    width: 32px; height: 32px;
    border: 0; border-radius: 8px;
    background: rgba(255,255,255,0.08);
    color: #fff; margin-right: 8px; flex-shrink: 0;
    cursor: pointer;
}
.feed-more-sheet.is-report .hs-head .feed-more-back { display: inline-flex; align-items: center; justify-content: center; }
.feed-more-sheet.is-report .hs-head .t { flex: 1; text-align: center; margin-right: 32px; }

.play-center {
    position: absolute;
    left: 50%; top: 38%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 28px;
    z-index: 10;
}

/* 进度条 · 贴页面底部 */
.video-progress {
    position: absolute;
    left: 12px; right: 12px;
    bottom: 22px;
    z-index: 15;
}
.progress-track {
    height: 3px; background: rgba(255,255,255,0.28);
    border-radius: 2px; overflow: visible;
    position: relative;
}
.progress-fill {
    width: 42%; height: 100%;
    background: var(--brand-gradient);
    border-radius: 2px;
}
.progress-track::after {
    content: '';
    position: absolute;
    left: 42%; top: 50%;
    transform: translate(-50%, -50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(168,85,247,0.8);
}
.progress-time {
    display: flex; justify-content: space-between;
    margin-top: 4px;
    font-size: 10px; color: rgba(255,255,255,0.75);
    font-variant-numeric: tabular-nums;
}

/* 右侧互动栏 · 对齐首页 feed */
.vd-action-bar {
    position: absolute;
    right: 10px;
    bottom: 118px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    z-index: 12;
}
.vd-action-bar .action {
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    color: #fff; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.vd-action-bar .action i {
    font-size: 26px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
}
.vd-action-bar .action .count {
    font-size: 11px; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
.vd-action-bar .action.is-on i { color: #ff3b5c; }
.vd-action-bar .action.action-save.is-on i { color: var(--crypto-gold); }

/* 创作者卡片 */
.creator-card {
    position: absolute;
    left: 16px; right: 64px;
    bottom: 52px;
    padding: 10px 10px 10px 12px;
    background: rgba(20,20,30,0.78);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 10px;
    z-index: 11;
}
.creator-card .avatar-ring {
    width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box;
}
.creator-card .avatar-ring .avatar-md { width: 40px; height: 40px; }
.creator-card .info { min-width: 0; overflow: hidden; }
.creator-card .name-row {
    display: flex; align-items: center; gap: 6px; min-width: 0;
}
.creator-card .name-text {
    font-size: 13px; font-weight: 700; color: #fff; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0; flex: 1;
}
.creator-card .badge-brand {
    flex-shrink: 0;
    padding: 1px 6px !important; font-size: 9px !important;
    line-height: 1.2; border-radius: 999px;
}
.creator-card .sub-info {
    font-size: 11px; color: rgba(255,255,255,0.72);
    margin-top: 3px; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.creator-card .btn-subscribe {
    flex-shrink: 0;
    height: 34px; padding: 0 10px; margin: 0; border: none;
    border-radius: 999px; font-size: 11px; font-weight: 700;
    white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    background: var(--brand-gradient); color: #fff;
    box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.creator-card .btn-subscribe:active { transform: scale(0.97); }
.creator-card .btn-subscribe.is-subscribed {
    background: rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.88);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.18);
}

.vd-subscribe-sheet.subscribe-sheet { height: 68%; z-index: 145; }
.vd-subscribe-sheet .sub-step { display: none; }
.vd-subscribe-sheet .sub-step.active { display: block; }
.vd-subscribe-sheet .sub-creator {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--bg-elevated);
    margin-bottom: 10px;
}
.vd-subscribe-sheet .sub-creator .av {
    width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
}
.vd-subscribe-sheet .sub-creator .n { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.vd-subscribe-sheet .sub-creator .d { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
.vd-subscribe-sheet .sub-plan-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.vd-subscribe-sheet .sub-plan-btn {
    border: 1px solid var(--border-color); background: var(--bg-card);
    color: var(--text-primary); border-radius: 12px;
    padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; width: 100%; text-align: left;
}
.vd-subscribe-sheet .sub-plan-btn.on {
    border-color: rgba(168,85,247,0.7); background: rgba(168,85,247,0.12);
}
.vd-subscribe-sheet .sub-plan-btn small { display: block; color: var(--text-tertiary); font-size: 10px; }
.vd-subscribe-sheet .sub-kv { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.vd-subscribe-sheet .sub-kv b { color: var(--text-primary); }
.vd-subscribe-sheet .sub-quick { display: flex; gap: 8px; margin: 8px 0 10px; }
.vd-subscribe-sheet .sub-quick button {
    flex: 1; height: 34px; border: 0; border-radius: 10px;
    background: var(--bg-elevated); color: var(--text-primary);
}
.vd-subscribe-sheet .sub-pwd {
    width: 100%; height: 40px; border: 1px solid var(--border-color); border-radius: 12px;
    padding: 0 12px; margin: 8px 0 12px; color: var(--text-primary); background: var(--bg-card);
}

.home-indicator { bottom: 6px; z-index: 20; }
</style>

<script>
(function () {
    var slug = 'luna_web3';
    var creatorName = 'Luna · @luna_web3';
    var creatorAv = 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=120&q=80';
    var btnSub = document.getElementById('vdBtnSubscribe');

    function toast(msg) {
        if (window.DigitalH5Nav && DigitalH5Nav.toast) DigitalH5Nav.toast(msg);
    }

    function syncSubscribeBtn() {
        if (!btnSub || !subscribeApi) return;
        var offer = subscribeApi.tierOffer(slug);
        var tier = subscribeApi.getSubTier(slug);
        btnSub.setAttribute('data-creator-slug', slug);
        if (!tier) {
            btnSub.classList.remove('is-subscribed');
            btnSub.innerHTML = '<i class="fa-solid fa-bolt"></i> 订阅 29.9U';
            return;
        }
        if (offer.pay === 'quarterly') {
            btnSub.classList.remove('is-subscribed');
            btnSub.innerHTML = '<i class="fa-solid fa-bolt"></i> 升级季付';
            return;
        }
        if (offer.pay === 'annual') {
            btnSub.classList.remove('is-subscribed');
            btnSub.innerHTML = '<i class="fa-solid fa-gem"></i> 升级年付';
            return;
        }
        btnSub.classList.add('is-subscribed');
        btnSub.innerHTML = '<i class="fa-solid fa-crown"></i> 已订阅';
    }

    var subscribeApi = null;
    if (window.H5SubscribeSheet) {
        subscribeApi = H5SubscribeSheet.init({
            overlayId: 'vdOverlay',
            sheetId: 'vdSubscribeSheet',
            nameId: 'vdSubCreatorName',
            avId: 'vdSubCreatorAv',
            balanceId: 'vdSubBalanceVal',
            needId: 'vdSubNeedVal',
            pwdId: 'vdSubPwdInput',
            confirmId: 'vdSubConfirmBtn',
            rechargeId: 'vdSubRechargeBtn',
            payId: 'vdSubPayBtn',
            doneId: 'vdSubDoneBtn',
            stepPlanId: 'vdSubStepPlan',
            stepRechargeId: 'vdSubStepRecharge',
            stepPwdId: 'vdSubStepPwd',
            stepDoneId: 'vdSubStepDone',
            onSubscribed: function () {
                syncSubscribeBtn();
            }
        });
    }

    if (btnSub) {
        syncSubscribeBtn();
        btnSub.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (!subscribeApi) {
                toast('订阅模块未加载');
                return;
            }
            var offer = subscribeApi.tierOffer(slug);
            if (!offer.pay) {
                toast('已是最高订阅档位');
                return;
            }
            var price = offer.meta && offer.meta.price ? offer.meta.price : 29.9;
            subscribeApi.open({
                slug: slug,
                name: creatorName,
                avatar: creatorAv,
                defaultPlan: price
            });
        });
    }

    var like = document.getElementById('vdActLike');
    if (like) {
        like.addEventListener('click', function () {
            like.classList.toggle('is-on');
            toast(like.classList.contains('is-on') ? '已点赞' : '已取消点赞');
        });
    }
    var save = document.getElementById('vdActSave');
    if (save) {
        save.addEventListener('click', function () {
            save.classList.toggle('is-on');
            toast(save.classList.contains('is-on') ? '已收藏' : '已取消收藏');
        });
    }
    var comment = document.getElementById('vdActComment');
    if (comment) {
        comment.addEventListener('click', function () {
            toast('评论功能演示：可在完整版打开评论面板');
        });
    }
    var share = document.getElementById('vdActShare');
    if (share) share.addEventListener('click', function () { toast('分享面板演示'); });

    var btnCc = document.getElementById('vdBtnCc');
    var ccOn = true;
    if (btnCc) {
        btnCc.addEventListener('click', function (e) {
            e.stopPropagation();
            ccOn = !ccOn;
            btnCc.classList.toggle('is-on', ccOn);
            btnCc.setAttribute('aria-pressed', ccOn ? 'true' : 'false');
            toast(ccOn ? '弹幕已开启' : '弹幕已关闭');
        });
    }

    var vdOverlay = document.getElementById('vdOverlay');
    var vdFeedMoreSheet = document.getElementById('vdFeedMoreSheet');
    var vdSubscribeSheet = document.getElementById('vdSubscribeSheet');
    var vdVideoWrap = document.getElementById('vdVideoWrap');
    var vdFeedMoreTitle = document.getElementById('vdFeedMoreTitle');
    var vdFeedMoreReportReasons = document.getElementById('vdFeedMoreReportReasons');
    var vdFeedMoreReportDesc = document.getElementById('vdFeedMoreReportDesc');
    var vdFeedMoreReportSubmit = document.getElementById('vdFeedMoreReportSubmit');
    var vdFeedMoreBack = document.getElementById('vdFeedMoreBack');
    var vdFeedMoreClose = document.getElementById('vdFeedMoreClose');
    var vdFeedMoreReasonsReady = false;
    var contentId = 'video-luna-mountain-01';
    var contentTitle = 'Luna · 山景氛围短片';

    function anyVdSheetOpen() {
        return (vdSubscribeSheet && vdSubscribeSheet.classList.contains('show')) ||
            (vdFeedMoreSheet && vdFeedMoreSheet.classList.contains('show'));
    }
    function syncVdOverlay() {
        if (!vdOverlay) return;
        if (anyVdSheetOpen()) vdOverlay.classList.add('show');
        else vdOverlay.classList.remove('show');
    }
    function resetVdFeedMoreReportForm() {
        if (vdFeedMoreReportReasons) {
            vdFeedMoreReportReasons.querySelectorAll('input[name="vdFeedMoreReportReason"]').forEach(function (el) {
                el.checked = false;
            });
        }
        if (vdFeedMoreReportDesc) vdFeedMoreReportDesc.value = '';
        if (vdFeedMoreReportSubmit) vdFeedMoreReportSubmit.disabled = true;
    }
    function resetVdFeedMoreView() {
        if (!vdFeedMoreSheet) return;
        vdFeedMoreSheet.classList.remove('is-report');
        if (vdFeedMoreTitle) vdFeedMoreTitle.textContent = '更多操作';
        resetVdFeedMoreReportForm();
    }
    function clearVdPressHold() {
        if (vdVideoWrap) vdVideoWrap.classList.remove('cover-press-hold');
    }
    function closeVdFeedMore() {
        if (vdFeedMoreSheet) vdFeedMoreSheet.classList.remove('show');
        resetVdFeedMoreView();
        clearVdPressHold();
        syncVdOverlay();
    }
    function openVdFeedMore() {
        if (anyVdSheetOpen() && vdSubscribeSheet && vdSubscribeSheet.classList.contains('show')) return;
        resetVdFeedMoreView();
        if (vdFeedMoreSheet) vdFeedMoreSheet.classList.add('show');
        syncVdOverlay();
    }
    function ensureVdFeedMoreReportReasons() {
        var R = window.FL_ContentReport;
        if (!R || !vdFeedMoreReportReasons || vdFeedMoreReasonsReady) return;
        vdFeedMoreReportReasons.innerHTML = R.reasonHtml('vdFeedMoreReportReason');
        vdFeedMoreReasonsReady = true;
    }
    function syncVdFeedMoreReportSubmit() {
        if (!vdFeedMoreReportSubmit || !vdFeedMoreReportReasons) return;
        var checked = vdFeedMoreReportReasons.querySelector('input[name="vdFeedMoreReportReason"]:checked');
        vdFeedMoreReportSubmit.disabled = !checked;
    }
    function openVdFeedMoreReport() {
        var R = window.FL_ContentReport;
        if (!R) {
            toast('举报功能暂不可用');
            return;
        }
        ensureVdFeedMoreReportReasons();
        resetVdFeedMoreReportForm();
        if (vdFeedMoreTitle) vdFeedMoreTitle.textContent = R.REPORT_SHEET_TITLE || '举报';
        if (vdFeedMoreSheet) vdFeedMoreSheet.classList.add('is-report');
    }
    function finishVdFeedMorePreference() {
        closeVdFeedMore();
        toast('提交成功');
    }

    if (vdFeedMoreClose) vdFeedMoreClose.addEventListener('click', closeVdFeedMore);
    if (vdFeedMoreBack) vdFeedMoreBack.addEventListener('click', resetVdFeedMoreView);
    if (vdFeedMoreReportReasons) vdFeedMoreReportReasons.addEventListener('change', syncVdFeedMoreReportSubmit);
    if (vdFeedMoreReportSubmit) {
        vdFeedMoreReportSubmit.addEventListener('click', function () {
            var R = window.FL_ContentReport;
            if (!R) {
                toast('举报功能暂不可用');
                return;
            }
            var checked = vdFeedMoreReportReasons && vdFeedMoreReportReasons.querySelector('input[name="vdFeedMoreReportReason"]:checked');
            if (!checked) {
                toast('请选择举报原因');
                return;
            }
            var desc = (vdFeedMoreReportDesc && vdFeedMoreReportDesc.value || '').trim();
            closeVdFeedMore();
            R.submitReport({
                reason: checked.value,
                desc: desc,
                type: 'video',
                contentId: contentId,
                contentTitle: contentTitle,
                toast: toast,
                onDone: function () {
                    if (window.DigitalH5Nav && DigitalH5Nav.go) DigitalH5Nav.go('home.html');
                    else window.location.href = 'home.html';
                }
            });
        });
    }
    document.querySelectorAll('[data-vd-feed-more]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var kind = btn.getAttribute('data-vd-feed-more');
            if (kind === 'report') {
                openVdFeedMoreReport();
                return;
            }
            if (kind === 'not-interested' || kind === 'hide-creator' || kind === 'reduce-similar') {
                finishVdFeedMorePreference();
            }
        });
    });
    if (vdOverlay) {
        vdOverlay.addEventListener('click', function () {
            if (vdFeedMoreSheet && vdFeedMoreSheet.classList.contains('show')) closeVdFeedMore();
        });
    }

    var lpTimer = null;
    var lpStartX = 0;
    var lpStartY = 0;
    var lpFired = false;

    function vdLongPressBlocked(el) {
        if (!el || !el.closest) return true;
        return !!el.closest('.top-controls, .vd-action-bar, .creator-card, .video-progress, .play-center, .status-bar, .home-sheet, .home-overlay');
    }
    function clearVdLongPressTimer() {
        if (lpTimer) {
            clearTimeout(lpTimer);
            lpTimer = null;
        }
    }
    function beginVdLongPress(clientX, clientY, target) {
        if (anyVdSheetOpen()) return;
        if (vdLongPressBlocked(target)) return;
        if (!target.closest || !target.closest('#vdVideoWrap')) return;
        clearVdLongPressTimer();
        clearVdPressHold();
        lpFired = false;
        lpStartX = clientX;
        lpStartY = clientY;
        lpTimer = setTimeout(function () {
            lpTimer = null;
            lpFired = true;
            if (vdVideoWrap) vdVideoWrap.classList.add('cover-press-hold');
            openVdFeedMore();
            try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) { /* ignore */ }
        }, 480);
    }
    function moveVdLongPress(clientX, clientY) {
        if (!lpTimer) return;
        if (Math.abs(clientY - lpStartY) > 14 || Math.abs(clientX - lpStartX) > 14) {
            clearVdLongPressTimer();
            clearVdPressHold();
        }
    }

    document.body.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        beginVdLongPress(e.clientX, e.clientY, e.target);
    });
    document.body.addEventListener('pointermove', function (e) {
        moveVdLongPress(e.clientX, e.clientY);
    });
    document.body.addEventListener('pointerup', function () {
        clearVdLongPressTimer();
        clearVdPressHold();
        lpFired = false;
    });
    document.body.addEventListener('pointercancel', function () {
        clearVdLongPressTimer();
        clearVdPressHold();
        lpFired = false;
    });

    if (vdVideoWrap) {
        vdVideoWrap.addEventListener('contextmenu', function (e) {
            if (vdLongPressBlocked(e.target)) return;
            e.preventDefault();
            if (vdVideoWrap) vdVideoWrap.classList.add('cover-press-hold');
            openVdFeedMore();
        });
    }
})();
</script>
</body>
</html>
