<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>广告中心 · 设置</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/ad-system.css">
<script src="../js/h5-theme-boot.js"></script>
<style>
.nav-bar{background:var(--bg-primary)}
.app-content{padding-top:calc(var(--status-bar-height) + var(--nav-bar-height));padding-bottom:calc(var(--tab-bar-height) + 16px)}
#adToast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#adToast.show{opacity:1}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 28px;background:var(--bg-primary);border-top:1px solid var(--border-color);display:flex;gap:8px;z-index:50}
.page-settings-h5 .ad-form{max-width:none;padding:0}
</style>
<link rel="stylesheet" href="../css/h5-light-theme.css">
</head>
<body class="page-settings page-settings-h5" data-ad-shell="settings">

<div class="status-bar"><span class="time">9:41</span></div>
<div class="nav-bar solid">
  <div class="nav-left"><div class="nav-btn" id="adSettingsBack"><i class="fa-solid fa-chevron-left"></i></div></div>
  <div class="nav-title" id="adSettingsNavTitle">广告中心</div>
</div>

<div id="adSettingsStage">
  <section class="ad-set-view on" data-ad-view="center">
    <div class="app-content ad-center-wrap">
      <div class="ad-center-head">
        <div class="ad-center-role" id="adRoleStrip"></div>
        <div class="ad-center-toolbar" id="adCenterToolbar">
          <button type="button" class="btn btn-primary" id="adBtnCreate" onclick="FLAdUser.tryCreate()"><i class="fa-solid fa-plus"></i> 创建广告</button>
          <button type="button" class="btn btn-secondary" id="adBtnWallet" onclick="FLAdUser.adGo('wallet')"><i class="fa-solid fa-wallet"></i> 广告账户</button>
          <button type="button" class="btn btn-secondary" id="adBtnApplyQual" hidden onclick="FLAdUser.adGo('apply')"><i class="fa-solid fa-id-card"></i> 申请广告主</button>
        </div>
      </div>
      <div class="ad-hero ad-qual-banner" id="adQualBanner" hidden></div>
      <div class="ad-web-grid">
      <div class="ad-card ad-center-panel ad-overview" id="adCenterOverview">
        <div class="ad-overview-top">
          <h3 class="ad-overview-title">账户与投放</h3>
          <button type="button" class="btn btn-ghost btn-sm ad-overview-link" onclick="FLAdUser.adGo('wallet')">账户明细</button>
        </div>
        <div class="ad-overview-hero">
          <div class="ad-overview-hero-label">可用余额</div>
          <div class="ad-overview-hero-row"><span class="ad-overview-hero-value" id="adBal">—</span><span class="ad-overview-hero-unit">USDT</span></div>
          <div class="ad-overview-hero-meta">冻结 <strong id="adFrozen">—</strong> USDT</div>
        </div>
        <div class="ad-overview-chips">
          <div class="ad-overview-chip"><span class="chip-val" id="adActive">—</span><span class="chip-lbl">投放中</span></div>
          <div class="ad-overview-chip"><span class="chip-val" id="adPending">—</span><span class="chip-lbl">待审核</span></div>
          <div class="ad-overview-chip"><span class="chip-val" id="adPendingPay">—</span><span class="chip-lbl">待支付</span></div>
        </div>
        <div class="ad-overview-perf">
          <div class="perf-col"><span class="perf-num" id="adImp">—</span><span class="perf-lbl">曝光</span></div>
          <div class="perf-col"><span class="perf-num" id="adClk">—</span><span class="perf-lbl">点击</span></div>
          <div class="perf-col"><span class="perf-num" id="adSpend">—</span><span class="perf-lbl">消耗 USDT</span></div>
        </div>
      </div>
      <div class="ad-card ad-center-panel ad-center-panel--list">
        <h3 class="ad-panel-title">我的广告</h3>
        <div class="ad-filter">
          <button type="button" class="on" data-ad-filter="">全部</button>
          <button type="button" data-ad-filter="unpaid">待支付</button>
          <button type="button" data-ad-filter="pending_review">待审核</button>
          <button type="button" data-ad-filter="active">投放中</button>
          <button type="button" data-ad-filter="paused">已暂停</button>
          <button type="button" data-ad-filter="rejected">驳回</button>
        </div>
        <div id="adListMount"></div>
      </div>
      </div>
    </div>
  </section>

  <section class="ad-set-view" data-ad-view="create">
    <div class="ad-wizard-steps" style="padding:8px 16px 0"><span data-step="1" class="on">1</span><span data-step="2">2</span><span data-step="3">3</span><span data-step="4">4</span><span data-step="5">5</span><span data-step="6">6</span><span data-step="7">7</span></div>
    <form id="adCreateForm">
      <section class="ad-step-panel on" data-step="1"><div class="field"><label>广告名称</label><input name="name" required></div><div class="field"><label>类型</label><select name="type"><option>品牌曝光</option><option>直播引流</option></select></div><div class="field"><label>标题</label><input name="title"></div><div class="field"><label>文案</label><textarea name="copy" rows="3"></textarea></div><div class="bar"><button type="button" class="btn btn-primary" style="flex:1" data-next>下一步</button></div></section>
      <section class="ad-step-panel" data-step="2"><div class="field"><label>素材</label><input type="file" id="adMaterialInput" accept="image/*"><div id="adMaterialPreview" style="height:120px;margin-top:8px;background:var(--bg-inset);border-radius:12px"></div></div><div class="bar"><button type="button" class="btn btn-secondary" data-prev>上一步</button><button type="button" class="btn btn-primary" style="flex:1" data-next>下一步</button></div></section>
      <section class="ad-step-panel" data-step="3"><div class="field"><label>广告位</label><select name="slotCode"><option value="feed_video">信息流</option><option value="home_banner">Banner</option></select></div><div class="field"><label>落地</label><select name="landingType"><option value="live">直播间</option><option value="external">外链</option></select></div><div class="field"><label>链接</label><input name="landingUrl"></div><div class="bar"><button type="button" class="btn btn-secondary" data-prev>上一步</button><button type="button" class="btn btn-primary" style="flex:1" data-next>下一步</button></div></section>
      <section class="ad-step-panel" data-step="4"><div class="field"><label>开始</label><input type="datetime-local" name="startAt"></div><div class="field"><label>结束</label><input type="datetime-local" name="endAt"></div><div class="field"><label>地区</label><select name="region"><option>全部</option></select></div><div class="bar"><button type="button" class="btn btn-secondary" data-prev>上一步</button><button type="button" class="btn btn-primary" style="flex:1" data-next>下一步</button></div></section>
      <section class="ad-step-panel" data-step="5"><div class="field"><label>套餐</label><select name="packageId"></select></div><p style="font-size:12px;padding:0 16px">应付 <strong id="adPackagePrice">—</strong></p><div class="bar"><button type="button" class="btn btn-secondary" data-prev>上一步</button><button type="button" class="btn btn-primary" style="flex:1" data-next>下一步</button></div></section>
      <section class="ad-step-panel" data-step="6"><p style="padding:16px;font-size:13px">模拟支付。<button type="button" id="adPayFailDemo" class="btn btn-secondary">支付失败演示</button> <button type="button" class="btn btn-link" onclick="FLAdUser.adGo('wallet')">充值</button></p><div class="bar"><button type="button" class="btn btn-secondary" data-prev>上一步</button><button type="button" class="btn btn-primary" style="flex:1" id="adMockPay">确认支付</button></div></section>
      <section class="ad-step-panel" data-step="7"><div class="bar"><button type="button" class="btn btn-secondary" id="adSaveDraft">草稿</button><button type="button" class="btn btn-primary" style="flex:1" id="adSubmitReview">提交审核</button></div></section>
    </form>
  </section>

  <section class="ad-set-view" data-ad-view="detail">
    <div class="app-content" id="adDetailRoot"></div>
    <div class="app-content ops" style="padding-top:0;display:flex;flex-wrap:wrap;gap:8px">
      <button type="button" class="btn btn-secondary" id="adBtnStats">数据</button>
      <button type="button" class="btn btn-secondary" id="adBtnPause">暂停</button>
      <button type="button" class="btn btn-secondary" id="adBtnResume" hidden>恢复</button>
      <button type="button" class="btn btn-primary" id="adBtnResubmit" hidden>重提</button>
      <button type="button" class="btn btn-secondary" id="adBtnRefund" hidden>退款</button>
      <button type="button" class="btn btn-secondary" id="adBtnRemove">下架</button>
    </div>
  </section>

  <section class="ad-set-view" data-ad-view="stats">
    <div class="app-content"><p id="adStatsNote" style="font-size:11px;color:var(--text-tertiary)"></p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="card" style="padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-color)"><div class="l" style="font-size:11px;color:var(--text-tertiary)">曝光</div><div class="v" id="stDImp" style="font-size:20px;font-weight:800">—</div></div>
        <div class="card" style="padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-color)"><div class="l" style="font-size:11px;color:var(--text-tertiary)">点击</div><div class="v" id="stDClk" style="font-size:20px;font-weight:800">—</div></div>
        <div class="card" style="padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-color)"><div class="l" style="font-size:11px;color:var(--text-tertiary)">CTR</div><div class="v" id="stDCtr" style="font-size:20px;font-weight:800">—</div></div>
        <div class="card" style="padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-color)"><div class="l" style="font-size:11px;color:var(--text-tertiary)">消耗</div><div class="v" id="stDSpend" style="font-size:20px;font-weight:800">—</div></div>
        <div class="card" style="padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-color);grid-column:1/-1"><div class="l" style="font-size:11px;color:var(--text-tertiary)">转化</div><div class="v" id="stDConv" style="font-size:20px;font-weight:800">—</div></div>
      </div>
    </div>
  </section>

  <section class="ad-set-view" data-ad-view="wallet">
    <div class="app-content">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="card" style="padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-color)"><div style="font-size:11px;color:var(--text-tertiary)">可用</div><div id="wBal" style="font-size:18px;font-weight:800">—</div></div>
        <div class="card" style="padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-color)"><div style="font-size:11px;color:var(--text-tertiary)">冻结</div><div id="wFrozen" style="font-size:18px;font-weight:800">—</div></div>
        <div class="card" style="padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-color)"><div style="font-size:11px;color:var(--text-tertiary)">已消费</div><div id="wSpent" style="font-size:18px;font-weight:800">—</div></div>
        <div class="card" style="padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-color)"><div style="font-size:11px;color:var(--text-tertiary)">已退款</div><div id="wRefunded" style="font-size:18px;font-weight:800">—</div></div>
      </div>
      <button type="button" class="btn btn-primary" id="wRecharge" style="width:100%">模拟充值</button>
      <div id="wFinList" style="margin-top:12px"></div>
    </div>
  </section>

  <section class="ad-set-view" data-ad-view="apply">
    <div class="app-content">
      <div class="set-card ad-set-card">
        <div class="ssh"><div class="ic-circle"><i class="fa-solid fa-id-card"></i></div><div><h3>申请广告主</h3></div></div>
        <div class="body">
          <form id="adApplyForm" class="ad-form">
            <div class="ad-field"><label for="adApplyCompanyH5">主体名称</label><input id="adApplyCompanyH5" name="companyName" required placeholder="公司或品牌全称"></div>
            <div class="ad-field"><label for="adApplyEmailH5">联系邮箱</label><input id="adApplyEmailH5" name="contact" type="email" required placeholder="name@company.com"></div>
            <div class="ad-form-actions"><button type="submit" class="btn btn-primary btn-block">提交申请</button></div>
          </form>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="adToast"></div>
<script src="../js/digital-h5-nav.js"></script>
<script src="../js/ad-system-store.js"></script>
<script src="../js/ad-system-api.js"></script>
<script src="../js/ad-system-user.js"></script>
<script src="../js/ad-settings-shell.js"></script>
</body>
</html>
