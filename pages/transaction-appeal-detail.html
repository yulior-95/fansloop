<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>申诉详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<script src="../js/h5-theme-boot.js"></script>
<style>
.nav-bar { background: var(--bg-primary); }
.app-content {
    padding-top: calc(var(--status-bar-height) + var(--nav-bar-height));
    padding-bottom: 24px;
}
.hero {
    margin: 10px 16px 12px;
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(251,191,36,0.05));
    border: 1px solid rgba(245,158,11,0.28);
}
.hero .rid { font-size: 10px; color: var(--text-tertiary); font-weight: 700; letter-spacing: 0.4px; }
.hero .num { margin-top: 6px; font-size: 22px; font-weight: 900; font-family: ui-monospace, monospace; }
.hero .sub { margin-top: 8px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.card {
    margin: 0 16px 12px;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
}
.card h3 { font-size: 13px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.card .body { font-size: 13px; line-height: 1.65; color: var(--text-secondary); }
.timeline { margin-top: 4px; border-left: 2px solid var(--border-color); margin-left: 8px; padding-left: 14px; }
.timeline .ti { position: relative; margin-bottom: 14px; }
.timeline .ti::before {
    content: ''; position: absolute; left: -19px; top: 4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--brand-purple); border: 2px solid var(--bg-card);
}
.timeline .ti.done::before { background: var(--brand-purple); }
.timeline .tm { font-size: 11px; color: var(--text-tertiary); }
.timeline .tx { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.45; }
.thumbs { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.thumbs img { width: 100px; height: 68px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }
.btn-row { margin: 0 16px; display: flex; gap: 8px; }
.btn-row .btn { flex: 1; height: 40px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary); font-size: 13px; font-weight: 600; }
.btn-row .btn.primary { background: var(--brand-gradient); border: 0; color: #fff; }
</style>
<link rel="stylesheet" href="../css/h5-light-theme.css">
</head>
<body>
<div class="status-bar"><span class="time">9:41</span><span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>
<div class="nav-bar solid">
    <div class="nav-left"><div class="nav-btn" data-back="my-appeals.html"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title">申诉详情</div>
    <div class="nav-right"></div>
</div>
<div class="app-content">
    <div class="hero">
        <div class="rid">申诉单号</div>
        <div class="num" id="appealNo">AP20260505110002</div>
        <div class="sub">关联订单 <strong id="orderNo">WD20260504195518</strong> · 类型：提现未到账 · 状态：<strong id="appealStatus">处理中</strong></div>
    </div>
    <div class="card">
        <h3><i class="fa-solid fa-align-left"></i> 申诉说明</h3>
        <div class="body" id="appealDesc">用户反馈银行卡尾号 6280 在预计时间内未收到法币入账；已提交银行流水截图与订单截图。</div>
        <div class="thumbs">
            <img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=200" alt="">
            <img src="https://images.unsplash.com/photo-1563986768609-322da13575f3?w=200" alt="">
        </div>
    </div>
    <div class="card">
        <h3><i class="fa-solid fa-clock"></i> 处理进度</h3>
        <div class="timeline" id="appealTimeline">
            <div class="ti done"><div class="tm">2026-05-05 11:00</div><div class="tx">申诉已提交，系统已生成单号</div></div>
            <div class="ti done"><div class="tm">2026-05-05 11:06</div><div class="tx">资料已送达风控复核队列</div></div>
            <div class="ti"><div class="tm">待定</div><div class="tx">客服将在 1-3 个工作日内反馈结果</div></div>
        </div>
    </div>
    <div class="btn-row">
        <button type="button" class="btn" id="btnOrder">查看关联订单</button>
        <button type="button" class="btn primary" id="btnContact">联系客服</button>
    </div>
</div>
<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
(function () {
    var q = new URLSearchParams(location.search);
    var ap = q.get('appeal');
    var od = q.get('order');
    if (ap) document.getElementById('appealNo').textContent = ap;
    if (od) document.getElementById('orderNo').textContent = od;
    document.getElementById('btnOrder').addEventListener('click', function () {
        location.href = 'transaction-detail.html?order=' + encodeURIComponent(od || 'WD20260504195518');
    });
    document.getElementById('btnContact').addEventListener('click', function () {
        location.href = 'after-sales.html?support=1';
    });
})();
</script>
</body>
</html>
