<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>编辑数字商品</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/digital-h5.css">
</head>
<body>
<div class="status-bar dark-mode">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>
<div class="nav-bar da-nav solid">
    <div class="nav-left"><div class="nav-btn" data-go="creator-showcase-manage.html"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title">编辑商品</div>
    <div class="nav-right"></div>
</div>

<div class="app-content da-page no-tab">
    <div style="padding:12px 16px 0">
        <div class="da-id" style="margin-bottom:12px">商品 ID · da_seed_img_01 · 图片合集</div>
        <div class="da-field">
            <label>作品名称</label>
            <input id="daTitle" type="text" value="富士山日出 · 4K 写真合集">
        </div>
        <div class="da-field">
            <label>作品描述</label>
            <textarea>五合目日出组图高清原片共 8 张，购买后可浏览与下载全套。</textarea>
        </div>
        <div class="da-field">
            <label>商品首图</label>
            <div class="da-hero-pick">
                <div class="preview"><img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=300&q=80" alt=""></div>
                <div class="ops">
                    <button type="button" class="btn btn-sm btn-primary" style="align-self:flex-start" id="btnCover">更换首图</button>
                    <p class="hint" style="margin:0">编辑不可改上架状态，上下架请回橱窗按钮</p>
                </div>
            </div>
        </div>
        <div class="da-field">
            <label>价格（USDT）</label>
            <input type="number" value="4.5">
        </div>
        <div class="da-field">
            <label>商品个数</label>
            <div class="da-choice" id="daSupply">
                <div class="opt" data-supply="limited"><strong>限量</strong><span>可售份数不可低于已售</span></div>
                <div class="opt on" data-supply="unlimited"><strong>不限个数</strong><span>当前：不限 · 已售 86</span></div>
            </div>
        </div>
        <p class="da-desc" style="margin:0 0 14px">上架 / 下架请回橱窗按钮操作，本页不可改上架状态。</p>
        <div class="da-actions">
            <button type="button" class="btn btn-secondary" data-go="creator-showcase-manage.html">取消</button>
            <button type="button" class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>
<div class="da-toast" id="daToast"></div>
<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
document.querySelectorAll('#daSupply .opt').forEach(function (el) {
    el.addEventListener('click', function () {
        document.querySelectorAll('#daSupply .opt').forEach(function (x) { x.classList.remove('on'); });
        el.classList.add('on');
    });
});
document.getElementById('btnCover').addEventListener('click', function () {
    DigitalH5Nav.toast('原型：首图已更换');
});
document.getElementById('btnSave').addEventListener('click', function () {
    if (!document.getElementById('daTitle').value.trim()) return DigitalH5Nav.toast('请填写作品名称');
    DigitalH5Nav.toast('已保存');
    setTimeout(function () { location.href = 'creator-showcase-manage.html'; }, 600);
});
</script>
</body>
</html>
