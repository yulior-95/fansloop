<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>支付密码 · GOODFANS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css-web/settings-pay-password.css">
<link rel="stylesheet" href="../css/h5-settings-security.css">
<script src="../js/h5-theme-boot.js"></script>
<style>
.nav-bar { background: var(--bg-primary); }
.app-content {
    padding: 12px 12px 28px;
    padding-top: calc(var(--status-bar-height) + var(--nav-bar-height) + 12px);
}
body.page-settings-h5 { --bg-elevated: var(--bg-card); --border-strong: var(--border-color); }
</style>
<link rel="stylesheet" href="../css/h5-light-theme.css">
</head>
<body class="page-settings page-settings-h5">
<div class="status-bar dark-mode"><span class="time">9:41</span><span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>
<div class="nav-bar solid" style="top:var(--status-bar-height)">
    <div class="nav-left"><div class="nav-btn" data-back="goodfans-account-security.html"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title" id="payPwdPageTitle">设置支付密码</div>
    <div class="nav-right"></div>
</div>
<div class="app-content">
    <p style="font-size:12px;color:var(--text-tertiary);margin:0 0 12px;line-height:1.5" id="payPwdPageLead">首次使用前须设置 6 位数字支付密码，与登录密码相互独立。</p>
    <div class="pay-pwd-return-banner" id="payPwdReturnBanner" hidden>
        <i class="fa-solid fa-circle-info"></i>
        <span data-return-label>设置完成后可返回上一页继续支付。</span>
    </div>
    <div class="pay-pwd-page-card">
        <div class="pay-pwd-steps" aria-hidden="true">
            <span class="pay-pwd-step-dot active"></span>
            <span class="pay-pwd-step-dot"></span>
        </div>
        <div class="pay-pwd-pane active" data-step="verify">
            <div class="ic-wrap"><i class="fa-solid fa-lock"></i></div>
            <h2 data-pane-title>验证当前密码</h2>
            <p class="lead" data-pane-sub>请输入当前 6 位支付密码以继续</p>
        </div>
        <div class="pay-pwd-pane" data-step="set">
            <div class="ic-wrap"><i class="fa-solid fa-key"></i></div>
            <h2 data-pane-title>设置支付密码</h2>
            <p class="lead" data-pane-sub>请输入 6 位数字，勿与登录密码相同</p>
        </div>
        <div class="pay-pwd-pane" data-step="confirm">
            <div class="ic-wrap"><i class="fa-solid fa-check-double"></i></div>
            <h2 data-pane-title>确认支付密码</h2>
            <p class="lead" data-pane-sub>请再次输入以确认</p>
        </div>
        <div class="pay-pwd-pane pay-pwd-done" data-step="done">
            <div class="ok-ic"><i class="fa-solid fa-circle-check"></i></div>
            <h2>设置完成</h2>
            <p class="lead" id="payPwdDoneText">支付密码设置成功，现在可以完成订阅与付费解锁。</p>
            <div class="pay-pwd-actions">
                <button type="button" class="btn btn-secondary" id="btnPayPwdLater">留在设置</button>
                <button type="button" class="btn btn-primary" id="btnPayPwdDone"><i class="fa-solid fa-arrow-left"></i> 返回继续</button>
            </div>
        </div>
        <div id="payPwdPadWrap">
            <div class="sub-pwd-input" id="payPwdDots" aria-hidden="true">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <div class="sub-pwd-pad" id="payPwdPad">
                <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
                <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
                <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
                <button type="button" data-action="clear"><i class="fa-solid fa-delete-left"></i></button>
                <button type="button" data-digit="0">0</button>
                <button type="button" data-action="submit"><i class="fa-solid fa-check"></i></button>
            </div>
            <p class="pay-pwd-hint"><i class="fa-solid fa-shield-halved"></i> 连续输错 5 次将冻结 24 小时 · 请勿使用 123456 等弱密码</p>
            <div class="pay-pwd-actions">
                <button type="button" class="btn btn-secondary" id="btnPayPwdBack">上一步</button>
            </div>
        </div>
    </div>
</div>
<div class="home-indicator"></div>
<div id="payPwdToast" class="toast-f" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 18px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;font-size:13px;font-weight:600"></div>
<style>#payPwdToast.show{display:block!important}</style>
<script src="../js/digital-h5-nav.js"></script>
<script src="../js-web/user-assets-store.js"></script>
<script src="../js-web/pay-password-store.js"></script>
<script src="../js-web/settings-pay-password.js"></script>
</body>
</html>
