<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>橱窗 · 访客预览</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/digital-h5.css">
<style>
.preview-banner {
    margin: 8px 16px 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(245,158,11,.12);
    border: 1px solid rgba(245,158,11,.35);
    color: #FBBF24;
    font-size: 12px;
    display: flex; align-items: center; gap: 8px;
}
</style>
</head>
<body>
<div class="status-bar dark-mode">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>
<div class="nav-bar da-nav solid">
    <div class="nav-left"><div class="nav-btn" data-go="creator-showcase-manage.html"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title">橱窗预览</div>
    <div class="nav-right"><span style="font-size:12px;color:#FBBF24;font-weight:700;cursor:pointer" data-go="creator-showcase-manage.html">返回管理</span></div>
</div>

<div class="app-content da-page no-tab">
    <div class="preview-banner"><i class="fa-solid fa-eye"></i> 当前为访客预览，可查看详情，不可真实购买</div>
    <div class="da-chips" style="padding-top:12px">
        <div class="da-chip on">数字商品</div>
        <div class="da-chip" data-go="creator-showcase-affiliate.html">实体选品</div>
    </div>
    <div class="da-grid">
        <div class="da-card" data-go="digital-detail.html?preview=1">
            <div class="cover">
                <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=600&q=80" alt="">
                <span class="kind">图片合集</span>
                <span class="price">4.5 U</span>
            </div>
            <div class="meta">
                <div class="title">富士山日出 · 4K 写真合集</div>
                <div class="sub">预览 · 购买禁用</div>
            </div>
        </div>
        <div class="da-card" data-go="digital-detail-video.html?preview=1">
            <div class="cover">
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&q=80" alt="">
                <span class="kind">视频</span>
                <span class="price">6.0 U</span>
            </div>
            <div class="meta">
                <div class="title">城市夜色 · 延时短片</div>
                <div class="sub">预览 · 购买禁用</div>
            </div>
        </div>
    </div>
</div>
<div class="da-toast" id="daToast"></div>
<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
/* 预览态进详情后底部购买会被详情页 ?preview=1 处理；此处卡片直达详情 */
</script>
</body>
</html>
