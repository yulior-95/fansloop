<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>售后与帮助</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/h5-light-theme.css">
<script src="../js/h5-theme-boot.js"></script>
<style>
.nav-bar { background: var(--bg-primary); }
.app-content {
    padding-top: calc(var(--status-bar-height) + var(--nav-bar-height));
    padding-bottom: 28px;
}
.as-wrap { padding: 0 12px; }
.as-intro {
    margin: 8px 0 14px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.55;
}
.as-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 12px;
}
.as-card .hd {
    padding: 12px 14px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border-color);
}
.as-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-color);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.as-row:last-child { border-bottom: none; }
.as-row:active { background: rgba(255, 255, 255, 0.04); }
.as-row .ic {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 14px;
    flex-shrink: 0;
}
.as-row .m { flex: 1; min-width: 0; }
.as-row .m .t { font-size: 14px; font-weight: 700; }
.as-row .m .s { margin-top: 3px; font-size: 11px; color: var(--text-tertiary); line-height: 1.4; }
.as-row .chev { font-size: 10px; color: var(--text-tertiary); }
.as-tip {
    padding: 12px 14px;
    font-size: 11px;
    color: var(--text-tertiary);
    line-height: 1.55;
}
</style>
</head>
<body>
<div class="status-bar">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>
<div class="nav-bar solid">
    <div class="nav-left"><div class="nav-btn" data-back="settings.html"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title">售后与帮助</div>
    <div class="nav-right"></div>
</div>

<div class="app-content as-wrap">
    <p class="as-intro">订单争议、充值提现、数字商品与订阅问题，可在此快速找到入口。数字作品购买后 <strong>7 日内</strong>可申请退款（如无法打开 / 无法播放）。原型演示 24h 内响应。</p>

    <div class="as-card">
        <div class="hd">快速处理</div>
        <div class="as-row" data-go="transaction-contact.html">
            <div class="ic" style="background:linear-gradient(135deg,#06b6d4,#3b82f6)"><i class="fa-solid fa-headset"></i></div>
            <div class="m"><div class="t">联系客服</div><div class="s">充值、提现、订阅与账号问题 · IM 工单</div></div>
            <i class="fa-solid fa-chevron-right chev"></i>
        </div>
        <div class="as-row" data-go="my-appeals.html">
            <div class="ic" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"><i class="fa-solid fa-gavel"></i></div>
            <div class="m"><div class="t">我的申诉</div><div class="s">账变 / 提现 / 打赏争议 · 查看进度</div></div>
            <i class="fa-solid fa-chevron-right chev"></i>
        </div>
        <div class="as-row" data-go="transactions.html">
            <div class="ic" style="background:linear-gradient(135deg,#a855f7,#ec4899)"><i class="fa-solid fa-receipt"></i></div>
            <div class="m"><div class="t">账变记录</div><div class="s">从单条交易发起申诉或联系客服</div></div>
            <i class="fa-solid fa-chevron-right chev"></i>
        </div>
    </div>

    <div class="as-card">
        <div class="hd">资产与内容</div>
        <div class="as-row" data-go="funds-history.html">
            <div class="ic" style="background:linear-gradient(135deg,#10b981,#059669)"><i class="fa-solid fa-clock-rotate-left"></i></div>
            <div class="m"><div class="t">充提记录</div><div class="s">链上充值 / 提现状态查询</div></div>
            <i class="fa-solid fa-chevron-right chev"></i>
        </div>
        <div class="as-row" data-go="subscriptions.html">
            <div class="ic" style="background:linear-gradient(135deg,#ec4899,#be185d)"><i class="fa-regular fa-heart"></i></div>
            <div class="m"><div class="t">订阅管理</div><div class="s">续费、权益未开通、自动扣款</div></div>
            <i class="fa-solid fa-chevron-right chev"></i>
        </div>
    </div>

    <div class="as-card">
        <div class="hd">说明</div>
        <div class="as-tip">
            链上交易提交后一般不可撤销。若遇异常请先保存订单号与截图，再通过「联系客服」或「我的申诉」提交材料。严重违规可配合平台风控处理。
        </div>
    </div>
</div>

<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
</body>
</html>
