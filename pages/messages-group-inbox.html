<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>群聊通知</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<script src="../js/h5-theme-boot.js"></script>
<style>
.nav-bar { background: var(--bg-primary); }
.app-content {
    padding-top: calc(var(--status-bar-height) + var(--nav-bar-height));
    padding-bottom: calc(var(--tab-bar-height) + 16px);
}
.gi-toolbar {
    margin: 10px 16px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.gi-search {
    flex: 1;
    min-width: 160px;
    height: 36px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: var(--bg-card);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
}
.gi-search i { font-size: 13px; color: var(--text-tertiary); }
.gi-search input {
    flex: 1; min-width: 0; border: 0; outline: 0;
    background: transparent; color: var(--text-primary); font-size: 13px;
}
.gi-batch {
    width: 100%;
    display: flex;
    gap: 8px;
    margin-top: 4px;
}
.gi-batch button {
    flex: 1;
    height: 34px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-secondary);
}
.gi-batch button.primary {
    border: none;
    background: var(--brand-gradient);
    color: #fff;
}
.gi-hint {
    margin: 10px 16px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.22);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.45;
}
.gi-hint i { color: #60a5fa; margin-right: 4px; }
.gi-list { margin: 0 16px; }
.gi-item {
    display: flex;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 0.5px solid var(--border-color);
}
.gi-item:last-child { border-bottom: none; }
.gi-item .av {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #10B981, #3B82F6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
}
.gi-item .body { flex: 1; min-width: 0; }
.gi-item .name { font-size: 14px; font-weight: 700; line-height: 1.3; }
.gi-item .sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.35; }
.gi-item .meta { font-size: 10px; color: var(--text-tertiary); margin-top: 4px; }
.gi-item .acts {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
    justify-content: center;
}
.gi-item .acts button {
    height: 28px;
    padding: 0 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-secondary);
}
.gi-item .acts button.ok {
    border: none;
    background: var(--brand-gradient);
    color: #fff;
}
.gi-empty {
    padding: 48px 24px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 13px;
}
</style>
<link rel="stylesheet" href="../css/h5-light-theme.css">
</head>
<body data-page="messages-group-inbox">

<div class="status-bar">
    <span class="time">9:41</span>
    <span class="right">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
    </span>
</div>

<div class="nav-bar solid">
    <div class="nav-left"><div class="nav-btn" data-back="messages.html"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title">群聊通知 <span id="giNavCount" style="font-size:12px;color:var(--text-tertiary);font-weight:600"></span></div>
    <div class="nav-right"></div>
</div>

<div class="app-content">
    <div class="gi-toolbar">
        <div class="gi-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="giSearch" placeholder="搜索群名、邀请人…" autocomplete="off">
        </div>
        <div class="gi-batch">
            <button type="button" id="giRejectAll">全局拒绝</button>
            <button type="button" class="primary" id="giAcceptAll">批量同意</button>
        </div>
    </div>
    <div class="gi-hint"><i class="fa-solid fa-circle-info"></i> 与 Web 消息页「群聊通知」一致：同意后加入对应群聊；拒绝后从列表移除。</div>
    <div class="gi-list" id="giList"></div>
</div>

<div class="home-indicator"></div>
<script src="../js/messages-mobile.js"></script>
<script src="../js/digital-h5-nav.js"></script>
</body>
</html>
