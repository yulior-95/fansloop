<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>观看直播</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/h5-live-viewer.css">
<script src="../js/h5-theme-boot.js"></script>
<link rel="stylesheet" href="../css/h5-light-theme.css">
</head>
<body class="page-h5-live-viewer">

<div class="lv-stage" id="lvStage">
    <div class="status-bar dark-mode">
        <span class="time">9:41</span>
        <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
    </div>

    <div class="lv-video" id="lvVideo" role="img" aria-label="直播画面"></div>

    <div class="lv-top">
        <button type="button" class="lv-back" id="lvBack" aria-label="返回"><i class="fa-solid fa-chevron-down"></i></button>
        <span class="lv-pill"><span class="dot"></span> LIVE</span>
        <span class="lv-viewers" id="lvViewers"><i class="fa-regular fa-eye"></i> 2,486</span>
        <button type="button" class="lv-more" id="lvBtnShare" aria-label="分享"><i class="fa-solid fa-share-nodes"></i></button>
    </div>

    <div class="lv-host">
        <div class="av" id="lvHostAv"></div>
        <div class="meta">
            <div class="n" id="lvHostName">Luna 🌙</div>
            <div class="s" id="lvLiveTitle">爵士夜即兴 · 手机开播</div>
        </div>
        <button type="button" class="lv-follow" id="lvBtnFollow">关注</button>
    </div>

    <div class="lv-chat" id="lvChat" aria-live="polite"></div>

    <div class="lv-dock">
        <input type="text" id="lvChatInput" placeholder="说点什么…" maxlength="120" enterkeyhint="send">
        <button type="button" class="ic" id="lvBtnMicApply" title="申请上麦"><i class="fa-solid fa-microphone"></i></button>
        <button type="button" class="ic gift" id="lvBtnGift" title="打赏"><i class="fa-solid fa-gift"></i></button>
    </div>

    <div class="home-indicator"></div>
</div>

<script src="../js/digital-h5-nav.js"></script>
<script src="../js/h5-live-viewer-page.js"></script>
</body>
</html>
