<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>视频作品详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/digital-h5.css">
</head>
<body>
<div class="status-bar dark-mode">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>
<div class="nav-bar">
    <div class="nav-left"><div class="nav-btn" style="background:rgba(0,0,0,.4)" data-back="digital-store.html"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-right"><div class="nav-btn" style="background:rgba(0,0,0,.4)" id="btnShare"><i class="fa-solid fa-share-nodes"></i></div></div>
</div>

<div class="app-content" style="padding-bottom:100px">
    <div class="da-hero">
        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=900&q=80" alt="">
        <div class="lock">
            <i class="fa-solid fa-circle-play"></i>
            <span style="font-size:13px;font-weight:700">购买后可播放完整成片</span>
        </div>
    </div>
    <div class="da-body">
        <div class="da-kicker">
            <span class="badge badge-brand">视频作品</span>
            <span class="badge badge-crypto">da_seed_vid_02</span>
            <span class="badge badge-paid">限量 200</span>
        </div>
        <h1 class="da-title">城市夜色 · 延时短片</h1>
        <div class="da-id">限量 · 已售 42 · 剩余 158</div>
        <p class="da-desc">约 3 分钟 4K 延时成片。购买后可在线播放与下载原片。</p>
        <div class="da-creator" data-go="creator-showcase.html">
            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=200&q=80" alt="">
            <div>
                <div class="nm">Luna 🌙</div>
                <div class="hd">@luna_web3 · 进入橱窗</div>
            </div>
        </div>
        <div class="da-stats">
            <div class="da-stat"><div class="n">1</div><div class="l">视频</div></div>
            <div class="da-stat"><div class="n">42</div><div class="l">已售</div></div>
            <div class="da-stat"><div class="n">158</div><div class="l">剩余</div></div>
        </div>
    </div>
    <div class="da-section"><h3>成片预览</h3></div>
    <div class="da-media-row">
        <div class="tile" style="flex-basis:140px;height:80px">
            <img class="blur" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&q=80" alt="">
            <span class="ic"><i class="fa-solid fa-lock"></i> 03:12</span>
        </div>
    </div>
</div>

<div class="da-buybar">
    <div class="amt">
        <div class="p gradient-text">6.00 USDT</div>
        <div class="u">平台服务费 10% · 限量剩余 158 份</div>
    </div>
    <button class="btn btn-primary" id="btnBuy">立即购买</button>
</div>
<div class="da-toast" id="daToast"></div>
<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
(function () {
    var preview = /[?&]preview=1/.test(location.search);
    var btn = document.getElementById('btnBuy');
    if (preview) {
        btn.textContent = '预览不可购买';
        btn.disabled = true;
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-secondary');
    } else {
        btn.addEventListener('click', function () {
            location.href = 'digital-pay.html?price=6&title=' + encodeURIComponent('城市夜色 · 延时短片');
        });
    }
    document.getElementById('btnShare').addEventListener('click', function () {
        DigitalH5Nav.toast('已复制商品链接');
    });
})();
</script>
</body>
</html>
