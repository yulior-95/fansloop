<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>私聊</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<style>
body { background: var(--bg-primary); }
.mob-chat { min-height: 100vh; display: flex; flex-direction: column; }
.mob-chat-msgs {
    flex: 1;
    padding: 12px 14px 80px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.mob-bub {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    background: var(--bg-card);
    align-self: flex-start;
    line-height: 1.45;
}
.mob-bub.me { align-self: flex-end; background: var(--brand-gradient); color: #fff; }
.dm-limit-banner {
    margin: 0 14px 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(236,72,153,0.1));
    border: 1px solid rgba(245,158,11,0.3);
    color: #fcd34d;
    font-size: 11px;
    line-height: 1.45;
}
.dm-limit-banner[hidden] { display: none !important; }
.dm-limit-banner .t { font-weight: 700; color: #fde68a; margin-bottom: 3px; }
.mob-chat-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg-primary);
    border-top: 0.5px solid var(--border-color);
}
.mob-chat-bar .tools { display: flex; gap: 12px; margin-bottom: 8px; padding: 0 4px; }
.mob-chat-bar .tools button { font-size: 17px; color: var(--text-secondary); }
.mob-chat-bar .row { display: flex; gap: 8px; align-items: flex-end; }
.mob-chat-bar textarea {
    flex: 1;
    min-height: 36px;
    max-height: 100px;
    border-radius: 18px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    padding: 8px 14px;
    font-size: 14px;
    resize: none;
    outline: none;
    color: var(--text-primary);
}
.mob-chat-bar .send-btn {
    min-width: 56px; height: 36px;
    border-radius: 18px;
    background: var(--brand-gradient);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
}
</style>
</head>
<body data-page="messages-chat">

<div class="status-bar">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>

<div class="nav-bar solid">
    <div class="nav-title" id="chatTitle">Luna</div>
</div>

<div class="mob-chat" style="padding-top: calc(var(--status-bar-height) + var(--nav-bar-height))">
    <div class="dm-limit-banner" id="mobDmLimitBanner" hidden>
        <div class="t"><i class="fa-solid fa-lock"></i> 私信限制提示</div>
        <div id="mobDmLimitText">未互关且未订阅时，仅可发送首条私信；互关、订阅或对方回复后解除限制。</div>
    </div>
    <div class="mob-chat-msgs" id="mobMsgList"></div>
</div>

<div class="mob-chat-bar">
    <div class="tools">
        <button type="button" title="表情"><i class="fa-regular fa-face-smile"></i></button>
        <button type="button" id="mobBtnShare" title="分享作品"><i class="fa-solid fa-share"></i></button>
        <button type="button" title="图片"><i class="fa-regular fa-image"></i></button>
        <button type="button" title="语音"><i class="fa-solid fa-microphone"></i></button>
        <button type="button" id="mobBtnGift" title="送礼"><i class="fa-solid fa-gift"></i></button>
    </div>
    <div class="row">
        <textarea id="mobChatInput" placeholder="发消息…" rows="1"></textarea>
        <button type="button" class="send-btn" id="mobChatSend">发送</button>
    </div>
</div>

<div class="home-indicator"></div>
<script src="../js/messages-mobile.js"></script>
</body>
</html>
