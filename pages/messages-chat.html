<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>私聊</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/h5-messages.css">
<script src="../js/h5-theme-boot.js"></script>
<style>
.nav-bar { background: var(--bg-primary); }
.mob-chat {
    position: absolute;
    top: calc(var(--status-bar-height) + var(--nav-bar-height));
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-primary);
}
.mob-chat-msgs {
    flex: 1;
    padding: 12px 14px 108px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
}
.mob-bub {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    align-self: flex-start;
    line-height: 1.45;
    word-break: break-word;
}
.mob-bub.me {
    align-self: flex-end;
    background: var(--brand-gradient);
    color: #fff;
    border-color: transparent;
}
.dm-limit-banner {
    margin: 0 14px 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(236,72,153,0.1));
    border: 1px solid rgba(245,158,11,0.3);
    color: #fbbf24;
    font-size: 11px;
    line-height: 1.45;
}
:root[data-theme='light'] .dm-limit-banner {
    color: #92400e;
    background: linear-gradient(135deg, rgba(245,158,11,0.14), rgba(236,72,153,0.08));
    border-color: rgba(180,83,9,0.28);
}
.dm-limit-banner[hidden] { display: none !important; }
.dm-limit-banner .t { font-weight: 700; color: #fde68a; margin-bottom: 3px; }
:root[data-theme='light'] .dm-limit-banner .t { color: #78350f; }
.mob-chat-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px 12px 28px;
    background: var(--bg-secondary);
    border-top: 0.5px solid var(--border-color);
    z-index: 20;
}
.nav-bar.chat-nav .nav-title { display: none; }
.nav-bar.chat-nav {
    padding: 0 8px 0 4px;
    gap: 6px;
}
.nav-bar.chat-nav .chat-nav-left {
    flex: 1;
    min-width: 0;
    gap: 2px;
}
.chat-nav-profile {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 0 4px 0 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.chat-nav-profile .chat-head-av {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1.5px solid rgba(168, 85, 247, 0.45);
}
.chat-nav-profile .chat-head-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(148px, 42vw);
}
.nav-bar.chat-nav .nav-right {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
    min-width: 0;
}
.nav-bar.chat-nav .nav-right .nav-btn {
    width: 32px;
    height: 32px;
    font-size: 14px;
}
.mob-chat-search {
    display: none;
    padding: 8px 12px;
    border-bottom: 0.5px solid var(--border-color);
    background: var(--bg-secondary);
}
.mob-chat-search.show { display: block; }
.mob-chat-search input {
    width: 100%;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    padding: 0 12px;
    font-size: 13px;
    color: var(--text-primary);
    outline: none;
}
.mob-chat-search .hint {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 6px;
    line-height: 1.4;
}
.mob-bub.is-dim { opacity: 0.35; }
.mob-bub.is-hit { box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.55); }
.mob-emoji-panel {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 0 8px;
    max-height: 120px;
    overflow-y: auto;
}
.mob-emoji-panel.show { display: flex; }
.mob-emoji-panel button {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 10px;
    background: var(--bg-card);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
}
.mob-chat-bar .row { display: flex; gap: 6px; align-items: flex-end; }
.mob-chat-bar .bar-icon-btn {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border: 0;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.mob-chat-bar textarea {
    flex: 1;
    min-height: 36px;
    max-height: 100px;
    border-radius: 18px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    padding: 8px 14px;
    font-size: 14px;
    resize: none;
    outline: none;
    color: var(--text-primary);
}
.mob-chat-bar .voice-btn,
.mob-chat-bar .send-btn {
    height: 36px;
    border: 0;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.mob-chat-bar .voice-btn {
    width: 36px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    font-size: 16px;
}
.mob-chat-bar .send-btn {
    min-width: 56px;
    background: var(--brand-gradient);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
}
</style>
<link rel="stylesheet" href="../css/h5-light-theme.css">
</head>
<body data-page="messages-chat">

<div class="status-bar">
    <span class="time">9:41</span>
    <span class="right">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
    </span>
</div>

<div class="nav-bar solid chat-nav">
    <div class="nav-left chat-nav-left">
        <div class="nav-btn" data-back="messages.html" aria-label="返回"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="chat-nav-profile" id="chatHeadProfile" role="button" tabindex="0" aria-label="查看用户主页">
            <img class="chat-head-av" id="chatHeadAv" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=120&q=80" alt="">
            <span class="chat-head-name" id="chatTitle">Luna</span>
        </div>
    </div>
    <div class="nav-right">
        <div class="nav-btn" id="mobBtnChatSearch" aria-label="搜索聊天记录"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-btn" id="mobBtnVideoCall" aria-label="视频通话"><i class="fa-solid fa-video"></i></div>
        <div class="nav-btn" id="mobBtnVoiceCall" aria-label="语音通话"><i class="fa-solid fa-phone"></i></div>
        <div class="nav-btn" id="mobBtnChatMore" aria-label="更多"><i class="fa-solid fa-ellipsis-vertical"></i></div>
    </div>
</div>

<div class="mob-chat">
    <div class="mob-chat-search" id="mobChatSearchPanel">
        <input type="search" id="mobChatSearchInput" placeholder="搜索聊天记录…" autocomplete="off" enterkeyhint="search">
        <div class="hint" id="mobChatSearchHint">输入关键词高亮匹配消息</div>
    </div>
    <div class="dm-limit-banner" id="mobDmLimitBanner" hidden>
        <div class="t"><i class="fa-solid fa-lock"></i> 私信限制提示</div>
        <div id="mobDmLimitText">未互关且未订阅时，仅可发送首条私信；互关、订阅或对方回复后解除限制。</div>
    </div>
    <div class="mob-chat-msgs" id="mobMsgList"></div>
</div>

<div class="mob-chat-bar">
    <div class="mob-emoji-panel" id="mobEmojiPanel" aria-hidden="true"></div>
    <div class="row">
        <button type="button" class="bar-icon-btn" id="mobBtnEmoji" aria-label="表情"><i class="fa-solid fa-face-smile"></i></button>
        <button type="button" class="bar-icon-btn" id="mobBtnAttach" aria-label="图片" title="图片"><i class="fa-regular fa-image"></i></button>
        <input type="file" id="mobChatFile" accept="image/*" multiple hidden>
        <textarea id="mobChatInput" placeholder="发消息…" rows="1"></textarea>
        <button type="button" class="voice-btn" id="mobBtnVoice" title="语音"><i class="fa-solid fa-microphone"></i></button>
        <button type="button" class="send-btn" id="mobChatSend">发送</button>
    </div>
</div>

<div class="im-more-ovl" id="mobChatMoreOvl" aria-hidden="true">
    <div class="im-more-sheet" role="menu" aria-label="聊天更多操作">
        <div class="grab"></div>
        <div class="sheet-title" id="mobChatMoreTitle">聊天操作</div>
        <button type="button" data-im-more="profile"><i class="fa-regular fa-user"></i> 查看资料</button>
        <button type="button" data-im-more="media"><i class="fa-regular fa-folder-open"></i> 聊天文件</button>
        <button type="button" data-im-more="search"><i class="fa-solid fa-magnifying-glass"></i> 搜索聊天记录</button>
        <button type="button" data-im-more="mute" id="mobBtnMuteToggle"><i class="fa-regular fa-bell-slash"></i> 消息免打扰</button>
        <button type="button" data-im-more="remark"><i class="fa-solid fa-pen"></i> 设置备注</button>
        <div class="sep"></div>
        <button type="button" data-im-more="clear"><i class="fa-solid fa-eraser"></i> 清空聊天记录</button>
        <button type="button" data-im-more="delete"><i class="fa-solid fa-trash"></i> 删除会话</button>
        <button type="button" class="danger" data-im-more="report"><i class="fa-solid fa-flag"></i> 举报</button>
        <button type="button" class="im-more-cancel" id="mobChatMoreClose">取消</button>
    </div>
</div>

<div class="im-media-ovl" id="mobChatMediaOvl" aria-hidden="true">
    <div class="im-media-panel" role="dialog" aria-label="聊天文件" aria-modal="true">
        <div class="hd">
            <button type="button" id="mobChatMediaClose" aria-label="关闭"><i class="fa-solid fa-xmark"></i></button>
            <div class="im-media-hd-t">
                <span class="t"><i class="fa-regular fa-folder-open"></i> 聊天文件</span>
                <span class="sub" id="mobChatMediaCount">—</span>
            </div>
        </div>
        <div class="im-media-tabs" role="tablist" aria-label="文件分类">
            <button type="button" class="active" data-media-tab="all" role="tab" aria-selected="true">全部</button>
            <button type="button" data-media-tab="image" role="tab" aria-selected="false">图片</button>
            <button type="button" data-media-tab="link" role="tab" aria-selected="false">链接</button>
            <button type="button" data-media-tab="file" role="tab" aria-selected="false">文件</button>
        </div>
        <div class="bd" id="mobChatMediaBody">
            <div class="im-media-grid" id="mobChatMediaGrid" hidden></div>
            <div class="im-media-links" id="mobChatMediaLinks" hidden></div>
            <div class="im-media-files" id="mobChatMediaFiles" hidden></div>
            <div class="im-media-empty" id="mobChatMediaEmpty" hidden>
                <i class="fa-regular fa-folder-open"></i>
                <p>本会话暂无该类型内容</p>
            </div>
        </div>
    </div>
</div>

<div class="im-remark-ovl" id="mobImRemarkOvl" aria-hidden="true">
    <div class="im-remark-backdrop" id="mobImRemarkBackdrop" aria-hidden="true"></div>
    <div class="im-remark-card" role="dialog" aria-labelledby="mobImRemarkTitle" aria-modal="true">
        <h3 id="mobImRemarkTitle"><i class="fa-solid fa-pen"></i> 设置备注</h3>
        <p class="im-remark-hint" id="mobImRemarkHint">备注名将优先显示在会话列表与顶栏</p>
        <p class="im-remark-origin" id="mobImRemarkOrigin"></p>
        <input type="text" id="mobImRemarkInput" maxlength="32" autocomplete="off" placeholder="输入备注名，留空则恢复原名" />
        <div class="im-remark-actions">
            <button type="button" class="btn-cancel" id="mobImRemarkCancel">取消</button>
            <button type="button" class="btn-save" id="mobImRemarkSave">保存</button>
        </div>
    </div>
</div>

<div class="im-media-preview" id="mobChatMediaPreview" aria-hidden="true">
    <button type="button" class="im-media-preview-close" id="mobChatMediaPreviewClose" aria-label="关闭预览"><i class="fa-solid fa-xmark"></i></button>
    <img id="mobChatMediaPreviewImg" alt="" />
</div>

<div class="mob-call-ovl" id="mobCallOvl" aria-hidden="true" data-mode="outgoing" data-kind="voice">
    <div class="mob-call-bg" aria-hidden="true"></div>
    <div class="mob-call-video-layer" id="mobCallVideoPreview" hidden>
        <span class="mob-call-local-tag" id="mobCallLocalTag" hidden>本地预览</span>
    </div>
    <div class="mob-call-pip" id="mobCallRemotePip" hidden aria-hidden="true"></div>
    <div class="mob-call-stage">
        <div class="mob-call-hero" id="mobCallHero">
            <div class="mob-call-av-wrap pulse" id="mobCallAvWrap">
                <img class="mob-call-av" id="mobCallAv" src="" alt="">
            </div>
            <div class="mob-call-name" id="mobCallName">—</div>
            <div class="mob-call-status" id="mobCallStatus">正在呼叫…</div>
            <div class="mob-call-timer" id="mobCallTimer" hidden>00:00</div>
        </div>
        <div class="mob-call-dock" id="mobCallDock">
            <div class="mob-call-panel mob-call-panel--ring" data-call-panel="outgoing" id="mobCallOutgoing">
                <button type="button" class="mob-call-btn secondary mob-call-ring-ctrl" id="mobCallRingMute" hidden title="麦克风"><span class="round sm"><i class="fa-solid fa-microphone"></i></span><span class="lbl">麦克风</span></button>
                <button type="button" class="mob-call-btn hangup" id="mobCallCancel"><span class="round"><i class="fa-solid fa-phone-slash"></i></span><span>取消</span></button>
                <button type="button" class="mob-call-btn secondary mob-call-ring-ctrl" id="mobCallRingCam" hidden title="摄像头"><span class="round sm"><i class="fa-solid fa-video"></i></span><span class="lbl">摄像头</span></button>
            </div>
            <div class="mob-call-panel mob-call-panel--ring" data-call-panel="incoming" id="mobCallIncoming" hidden>
                <button type="button" class="mob-call-btn secondary mob-call-ring-ctrl" id="mobCallInMute" hidden title="麦克风"><span class="round sm"><i class="fa-solid fa-microphone"></i></span><span class="lbl">麦克风</span></button>
                <button type="button" class="mob-call-btn reject" id="mobCallReject"><span class="round"><i class="fa-solid fa-phone-slash"></i></span><span>拒绝</span></button>
                <button type="button" class="mob-call-btn accept" id="mobCallAccept"><span class="round"><i class="fa-solid fa-phone"></i></span><span>接听</span></button>
                <button type="button" class="mob-call-btn secondary mob-call-ring-ctrl" id="mobCallInCam" hidden title="摄像头"><span class="round sm"><i class="fa-solid fa-video"></i></span><span class="lbl">摄像头</span></button>
            </div>
            <div class="mob-call-panel is-active-bar" data-call-panel="active" id="mobCallActive" hidden>
                <button type="button" class="mob-call-btn secondary" id="mobCallMute" title="静音"><span class="round sm"><i class="fa-solid fa-microphone"></i></span><span class="lbl">静音</span></button>
                <button type="button" class="mob-call-btn secondary mob-call-video-only" id="mobCallCam" hidden title="摄像头"><span class="round sm"><i class="fa-solid fa-video"></i></span><span class="lbl">摄像头</span></button>
                <button type="button" class="mob-call-btn secondary mob-call-video-only" id="mobCallFlip" hidden title="翻转"><span class="round sm"><i class="fa-solid fa-camera-rotate"></i></span><span class="lbl">翻转</span></button>
                <button type="button" class="mob-call-btn hangup primary" id="mobCallEnd" title="挂断"><span class="round lg"><i class="fa-solid fa-phone-slash"></i></span><span>挂断</span></button>
                <button type="button" class="mob-call-btn secondary mob-call-voice-only" id="mobCallSpeaker" title="扬声器"><span class="round sm"><i class="fa-solid fa-volume-high"></i></span><span class="lbl">扬声器</span></button>
            </div>
        </div>
    </div>
</div>

<div class="home-indicator"></div>
<script src="../js/messages-mobile.js"></script>
<script src="../js/digital-h5-nav.js"></script>
</body>
</html>
