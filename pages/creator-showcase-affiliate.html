<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的橱窗 · 实体选品</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/digital-h5.css">
</head>
<body>
<div class="status-bar dark-mode">
    <span class="time">9:41</span>
    <span class="right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
</div>
<div class="nav-bar da-nav solid">
    <div class="nav-left"><div class="nav-btn" data-go="profile.html"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title">我的橱窗</div>
    <div class="nav-right"><div class="nav-btn" data-go="creator-showcase-preview.html"><i class="fa-solid fa-eye"></i></div></div>
</div>

<div class="app-content da-page">
    <div style="padding:12px 16px 0">
        <div style="display:flex;gap:8px;margin-bottom:12px">
            <button class="btn btn-secondary btn-sm" style="flex:1" data-go="create-digital.html"><i class="fa-solid fa-plus"></i> 创建数字商品</button>
            <button class="btn btn-primary btn-sm" style="flex:1" data-go="affiliate-catalog.html"><i class="fa-solid fa-bag-shopping"></i> 从商品中心选品</button>
        </div>
        <div class="da-chips" style="padding:0 0 12px">
            <div class="da-chip" data-go="creator-showcase-manage.html">数字商品</div>
            <div class="da-chip on">实体选品</div>
        </div>

        <div class="da-aff-row" id="aff1">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300&q=80" alt="">
            <div class="main">
                <div class="t">复古拍立得相纸套装</div>
                <div class="s">SKU · FILM-INST-20 · 供应商发货</div>
                <div class="c">佣金 12% · 售价 16.0 USDT</div>
                <div class="da-btns">
                    <button class="mini ghost js-pin">取消置顶</button>
                    <button class="mini js-rm">移除</button>
                </div>
            </div>
        </div>
        <div class="da-aff-row" id="aff2">
            <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=300&q=80" alt="">
            <div class="main">
                <div class="t">35mm 胶片相机肩带</div>
                <div class="s">SKU · CAM-STRAP-35</div>
                <div class="c">佣金 18% · 售价 29.9 USDT</div>
                <div class="da-btns">
                    <button class="mini ghost js-pin">置顶</button>
                    <button class="mini js-rm">移除</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="tab-bar">
    <div class="tab-item"><i class="fa-solid fa-house"></i><span>首页</span></div>
    <div class="tab-item"><i class="fa-regular fa-heart"></i><span>订阅</span></div>
    <div class="tab-create"><div class="create-btn"><i class="fa-solid fa-plus"></i></div></div>
    <div class="tab-item"><i class="fa-regular fa-message"></i><span>消息</span></div>
    <div class="tab-item active"><i class="fa-solid fa-user"></i><span>我的</span></div>
</div>
<div class="da-toast" id="daToast"></div>
<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
document.querySelectorAll('.js-pin').forEach(function (btn) {
    btn.addEventListener('click', function () {
        var on = btn.textContent.indexOf('取消') >= 0;
        btn.textContent = on ? '置顶' : '取消置顶';
        DigitalH5Nav.toast(on ? '已取消置顶' : '已置顶（实体选品仅可置顶 1 个）');
    });
});
document.querySelectorAll('.js-rm').forEach(function (btn) {
    btn.addEventListener('click', function () {
        if (!confirm('确认从橱窗移除该选品？')) return;
        btn.closest('.da-aff-row').remove();
        DigitalH5Nav.toast('已移除');
    });
});
</script>
</body>
</html>
