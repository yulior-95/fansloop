.hd {

.tl .dot {

        $('tdCpAvatar').style.backgroundImage = 'url("' + cfg.cp.avatar + '")';
        $('tdCpName').textContent = cfg.cp.name;
        $('tdCpMeta').textContent = cfg.cp.meta;
        $('tdCpActionBtn').textContent = cfg.cp.action || '查看';
        $('tdCpActionBtn').onclick = function () { location.href = cfg.cp.go || 'messages.html'; };
    } else {
        $('tdCounterpartyCard').style.display = 'none';
    }

    if (!cfg.chain || !cfg.chain.length) $('tdChainCard').style.display = 'none';

    var p = cfg.primary || ['返回记录', 'transactions.html', 'fa-list-ul'];
    var btn = $('tdPrimaryBtn');
    btn.innerHTML = '<i class="fa-solid ' + p[2] + '"></i> ' + p[0];
    btn.onclick = function () { location.href = p[1]; };
    $('tdAppealBtn').onclick = function () { location.href = 'transaction-appeal.html?order=' + encodeURIComponent(order); };
    $('tdSupportBtn').onclick = function () { location.href = 'transaction-contact.html'; };

    document.querySelectorAll('[data-copy]').forEach(function (el) {
        el.addEventListener('click', function () {
            var val = el.getAttribute('data-copy') || '';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(val).then(function () { toast('已复制'); }).catch(function () { toast('复制失败'); });
            } else toast('当前环境不支持复制');
        });
    });
})();
</script>
</body>
</html>
