.hero-amt.out { color: #FCA5A5; }
@keyframes tdAmtGlow {

.hero-sub { margin-top: 5px; font-size: 12px; color: var(--text-secondary); }
.hero-st {

.card {

.hd {

.gift-preview {

.gift-preview .em {

.kv + .kv { border-top: .5px solid rgba(255,255,255,.05); }

.calc .row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 12px; }

.tl .item { display: flex; gap: 10px; padding: 6px 0; position: relative; }
.tl .item:before {
