<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>账变搜索</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<style>
body {
    background:
        radial-gradient(ellipse at 50% 0%, rgba(168,85,247,0.12), transparent 55%),
        #0A0A12;
}
.status-bar { z-index: 1000; background: #0A0A12; }
.nav-bar {
    background: #0A0A12;
    border-bottom: 0.5px solid rgba(255,255,255,0.05);
    z-index: 110;
}
.app-content {
    padding-top: calc(var(--status-bar-height) + var(--nav-bar-height));
    padding-bottom: 40px;
}

/* ===== 搜索头 ===== */
.search-head {
    padding: 10px 16px 14px;
    display: flex; align-items: center; gap: 10px;
}
.search-head .sinp {
    flex: 1;
    position: relative;
    height: 40px;
}
.search-head .sinp i {
    position: absolute;
    left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-tertiary);
    font-size: 13px;
}
.search-head .sinp input {
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 12px;
    padding: 0 36px 0 38px;
    color: #fff;
    font-size: 14px;
    outline: none;
    box-shadow: 0 0 0 4px rgba(168,85,247,0.08);
}
.search-head .sinp .clear {
    position: absolute;
    right: 10px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    cursor: pointer;
}
.search-head .cancel {
    color: var(--brand-purple);
    font-size: 14px;
    font-weight: 600;
    padding: 4px 6px;
    cursor: pointer;
}
.search-head .search-btn {
    height: 40px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--brand-gradient);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

/* 当前输入 + 实时联想 */
.current-q {
    padding: 6px 20px 2px;
    font-size: 10px;
    color: var(--text-tertiary);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 5px;
}
.current-q i { color: var(--brand-purple); font-size: 8px; }

.sugg-list {
    margin: 0 16px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    overflow: hidden;
}
.sugg {
    padding: 11px 14px;
    display: flex; align-items: center; gap: 11px;
    border-top: 0.5px solid rgba(255,255,255,0.04);
}
.sugg:first-child { border: none; }
.sugg .ic {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 12px;
    flex-shrink: 0;
}
.sugg .ic.sub { background: linear-gradient(135deg, #A855F7, #7C3AED); }
.sugg .ic.tip { background: linear-gradient(135deg, #EC4899, #BE185D); }
.sugg .ic.recharge { background: linear-gradient(135deg, #10B981, #059669); }
.sugg .ic.withdraw { background: linear-gradient(135deg, #EF4444, #DC2626); }
.sugg .ic.live { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }

.sugg .m { flex: 1; min-width: 0; }
.sugg .m .n { font-size: 13px; font-weight: 600; color: #fff; }
.sugg .m .n em {
    color: var(--brand-purple);
    font-style: normal;
    font-weight: 700;
    background: rgba(168,85,247,0.12);
    padding: 0 3px;
    border-radius: 3px;
}
.sugg .m .s { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
.sugg .r { text-align: right; flex-shrink: 0; }
.sugg .r .v {
    font-size: 13px; font-weight: 700;
    font-variant-numeric: tabular-nums;
}
.sugg .r .v.inc { color: #6EE7B7; }
.sugg .r .v.out { color: #FCA5A5; }
.sugg .r .t { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }

/* 无结果（备用，可由 JS 切换） */
.empty-hint {
    display: none;
    text-align: center;
    padding: 40px 20px;
    color: var(--text-tertiary);
}
.empty-hint .emp-ic {
    width: 68px; height: 68px; border-radius: 50%;
    margin: 0 auto 14px;
    background: rgba(168,85,247,0.08);
    display: flex; align-items: center; justify-content: center;
    color: var(--brand-purple);
    font-size: 24px;
}
.empty-hint .et { font-size: 14px; color: #fff; font-weight: 600; margin-bottom: 4px; }
.empty-hint .ed { font-size: 11px; }
</style>
</head>
<body>

<div class="status-bar">
    <span class="time">9:41</span>
    <span class="right">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
    </span>
</div>

<div class="nav-bar">
    <div class="nav-left"><div class="nav-btn" onclick="location.href='transactions.html'"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title">搜索账变</div>
    <div class="nav-right"></div>
</div>

<div class="app-content">

    <!-- 搜索框 -->
    <div class="search-head">
        <div class="sinp">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="txSearchInput" value="" placeholder="搜索订单号 / 交易金额 / 交易人名字" />
            <span class="clear" id="txSearchClear"><i class="fa-solid fa-xmark"></i></span>
        </div>
        <button class="search-btn" id="txSearchBtn">搜索</button>
        <span class="cancel" onclick="location.href='transactions.html'">取消</span>
    </div>

    <!-- 当前查询结果 -->
    <div class="current-q" id="txSearchMeta"><i class="fa-solid fa-circle"></i>请输入关键词后搜索</div>

    <div class="sugg-list" id="txSearchResults"></div>

    <!-- 无结果 hint（默认隐藏） -->
    <div class="empty-hint">
        <div class="emp-ic"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="et">未找到相关账变</div>
        <div class="ed">换个关键词试试，或调整筛选条件</div>
    </div>

</div>

<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
(function () {
    var input = document.getElementById('txSearchInput');
    var clearBtn = document.getElementById('txSearchClear');
    var searchBtn = document.getElementById('txSearchBtn');
    var meta = document.getElementById('txSearchMeta');
    var list = document.getElementById('txSearchResults');
    var empty = document.querySelector('.empty-hint');
    if (!input || !list || !meta || !empty) return;
    var SOURCE_ROWS = [
        { order: 'T20260423092801', person: 'Emma_Jade', amount: '15.00', type: 'tip', icon: 'fa-gift', title: 'Emma_Jade · 打赏 · 超级火箭', status: '已到账', sign: '+', unit: '15 USDT' },
        { order: 'S202604220241', person: 'MarcusBlack', amount: '10.00', type: 'sub', icon: 'fa-heart', title: 'MarcusBlack · 月度订阅续费', status: '已到账', sign: '+', unit: '10 USDT' },
        { order: 'W20260422142218', person: 'Alex_K', amount: '50.00', type: 'withdraw', icon: 'fa-arrow-up-right-from-square', title: 'Alex_K · 提现到钱包', status: '已到账', sign: '-', unit: '50 USDT' },
        { order: 'R20260421184200', person: 'NoahKlein', amount: '100.00', type: 'recharge', icon: 'fa-wallet', title: 'NoahKlein · USDT 充值', status: '已到账', sign: '+', unit: '100 USDT' }
    ];
    function moneyText(v) {
        var n = Number(v || 0);
        if (!isFinite(n)) return '';
        return n.toFixed(2);
    }
    function renderRows(rows) {
        if (!rows.length) {
            list.innerHTML = '';
            return;
        }
        list.innerHTML = rows.map(function (item) {
            var cls = item.sign === '-' ? 'out' : 'inc';
            var heart = item.icon === 'fa-heart' ? 'fa-regular' : 'fa-solid';
            return '<div class="sugg" onclick="location.href=\'transaction-detail.html?type=' + encodeURIComponent(item.type) + '&order=' + encodeURIComponent(item.order) + '&from=search\'">' +
                '<div class="ic ' + item.type + '"><i class="' + heart + ' ' + item.icon + '"></i></div>' +
                '<div class="m"><div class="n">' + item.title + '</div><div class="s">订单号 ' + item.order + ' · ' + item.status + '</div></div>' +
                '<div class="r"><div class="v ' + cls + '">' + item.sign + '$' + moneyText(item.amount) + '</div><div class="t">' + item.unit + '</div></div>' +
                '</div>';
        }).join('');
    }
    function applySearch() {
        var q = (input.value || '').trim().toLowerCase();
        if (!q) {
            renderRows([]);
            meta.innerHTML = '<i class="fa-solid fa-circle"></i>请输入关键词后搜索';
            empty.style.display = 'none';
            return;
        }
        var rows = SOURCE_ROWS.filter(function (item) {
            var order = String(item.order || '').toLowerCase();
            var person = String(item.person || '').toLowerCase();
            var amount = moneyText(item.amount || '').toLowerCase();
            return order.indexOf(q) >= 0 || person.indexOf(q) >= 0 || amount.indexOf(q) >= 0;
        });
        renderRows(rows);
        meta.innerHTML = '<i class="fa-solid fa-circle"></i>搜索 "' + q + '" · 共 ' + rows.length + ' 条结果';
        empty.style.display = rows.length ? 'none' : 'block';
    }
    input.addEventListener('input', applySearch);
    input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            applySearch();
        }
    });
    if (searchBtn) searchBtn.addEventListener('click', applySearch);
    if (clearBtn) clearBtn.addEventListener('click', function () {
        input.value = '';
        applySearch();
        input.focus();
    });
    applySearch();
})();
</script>
</body>
</html>
