<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消息</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<script src="../js/h5-theme-boot.js"></script>
<style>
.nav-bar { background: var(--bg-primary); }
.app-content {
    padding-top: calc(var(--status-bar-height) + var(--nav-bar-height));
    padding-bottom: calc(var(--tab-bar-height) + 10px);
}

.iml-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px 12px;
    overflow-x: auto;
    scrollbar-width: none;
}
.iml-tabs::-webkit-scrollbar { display: none; }
.iml-tabs .t {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 7px;
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 12px;
    border: 1px solid var(--border-color);
    cursor: pointer;
}
.iml-tabs .t.active {
    background: var(--bg-input);
    color: var(--text-primary);
    font-weight: 700;
}
.iml-tabs .t .cnt {
    font-size: 9px;
    margin-left: 4px;
    padding: 1px 5px;
    background: #ef4444;
    color: #fff;
    border-radius: 999px;
}
.msg-search {
    margin: 0 16px 12px;
    height: 36px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
}
.msg-search > i {
    flex-shrink: 0;
    width: 18px;
    text-align: center;
    font-size: 15px;
    line-height: 1;
    color: var(--text-tertiary);
}
.nav-bar .nav-btn > i {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    pointer-events: none;
}
.msg-search input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text-primary);
    font-size: 12px;
}
.msg-summary {
    margin: 0 16px 10px;
    padding: 9px 12px;
    border-radius: 10px;
    background: var(--bg-card);
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}
.msg-summary b { color: var(--text-primary); }
.msg-compose-row {
    margin: 0 16px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.msg-compose-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 11px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-align: left;
}
.msg-compose-card:active { transform: scale(0.98); }
.msg-compose-card .ic {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
}
.msg-compose-card .ic.dm {
    background: rgba(59, 130, 246, 0.14);
    color: #60a5fa;
}
.msg-compose-card .ic.grp {
    background: rgba(168, 85, 247, 0.16);
    color: #c084fc;
}
.msg-compose-card .tx {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
}
.msg-compose-card .tx b {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
}
.msg-compose-card .tx small {
    font-size: 10px;
    color: var(--text-tertiary);
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* 快捷入口 */
.quick-grid {
    margin: 0 16px 12px;
    padding: 16px 0;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
}
.quick-grid .q {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    position: relative;
}
.quick-grid .q .ic {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
}
.quick-grid .q .label { font-size: 11px; color: var(--text-secondary); }
.quick-grid .q .badge-num {
    position: absolute;
    top: -4px; right: 18%;
    min-width: 16px; height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: #EF4444;
    color: #fff;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
}

.c-1 { background: rgba(239,68,68,0.15); color: var(--danger); }
.c-2 { background: rgba(245,158,11,0.15); color: var(--crypto-gold); }
.c-3 { background: rgba(168,85,247,0.15); color: var(--brand-purple); }
.c-4 { background: rgba(16,185,129,0.15); color: var(--crypto-green); }

/* 消息列表 */
.section-title {
    padding: 6px 16px 10px;
    font-size: 13px;
    color: var(--text-secondary);
}

.chat-list {
    margin: 0 16px;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    overflow: hidden;
}
.chat-item {
    display: flex; align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 0.5px solid var(--border-color);
}
.chat-item:last-child { border-bottom: none; }
.chat-item .avatar-box {
    position: relative;
    flex-shrink: 0;
}
.chat-item .unread {
    position: absolute;
    top: -3px; right: -3px;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: #EF4444;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg-card);
}
.chat-item .info { flex: 1; min-width: 0; }
.chat-item .row1 {
    display: flex; align-items: center;
    gap: 6px;
}
.chat-hub-av {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    border: none;
}
.chat-hub-av--group {
    background: linear-gradient(135deg, #10B981, #3B82F6);
    color: #fff;
}
.chat-notif-hub { cursor: pointer; }
.chat-notif-hub:active { background: var(--bg-elevated); }
.chat-item .name {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.chat-item .time {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-tertiary);
    flex-shrink: 0;
}
.chat-item .msg {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.chat-item .tag-pre {
    color: var(--brand-purple);
    font-weight: 500;
}
.msg-ovl {
    position: absolute;
    inset: 0;
    z-index: 120;
    background: var(--bg-overlay);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
}
.msg-ovl.show { display: flex; }
.msg-panel {
    width: 100%;
    max-width: 100%;
    max-height: 78%;
    background: var(--bg-sheet);
    border: 1px solid var(--border-color);
    border-radius: 18px 18px 0 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.msg-panel .hd {
    padding: 12px;
    border-bottom: 0.5px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.msg-panel .hd .t { font-size: 14px; font-weight: 700; }
.msg-panel .hd button {
    width: 28px; height: 28px; border: 0; border-radius: 50%;
    background: var(--bg-card); color: var(--text-secondary);
}
.msg-panel .bd { padding: 12px; overflow-y: auto; }
.compose-hint {
    margin: 0 0 10px;
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.45;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: rgba(168,85,247,0.08);
}
.compose-hint i { color: var(--brand-primary); margin-right: 4px; }
.compose-section {
    margin: 0 0 8px;
    font-size: 11px;
    color: var(--text-tertiary);
}
.msg-p-search {
    width: 100%; height: 34px; border-radius: 10px; border: 1px solid var(--border-color);
    background: var(--bg-card); color: var(--text-primary); padding: 0 10px; font-size: 12px; margin-bottom: 10px;
}
.msg-c-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 0.5px solid var(--border-color);
}
.msg-c-row:last-child { border-bottom: none; }
.msg-c-row .name { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-c-row .name-wrap {
    flex: 1;
    min-width: 0;
}
.msg-c-row .name-wrap .name {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
}
.msg-c-row .name-wrap .nick {
    margin-top: 2px;
    font-size: 10px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.msg-c-row input[type="checkbox"] { width: 16px; height: 16px; }
.msg-c-row .subtag {
    font-size: 10px;
    color: var(--text-tertiary);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 1px 7px;
}
.msg-panel .ft {
    padding: 10px 12px;
    border-top: 0.5px solid var(--border-color);
    display: flex; gap: 8px;
}
.msg-panel .ft button {
    flex: 1; height: 32px; border-radius: 16px; border: 1px solid var(--border-color);
    background: var(--bg-card); color: var(--text-secondary); font-size: 12px;
}
.msg-panel .ft button.primary {
    background: var(--brand-gradient);
    color: #fff;
    border-color: transparent;
}
.msg-group-name {
    width: 100%; height: 34px; border-radius: 10px; border: 1px solid var(--border-color);
    background: var(--bg-card); color: var(--text-primary); padding: 0 10px; font-size: 12px; margin-bottom: 10px;
}
</style>
<link rel="stylesheet" href="../css/h5-light-theme.css">
</head>
<body data-page="messages-inbox">

<div class="status-bar">
    <span class="time">9:41</span>
    <span class="right">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
    </span>
</div>

<div class="nav-bar solid">
    <div class="nav-left">
        <div class="nav-btn" id="btnMsgNavSearch" data-nav-search="1" aria-label="聚焦搜索">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </div>
    </div>
    <div class="nav-title">消息</div>
    <div class="nav-right" aria-hidden="true"></div>
</div>

<div class="app-content">

    <div class="iml-tabs" id="imlTabs">
        <span class="t active" data-filter="all">全部<span class="cnt" id="imlCntAll">8</span></span>
        <span class="t" data-filter="dm">私聊<span class="cnt" id="imlCntDm">7</span></span>
        <span class="t" data-filter="group">群聊<span class="cnt" id="imlCntGroup">1</span></span>
    </div>
    <div class="msg-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="msgSearchInput" placeholder="搜索会话 / 文案关键词" />
    </div>
    <div class="msg-compose-row">
        <button type="button" class="msg-compose-card" id="btnAddContact">
            <span class="ic dm"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i></span>
            <span class="tx"><b>发起私聊</b><small>从互关好友开聊</small></span>
        </button>
        <button type="button" class="msg-compose-card" id="btnCreateGroup">
            <span class="ic grp"><i class="fa-solid fa-users" aria-hidden="true"></i></span>
            <span class="tx"><b>创建群聊</b><small>邀请多人会话</small></span>
        </button>
    </div>

    <div class="section-title">最近会话</div>
    <div class="chat-list">
        <div class="chat-item chat-notif-hub" id="chatHubGroup" data-go="messages-group-inbox.html" role="button" tabindex="0" data-chat-type="hub">
            <div class="avatar-box">
                <div class="avatar avatar-md chat-hub-av chat-hub-av--group"><i class="fa-solid fa-users"></i></div>
                <div class="unread" id="chatHubGroupBadge">12</div>
            </div>
            <div class="info">
                <div class="row1">
                    <span class="name">群聊通知</span>
                    <i class="fa-solid fa-chevron-right" style="margin-left:auto;font-size:11px;color:var(--text-tertiary)"></i>
                </div>
                <div class="msg" id="chatHubGroupPreview">Luna VIP 摄影群 等 12 条进群邀请</div>
            </div>
        </div>
        <div class="chat-item" data-peer="Luna" data-chat-type="dm" data-text="已向你发送新的订阅专属视频">
            <div class="avatar-box">
                <img class="avatar avatar-md" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=120&q=80">
                <div class="unread">5</div>
            </div>
            <div class="info">
                <div class="row1">
                    <span class="name">Luna</span>
                    <i class="fa-solid fa-circle-check" style="color:var(--info); font-size:11px"></i>
                    <span class="time">刚刚</span>
                </div>
                <div class="msg">已向你发送新的订阅专属视频 🎬</div>
            </div>
        </div>
        <div class="chat-item" data-peer="Mila" data-chat-type="dm" data-text="谢谢你的打赏 已收到10USDT">
            <div class="avatar-box">
                <img class="avatar avatar-md" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&q=80">
                <div class="unread">2</div>
            </div>
            <div class="info">
                <div class="row1">
                    <span class="name">Mila</span>
                    <span class="time">14:32</span>
                </div>
                <div class="msg">谢谢你的打赏！已收到 10 USDT 💜</div>
            </div>
        </div>
        <div class="chat-item" data-peer="Ryo" data-chat-type="dm" data-text="下周会去京都拍新的vlog 敬请期待">
            <div class="avatar-box">
                <img class="avatar avatar-md" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&q=80">
            </div>
            <div class="info">
                <div class="row1">
                    <span class="name">Ryo</span>
                    <span class="time">昨天</span>
                </div>
                <div class="msg">下周会去京都拍新的 vlog，敬请期待～</div>
            </div>
        </div>
        <div class="chat-item" data-peer="Nova" data-chat-type="group" data-text="图片 新作品">
            <div class="avatar-box">
                <img class="avatar avatar-md" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=120&q=80">
            </div>
            <div class="info">
                <div class="row1">
                    <span class="name">Nova</span>
                    <span class="time">昨天</span>
                </div>
                <div class="msg"><span class="tag-pre">[图片]</span> 新作品～</div>
            </div>
        </div>
        <div class="chat-item" data-chat-type="system" data-go="notifications.html?tab=subscription" data-text="你的订阅将在3天后续费79.9USDT">
            <div class="avatar-box">
                <div class="avatar avatar-md" style="background: var(--brand-gradient); display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div class="unread">1</div>
            </div>
            <div class="info">
                <div class="row1">
                    <span class="name">系统通知</span>
                    <span class="time">09:12</span>
                </div>
                <div class="msg">你的订阅【Luna】将在 3 天后续费 79.9 USDT</div>
            </div>
        </div>
    </div>

</div>
<div class="msg-ovl" id="ovlAddContact">
    <div class="msg-panel">
        <div class="hd"><div class="t">新建私聊</div><button type="button" id="btnCloseAddContact"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="bd">
            <div class="compose-hint"><i class="fa-solid fa-user-check"></i>仅显示互相关注好友，选择后在当前页打开会话</div>
            <input class="msg-p-search" id="addContactSearch" placeholder="搜索互关好友..." />
            <div class="compose-section">互关好友</div>
            <div id="addContactList"></div>
        </div>
    </div>
</div>
<div class="msg-ovl" id="ovlCreateGroup">
    <div class="msg-panel">
        <div class="hd"><div class="t">创建群聊</div><button type="button" id="btnCloseCreateGroup"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="bd">
            <input class="msg-group-name" id="groupNameInput" value="VIP 订阅者交流群" />
            <input class="msg-p-search" id="groupMemberSearch" placeholder="搜索互关好友..." />
            <div id="groupMemberList"></div>
        </div>
        <div class="ft">
            <button type="button" id="btnCancelCreateGroup">取消</button>
            <button type="button" class="primary" id="btnConfirmCreateGroup">创建并邀请</button>
        </div>
    </div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
    <div class="tab-item">
        <i class="fa-solid fa-house"></i>
        <span>首页</span>
    </div>
    <div class="tab-item">
        <i class="fa-regular fa-heart"></i>
        <span>订阅</span>
    </div>
    <div class="tab-create">
        <div class="create-btn"><i class="fa-solid fa-plus"></i></div>
    </div>
    <div class="tab-item active">
        <i class="fa-solid fa-message"></i>
        <span>消息</span>
    </div>
    <div class="tab-item">
        <i class="fa-regular fa-user"></i>
        <span>我的</span>
    </div>
</div>

<div class="home-indicator"></div>
<script src="../js/messages-mobile.js"></script>
<script src="../js/digital-h5-nav.js"></script>
</body>
</html>
