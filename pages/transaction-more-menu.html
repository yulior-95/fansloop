<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>更多操作</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/common.css">
<script src="../js/h5-theme-boot.js"></script>
<link rel="stylesheet" href="../css/h5-light-theme.css">
<style>
body { background: var(--bg-primary); }
.nav-bar { background: var(--bg-primary); z-index: 110; }
.app-content {
    padding-top: calc(var(--status-bar-height) + var(--nav-bar-height));
    padding-bottom: 20px;
    opacity: 0.4;
    filter: blur(1.5px);
}
.bg-hero { text-align: center; padding: 26px 20px 16px; }
.bg-hero .ic-big {
    width: 64px; height: 64px; border-radius: 18px;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, #EC4899, #BE185D);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px;
}
.bg-hero .lbl { font-size: 10px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.bg-hero .amt { font-size: 32px; font-weight: 800; color: var(--success-light, #6EE7B7); letter-spacing: -1px; }

.sheet-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    display: flex; align-items: flex-end;
    animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

.action-sheet {
    width: 100%;
    padding: 0 10px 10px;
    animation: sheetUp 0.26s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.as-group {
    background: rgba(36,36,48,0.95);
    backdrop-filter: blur(30px);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 8px;
}
.as-header {
    padding: 12px 16px;
    text-align: center;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
}
.as-header .t {
    font-size: 15px;
    color: #fff;
    font-weight: 700;
    margin-bottom: 2px;
}
.as-header .s {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    font-family: ui-monospace, monospace;
}

.as-row {
    padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    border-top: 0.5px solid rgba(255,255,255,0.06);
    cursor: pointer;
    transition: background 0.15s;
}
.as-row:first-of-type { border: none; }
.as-row:active { background: rgba(255,255,255,0.08); }

.as-row .ic-box {
    width: 32px; height: 32px; border-radius: 9px;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: var(--brand-purple);
    flex-shrink: 0;
}
.as-row.copy .ic-box { background: rgba(59,130,246,0.18); color: #60A5FA; }
.as-row.share .ic-box { background: rgba(168,85,247,0.18); color: #C084FC; }
.as-row.appeal .ic-box { background: rgba(245,158,11,0.18); color: #FBBF24; }
.as-row.contact .ic-box { background: rgba(16,185,129,0.18); color: #6EE7B7; }
.as-row.report .ic-box { background: rgba(239,68,68,0.18); color: #FCA5A5; }

.as-row .m { flex: 1; min-width: 0; }
.as-row .m .n {
    font-size: 15px;
    color: #fff;
    font-weight: 500;
    line-height: 1.3;
}
.as-row .m .s {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
    line-height: 1.3;
}
.as-row .arrow {
    color: rgba(255,255,255,0.3);
    font-size: 11px;
}

.as-cancel {
    background: rgba(36,36,48,0.95);
    backdrop-filter: blur(30px);
    padding: 16px;
    text-align: center;
    border-radius: 14px;
    color: #FF6060;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="status-bar">
    <span class="time">9:42</span>
    <span class="right">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
    </span>
</div>

<div class="nav-bar">
    <div class="nav-left"><div class="nav-btn" id="tdMoreMenuBack"><i class="fa-solid fa-chevron-left"></i></div></div>
    <div class="nav-title">账变详情</div>
    <div class="nav-right">
        <div class="nav-btn"><i class="fa-solid fa-share-nodes"></i></div>
        <div class="nav-btn"><i class="fa-solid fa-ellipsis"></i></div>
    </div>
</div>

<div class="app-content">
    <div class="bg-hero">
        <div class="ic-big"><i class="fa-solid fa-gift"></i></div>
        <div class="lbl">TIP RECEIVED · 打赏收入</div>
        <div class="amt">+$15.00</div>
    </div>
</div>

<div class="sheet-overlay" id="tdMoreMenuOverlay">
    <div class="action-sheet">

        <div class="as-group">
            <div class="as-header">
                <div class="t">更多操作</div>
                <div class="s" id="tdMoreMenuOrder">T20260423092801F7A9</div>
            </div>

            <div class="as-row copy" id="tdMoreMenuCopy" role="button" tabindex="0">
                <div class="ic-box"><i class="fa-regular fa-copy"></i></div>
                <div class="m">
                    <div class="n">复制订单号</div>
                    <div class="s">将订单号复制到剪贴板</div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>

            <div class="as-row share" id="tdMoreMenuShare" role="button" tabindex="0">
                <div class="ic-box"><i class="fa-solid fa-share-nodes"></i></div>
                <div class="m">
                    <div class="n">分享收益海报</div>
                    <div class="s">生成精美海报分享到社交平台</div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>

            <div class="as-row appeal" id="tdMoreMenuAppeal" role="button" tabindex="0">
                <div class="ic-box"><i class="fa-solid fa-gavel"></i></div>
                <div class="m">
                    <div class="n">申诉入口</div>
                    <div class="s">打开申诉表单，填写原因并上传证据</div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>

            <div class="as-row contact" id="tdMoreMenuContact" role="button" tabindex="0">
                <div class="ic-box"><i class="fa-solid fa-headset"></i></div>
                <div class="m">
                    <div class="n">联系客服</div>
                    <div class="s">智能客服 Eve · 7×24 在线 · 平均响应约 12 秒</div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>

            <div class="as-row report" id="tdMoreMenuReport" role="button" tabindex="0" data-td-more-stub="举报已记录（演示）">
                <div class="ic-box"><i class="fa-solid fa-flag"></i></div>
                <div class="m">
                    <div class="n">举报异常</div>
                    <div class="s">举报欺诈 / 异常交易</div>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>
        </div>

        <div class="as-cancel" id="tdMoreMenuCancel">取消</div>

    </div>
</div>

<div class="home-indicator"></div>
<script src="../js/digital-h5-nav.js"></script>
<script>
(function () {
    var params = new URLSearchParams(location.search);
    var type = params.get('type') || 'tip';
    var order = params.get('order') || 'T20260423092801F7A9';
    var from = params.get('from') || '';

    function toast(msg) {
        if (window.DigitalH5Nav && typeof window.DigitalH5Nav.toast === 'function') {
            window.DigitalH5Nav.toast(msg);
        }
    }

    function detailUrl(extra) {
        var u = 'transaction-detail.html?type=' + encodeURIComponent(type) + '&order=' + encodeURIComponent(order);
        if (from) u += '&from=' + encodeURIComponent(from);
        if (extra) u += extra;
        return u;
    }

    function detailQuery() {
        return 'type=' + encodeURIComponent(type) + '&order=' + encodeURIComponent(order) +
            (from ? '&from=' + encodeURIComponent(from) : '');
    }

    var orderEl = document.getElementById('tdMoreMenuOrder');
    if (orderEl) orderEl.textContent = order;

    function bindRow(row, fn) {
        if (!row) return;
        row.addEventListener('click', fn);
        row.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fn();
            }
        });
    }

    var back = document.getElementById('tdMoreMenuBack');
    var cancel = document.getElementById('tdMoreMenuCancel');
    var overlay = document.getElementById('tdMoreMenuOverlay');
    function goDetail() { location.href = detailUrl(); }
    if (back) back.addEventListener('click', goDetail);
    if (cancel) cancel.addEventListener('click', goDetail);
    if (overlay) {
        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) goDetail();
        });
    }

    bindRow(document.getElementById('tdMoreMenuCopy'), function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(order).then(function () { toast('订单号已复制'); }).catch(function () { toast('订单号已复制'); });
        } else {
            toast('订单号已复制');
        }
    });

    bindRow(document.getElementById('tdMoreMenuShare'), function () {
        location.href = 'transaction-share-poster.html?' + detailQuery();
    });

    bindRow(document.getElementById('tdMoreMenuAppeal'), function () {
        location.href = 'transaction-appeal.html?order=' + encodeURIComponent(order);
    });

    bindRow(document.getElementById('tdMoreMenuContact'), function () {
        var u = 'after-sales.html?support=1&type=' + encodeURIComponent(type) +
            '&order=' + encodeURIComponent(order);
        if (from) u += '&from=' + encodeURIComponent(from);
        location.href = u;
    });

    bindRow(document.getElementById('tdMoreMenuReport'), function () {
        var row = document.getElementById('tdMoreMenuReport');
        if (row) row.classList.add('is-busy');
        location.href = detailUrl('&tdMoreToast=report');
    });
})();
</script>
</body>
</html>
