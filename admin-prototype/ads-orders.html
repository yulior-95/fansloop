<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/force-http-preview.js"></script>

<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>广告订单 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/ads-admin.css">
  <link rel="stylesheet" href="css/ads-admin-hifi.css">
</head>
<body data-admin-page="ads-orders">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
<div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 广告管理 / 广告订单</span></div>
      <div class="admin-header-right">
        <select class="ant-input ant-input-sm ad-header-role" id="adAdminRole"><option value="finance">财务</option><option value="operator">运营</option><option value="super">超管</option></select>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=80&h=80&fit=crop&crop=face" alt=""><span>财务 · Wang</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">广告订单</h1>
      <p class="admin-page-desc">仅展示订单支付与退款结果（是否付款、是否退款），不含广告投放状态。</p>
      <div class="admin-toolbar">
        <div class="field field-grow"><label>订单 / 广告 / UID</label><input class="ant-input" id="ordFilterQ" style="width:100%"></div>
        <div class="field"><label>状态</label><select class="ant-input" id="ordFilterPay" style="width:160px"><option value="">全部</option><option value="unpaid">待支付</option><option value="paid">支付成功</option><option value="refunded">退款成功</option></select></div>
        <button type="button" class="ant-btn ant-btn-primary" id="ordBtnFilter">查询</button>
      </div>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-small ant-table-bordered">
            <table style="width:100%">
              <thead class="ant-table-thead"><tr><th>订单号</th><th>广告</th><th>UID</th><th>套餐</th><th>金额</th><th>支付</th><th>退款</th><th>操作</th></tr></thead>
              <tbody class="ant-table-tbody" id="adOrdBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="adOrdPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/ad-system-store.js?v=20261110ord"></script>
<script src="../js/ad-system-api.js?v=20261110ord"></script>
<script src="js/admin-nav.js?v=20261104c"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/ad-admin-layout.js"></script>
<script src="js/ad-admin-actions.js"></script>
<script src="js/ad-admin-pages.js?v=20261110ord"></script>
</body>
</html>
