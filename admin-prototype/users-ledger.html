<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账变记录 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/users-ledger.css">
</head>
<body data-admin-page="users-ledger">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 用户管理 / 账变记录</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-primary ant-btn-sm" id="ledExp"><i class="fa-solid fa-file-export"></i> 导出</button>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>财务对账</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">账变记录</h1>
      <div class="admin-toolbar">
        <select class="ant-input" id="ledgerFilterType" style="width:180px">
          <option value="">全部类型</option>
          <option>链上充值</option>
          <option>链上提现</option>
          <option>积分人工充值</option>
          <option>积分人工扣除</option>
          <option>积分消耗</option>
          <option>积分获取</option>
          <option>充值手续费</option>
          <option>提现手续费</option>
        </select>
        <span class="ant-input-affix-wrapper" style="width:160px"><input class="ant-input" id="ledgerFilterUid" placeholder="用户 UID"></span>
        <input type="date" class="ant-input" id="ledgerFilterDate" style="width:160px">
        <button type="button" class="ant-btn ant-btn-primary" id="ledgerQ">查询</button>
        <button type="button" class="ant-btn" id="ledgerReset">重置</button>
      </div>
      <div class="ant-card ant-card-bordered ledger-list-card">
        <div class="ant-card-body">
          <div class="ledger-table-scroll">
            <div class="ant-table ant-table-bordered ant-table-small ledger-audit-table">
              <table>
                <thead class="ant-table-thead">
                  <tr>
                    <th class="col-sticky-left">序号</th>
                    <th>账变类型</th>
                    <th>用户UID</th>
                    <th>订单号</th>
                    <th>币种</th>
                    <th>汇率</th>
                    <th>数量</th>
                    <th>收支类型</th>
                    <th>金额(CNY)</th>
                    <th>冻结手续费</th>
                    <th>手续费</th>
                    <th>账变时间</th>
                    <th>变动备注</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="ledgerTbody" data-pager="js"></tbody>
              </table>
            </div>
          </div>
          <div id="ledgerPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/users-ledger-page.js"></script>
</body>
</html>
