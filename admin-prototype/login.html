<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-login.css">
</head>
<body data-admin-page="login">
<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-brand">
      <img src="https://images.unsplash.com/photo-1557683316-973673baf926?w=96&h=96&fit=crop" alt="GOODFANS">
      <h1>GOODFANS 运营后台</h1>
      <p>使用成员账号、登录密码与谷歌验证器登录</p>
    </div>
    <form class="admin-login-form" id="adminLoginForm" autocomplete="on">
      <div id="adminLoginErr" class="admin-login-err" role="alert"></div>
      <div class="admin-login-field">
        <label for="loginAccount">账号</label>
        <input class="ant-input" id="loginAccount" name="account" type="text" autocomplete="username" placeholder="成员账号或邮箱，如 wangyi" required>
      </div>
      <div class="admin-login-field">
        <label for="loginPassword">密码</label>
        <input class="ant-input" id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="登录密码" required>
      </div>
      <div class="admin-login-field">
        <label for="loginTotp">谷歌验证码</label>
        <input class="ant-input" id="loginTotp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位数字，演示码 123456" required>
      </div>
      <button type="submit" class="ant-btn ant-btn-primary admin-login-submit" id="adminLoginSubmit">登录</button>
      <div class="admin-login-hint">
        <strong>原型演示账号</strong><br>
        账号：<code>wangyi</code> / <code>limin</code> / <code>chenchen</code><br>
        密码：<code>123456a</code> · 谷歌验证码：<code>123456</code>
      </div>
    </form>
  </div>
</div>
<script src="js/admin-modal.js"></script>
<script src="js/admin-session.js"></script>
<script src="js/admin-auth.js"></script>
<script>
(function () {
  var session = window.AdminAuth && AdminAuth.getSession();
  if (session) {
    var p = new URLSearchParams(location.search);
    location.href = p.get("redirect") || "dashboard.html";
  }
})();
</script>
</body>
</html>
