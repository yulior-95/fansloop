<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>广告位管理 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/ads-admin.css">
  <link rel="stylesheet" href="css/ads-admin-hifi.css">
</head>
<body data-admin-page="ads-slots">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 广告管理 / 广告位管理</span></div>
      <div class="admin-header-right">
        <a href="ads-packages.html" class="ant-btn ant-btn-sm"><i class="fa-solid fa-box-open"></i> 套餐配置</a>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop&crop=face" alt=""><span>广告运营 · Mia</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">广告位管理</h1>
      <p class="admin-page-desc">展示间隔、频次上限与无广告降级策略；停用后 C 端不再请求该 slot（原型数据见 FLAdStore.SLOTS）。</p>

      <div class="ant-row" style="margin:0 -8px 16px">
        <div class="ant-col ant-col-16" style="padding:8px">
          <div class="ant-card ant-card-bordered">
            <div class="ant-card-body" style="padding-top:0">
              <div class="ant-table ant-table-small ant-table-bordered">
                <table style="width:100%">
                  <thead class="ant-table-thead"><tr><th class="admin-col-index">#</th><th>名称</th><th>编码</th><th>页面</th><th>类型</th><th>规格</th><th>间隔 / 频次</th><th>状态</th><th>操作</th></tr></thead>
                  <tbody class="ant-table-tbody" id="adSlotsBody" data-pager="js"></tbody>
                </table>
              </div>
              <div id="adSlotsPager"></div>
            </div>
          </div>
        </div>
        <div class="ant-col ant-col-8" style="padding:8px">
          <div class="ant-card ant-card-bordered">
            <div class="ant-card-head"><div class="ant-card-head-title">降级策略说明</div></div>
            <div class="ant-card-body" style="font-size:13px;line-height:1.65;color:rgba(0,0,0,.65)">
              <p><span class="ant-tag ant-tag-blue">home_banner</span> 无可用广告时隐藏 Banner 区域，避免留白。</p>
              <p><span class="ant-tag ant-tag-blue">feed_video</span> 无广告时跳过插入，不影响 Feed 滚动。</p>
              <p><span class="ant-tag ant-tag-blue">live_room</span> 仅平台运营可投；无广告时不展示小卡。</p>
              <div class="ad-slot-preview" style="margin-top:12px"><img src="https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=640&h=360&fit=crop" alt="广告位示意"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/ad-system-store.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/ad-admin-layout.js"></script>
<script src="js/ad-admin-actions.js"></script>
<script src="js/ad-admin-pages.js"></script>
</body>
</html>
