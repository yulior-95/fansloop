<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全局参数 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/settings-global.css">
</head>
<body data-admin-page="settings-global">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 全局参数 / 参数总览</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>系统管理员</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">全局参数总览</h1>
      <p class="admin-page-desc">汇总全站级配置入口：资产限额、积分规则等。变更通常需二次确认，并写入 Mock Store / 映射管理端 API。</p>

      <div class="sg-tip">
        <i class="fa-solid fa-circle-info" style="color:#1677ff;margin-right:6px"></i>
        以下参数影响全站行为，与「积分活动」「订单流水」等运营数据页分离。单活动频控、奖励数值请在 <a href="activities-points-crud.html">积分活动</a> 中维护。
      </div>
      <div class="admin-alert-google" style="margin-bottom:20px"><i class="fa-brands fa-google" style="margin-top:2px"></i><div><strong>保存须谷歌验证</strong>：各子页「保存」「发布」前将弹出谷歌验证码输入框；密钥在「成员账号」创建时分配，用于登录与敏感操作二次确认。</div></div>

      <h2 class="sg-section-title"><i class="fa-solid fa-coins" style="margin-right:6px;color:#fa8c16"></i>资产与限额</h2>
      <div class="sg-grid" id="sgAssetMount"></div>

      <h2 class="sg-section-title"><i class="fa-solid fa-bolt" style="margin-right:6px;color:#722ed1"></i>积分规则</h2>
      <div class="sg-grid" id="sgPointsMount"></div>

      <h2 class="sg-section-title"><i class="fa-solid fa-id-card" style="margin-right:6px;color:#13c2c2"></i>KYC 审核</h2>
      <div class="sg-grid" id="sgKycMount"></div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/settings-global.js"></script>
</body>
</html>
