<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第三方商城管理 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/admin-pagination.css">
  <style>
    [data-admin-page="mall-affiliate-partners"] .admin-content { padding-left: 0; padding-right: 0; }
    [data-admin-page="mall-affiliate-partners"] .admin-page-title,
    [data-admin-page="mall-affiliate-partners"] .admin-toolbar { padding-left: 20px; padding-right: 20px; }
    [data-admin-page="mall-affiliate-partners"] .mall-partners-card { border-left: none; border-right: none; border-radius: 0; }
    [data-admin-page="mall-affiliate-partners"] .mall-partners-card > .ant-card-body { padding: 0; }
    .mall-partners-table { font-size: 13px; }
    .mall-partners-table table { width: 100%; border-collapse: separate; border-spacing: 0; }
    .mall-partners-table th,
    .mall-partners-table td { padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .mall-partners-table thead th { background: #fafafa; font-weight: 500; color: rgba(0,0,0,.85); }
    .mall-partners-table .col-endpoint { max-width: 360px; word-break: break-all; white-space: normal; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; color: rgba(0,0,0,.65); }
  </style>
</head>
<body data-admin-page="mall-affiliate-partners">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 双商城 / 第三方商城</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">第三方商城管理</h1>
      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:220px">
          <input class="ant-input" id="mallPartnerQ" placeholder="搜索名称 / Endpoint">
        </span>
        <select class="ant-input" id="mallPartnerStatus" style="width:140px">
          <option value="">全部状态</option>
          <option value="1">启用</option>
          <option value="0">停用</option>
        </select>
        <button type="button" class="ant-btn ant-btn-primary" id="btnMallPartnerQuery">查询</button>
        <button type="button" class="ant-btn" id="btnMallPartnerReset">重置</button>
      </div>
      <div class="ant-card ant-card-bordered mall-partners-card">
        <div class="ant-card-body">
          <div class="ant-table ant-table-middle mall-partners-table">
            <table>
              <thead class="ant-table-thead">
                <tr>
                  <th style="width:56px">#</th>
                  <th>名称</th>
                  <th>API Endpoint</th>
                  <th style="width:100px">状态</th>
                  <th style="width:160px">更新时间</th>
                  <th style="width:120px">操作</th>
                </tr>
              </thead>
              <tbody class="ant-table-tbody" id="mallPartnersBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="mallPartnersPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js-web/mall-commerce-config-store.js"></script>
<script src="../js-web/digital-assets-store.js"></script>
<script src="../js-web/digital-asset-orders-store.js"></script>
<script src="../js-web/affiliate-catalog-store.js"></script>
<script src="../js-web/affiliate-showcase-store.js"></script>
<script src="../js-web/creator-income-split-config.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/mall-admin-pages.js"></script>
</body>
</html>
