<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>邀请数据 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/admin-pagination.css">
  <style>
    .inv-stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }
    @media (max-width: 1100px) { .inv-stat-row { grid-template-columns: repeat(2, 1fr); } }
    .inv-stat-card {
      padding: 16px 18px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      background: #fff;
    }
    .inv-stat-card .k { font-size: 12px; color: rgba(0,0,0,.45); }
    .inv-stat-card .v { font-size: 24px; font-weight: 700; margin-top: 6px; }
    .inv-filter-banner {
      margin: 0 0 14px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #91caff;
      background: #e6f4ff;
      font-size: 13px;
      color: rgba(0,0,0,.75);
    }
  </style>
</head>
<body data-admin-page="invite-data">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 用户管理 / 邀请数据</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-primary ant-btn-sm" id="btnInvExport"><i class="fa-solid fa-file-export"></i> 导出</button>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">邀请数据</h1>
      <p class="admin-page-desc">全平台邀请注册与奖励发放记录；单用户维度见用户列表详情「邀请数据」Tab。奖励额度与冷静期见 <a href="risk-limits.html">积分风控</a>。</p>

      <div id="invFilterBanner" class="inv-filter-banner" style="display:none"></div>

      <div class="inv-stat-row" id="invStatRow"></div>

      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:160px"><input class="ant-input" id="invFilterInviter" placeholder="邀请人 UID"></span>
        <span class="ant-input-affix-wrapper" style="width:160px"><input class="ant-input" id="invFilterInvitee" placeholder="被邀请人 UID"></span>
        <span class="ant-input-affix-wrapper" style="width:200px"><input class="ant-input" id="invFilterKeyword" placeholder="昵称 / 邀请码"></span>
        <select class="ant-input" id="invFilterStatus" style="width:140px">
          <option value="">全部状态</option>
          <option value="ok">已发放</option>
          <option value="pending">待风控</option>
          <option value="rejected">风控未通过</option>
          <option value="capped">已达上限</option>
        </select>
        <button type="button" class="ant-btn ant-btn-primary" id="btnInvQuery">查询</button>
        <button type="button" class="ant-btn" id="btnInvReset">重置</button>
      </div>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-small">
            <table style="width:100%">
              <thead class="ant-table-thead">
                <tr>
                  <th>注册时间</th>
                  <th>邀请人</th>
                  <th>邀请码</th>
                  <th>被邀请人</th>
                  <th>奖励积分</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody class="ant-table-tbody" id="invTableBody"></tbody>
            </table>
          </div>
          <div id="invPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/invite-data-store.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pager.js"></script>
<script src="js/invite-data-page.js"></script>
</body>
</html>
