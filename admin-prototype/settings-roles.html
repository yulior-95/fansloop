<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色管理 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/settings-rbac.css">
</head>
<body data-admin-page="settings-roles">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 系统设置 / 角色管理</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-text ant-btn-sm" id="btnHelpRoles"><i class="fa-regular fa-circle-question"></i> 帮助</button>
        <div class="admin-header-user">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt="">
          <span>超级管理员</span>
        </div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">角色管理</h1>
      <div class="admin-alert-google"><i class="fa-brands fa-google" style="margin-top:2px"></i><div><strong>安全策略</strong>：编辑角色、删除角色、保存权限变更前，将弹出谷歌验证（TOTP）确认框。</div></div>
      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:240px"><span class="ant-input-prefix"><i class="fa-solid fa-magnifying-glass"></i></span><input class="ant-input" type="text" placeholder="角色名称"></span>
        <button type="button" class="ant-btn ant-btn-primary" id="btnNewRole"><i class="fa-solid fa-plus"></i> 新建角色</button>
        <div class="admin-toolbar-spacer"></div>
        <button type="button" class="ant-btn" id="btnRefreshRoles"><i class="fa-solid fa-rotate"></i></button>
      </div>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-middle">
            <table style="width:100%">
              <thead class="ant-table-thead">
                <tr><th>角色名称</th><th>创建时间</th><th>更新时间</th><th style="width:200px">操作</th></tr>
              </thead>
              <tbody class="ant-table-tbody" id="rolesTableBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="rolesPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/settings-rbac.js"></script>
<script src="js/settings-roles-page.js"></script>
</body>
</html>
