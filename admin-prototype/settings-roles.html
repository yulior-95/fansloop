<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色管理 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="settings-roles">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 系统设置 / 角色管理</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-text ant-btn-sm" id="btnHelpRoles"><i class="fa-regular fa-circle-question"></i> 帮助</button>
        <div class="admin-header-user">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt="">
          <span>超级管理员</span>
        </div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">角色管理</h1>
      <p class="admin-page-desc">列表仅展示角色维度；<strong>权限树、编辑、删除、新建</strong>均在当前页弹窗完成。删除与敏感编辑需谷歌验证。</p>
      <div class="admin-alert-google"><i class="fa-brands fa-google" style="margin-top:2px"></i><div><strong>安全策略</strong>：编辑角色、删除角色、保存权限变更前，将弹出谷歌验证（TOTP）确认框。</div></div>
      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:240px"><span class="ant-input-prefix"><i class="fa-solid fa-magnifying-glass"></i></span><input class="ant-input" type="text" placeholder="角色名称 / 编码"></span>
        <button type="button" class="ant-btn ant-btn-primary" id="btnNewRole"><i class="fa-solid fa-plus"></i> 新建角色</button>
        <div class="admin-toolbar-spacer"></div>
        <button type="button" class="ant-btn" id="btnRefreshRoles"><i class="fa-solid fa-rotate"></i></button>
      </div>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-middle">
            <table style="width:100%">
              <thead class="ant-table-thead">
                <tr><th>角色名称</th><th>角色编码</th><th>成员数</th><th>数据范围</th><th>更新时间</th><th>操作</th></tr>
              </thead>
              <tbody class="ant-table-tbody">
                <tr data-code="ROLE_ROOT" data-name="超级管理员">
                  <td>超级管理员</td><td><code>ROLE_ROOT</code></td><td>3</td><td><span class="ant-tag ant-tag-red">全平台</span></td><td>2026-05-10 18:02</td>
                  <td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-role-perm">权限</button><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-role-edit">编辑</button></td>
                </tr>
                <tr data-code="ROLE_OPS" data-name="运营">
                  <td>运营</td><td><code>ROLE_OPS</code></td><td>12</td><td><span class="ant-tag ant-tag-blue">业务数据</span></td><td>2026-05-09 11:20</td>
                  <td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-role-perm">权限</button><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-role-edit">编辑</button><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-role-del" style="color:#ff4d4f">删除</button></td>
                </tr>
                <tr data-code="ROLE_RISK" data-name="风控">
                  <td>风控</td><td><code>ROLE_RISK</code></td><td>4</td><td><span class="ant-tag ant-tag-orange">风控域</span></td><td>2026-05-08 09:41</td>
                  <td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-role-perm">权限</button><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-role-edit">编辑</button><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-role-del" style="color:#ff4d4f">删除</button></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div style="margin-top:16px;text-align:right">
            <ul class="ant-pagination ant-pagination-mini">
              <li class="ant-pagination-prev ant-pagination-disabled"><button class="ant-pagination-item-link" disabled><i class="fa-solid fa-angle-left"></i></button></li>
              <li class="ant-pagination-item ant-pagination-item-1 ant-pagination-item-active"><a>1</a></li>
              <li class="ant-pagination-next ant-pagination-disabled"><button class="ant-pagination-item-link" disabled><i class="fa-solid fa-angle-right"></i></button></li>
            </ul>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script>
(function () {
  var M = window.AdminModal;

  function permTreeBody(code, name) {
    return (
      "<p style='margin:0 0 12px'>角色：<strong>" +
      M.esc(name) +
      "</strong> <code>" +
      M.esc(code) +
      "</code></p>" +
      '<div class="admin-tree-mock" style="max-height:380px">' +
      '<div class="node"><label><input type="checkbox" checked> 用户管理</label></div>' +
      '<div class="node" style="padding-left:36px"><label><input type="checkbox" checked> 用户列表 · 查看</label></div>' +
      '<div class="node" style="padding-left:36px"><label><input type="checkbox" checked> 用户列表 · 编辑邮箱/重置密码</label></div>' +
      '<div class="node" style="padding-left:36px"><label><input type="checkbox"> 用户列表 · 禁用钱包</label></div>' +
      '<div class="node"><label><input type="checkbox" checked> 订单管理</label></div>' +
      '<div class="node" style="padding-left:36px"><label><input type="checkbox" checked> 充值订单 · 导出</label></div>' +
      '<div class="node" style="padding-left:36px"><label><input type="checkbox"> 提现订单 · 强制失败</label></div>' +
      '<div class="node"><label><input type="checkbox"> 系统设置 · 成员账号</label></div>' +
      "</div>"
    );
  }

  function openPermModal(tr) {
    var code = tr.getAttribute("data-code");
    var name = tr.getAttribute("data-name");
    M.open({
      title: "功能权限 · " + name,
      wide: true,
      body: permTreeBody(code, name),
      footer: [
        { text: "取消", onClick: M.close },
        {
          text: "保存权限",
          primary: true,
          onClick: function () {
            M.confirmGoogle({
              title: "确认保存权限",
              message: "保存后将影响所有拥有该角色的成员，需谷歌验证。",
              onVerified: function () {
                M.toast("权限已保存并写入操作日志（原型）");
              }
            });
          }
        }
      ]
    });
  }

  function openEditModal(tr) {
    var code = tr.getAttribute("data-code");
    var name = tr.getAttribute("data-name");
    var readonly = code === "ROLE_ROOT";
    M.open({
      title: "编辑角色",
      body:
        "<div style='max-width:420px'>" +
        "<label style='display:block;margin-bottom:6px'>角色名称</label>" +
        "<input class='ant-input' style='width:100%;margin-bottom:12px' value='" +
        M.esc(name) +
        "'" +
        (readonly ? " disabled" : "") +
        ">" +
        "<label style='display:block;margin-bottom:6px'>角色编码</label>" +
        "<input class='ant-input' style='width:100%' value='" +
        M.esc(code) +
        "' disabled>" +
        (readonly ? "<p style='margin:12px 0 0;font-size:12px;color:rgba(0,0,0,.45)'>系统内置角色不可改名。</p>" : "") +
        "</div>",
      footer: [
        { text: "取消", onClick: M.close },
        {
          text: "保存",
          primary: true,
          onClick: function () {
            if (readonly) {
              M.close();
              return;
            }
            M.confirmGoogle({
              message: "确认保存角色信息？",
              onVerified: function () {
                M.toast("角色已更新（原型）");
              }
            });
          }
        }
      ]
    });
  }

  document.getElementById("btnHelpRoles").addEventListener("click", function () {
    M.open({
      title: "角色管理帮助",
      body: "<ul style='margin:0;padding-left:18px;line-height:1.7'><li>权限按 <code>permission_code</code> 与菜单/接口对齐</li><li>删除与权限变更需二次验证</li><li>成员数仅统计启用账号</li></ul>",
      footer: [{ text: "知道了", primary: true, onClick: M.close }]
    });
  });

  document.getElementById("btnNewRole").addEventListener("click", function () {
    M.open({
      title: "新建角色",
      body:
        "<label style='display:block;margin-bottom:6px'>角色名称</label>" +
        "<input class='ant-input' style='width:100%;max-width:400px;margin-bottom:12px' placeholder='例如：客服'>" +
        "<label style='display:block;margin-bottom:6px'>角色编码</label>" +
        "<input class='ant-input' style='width:100%;max-width:400px' placeholder='例如：ROLE_CS'>",
      footer: [
        { text: "取消", onClick: M.close },
        {
          text: "创建并配置权限",
          primary: true,
          onClick: function () {
            M.close();
            M.toast("角色已创建，请在列表中点击「权限」继续配置（原型）");
          }
        }
      ]
    });
  });

  document.getElementById("btnRefreshRoles").addEventListener("click", function () {
    M.toast("列表已刷新（原型）");
  });

  document.querySelector("main.admin-content").addEventListener("click", function (e) {
    var t = e.target;
    var tr = t.closest("tr");
    if (!tr || !tr.getAttribute("data-code")) return;
    if (t.classList.contains("js-role-perm")) {
      openPermModal(tr);
    } else if (t.classList.contains("js-role-edit")) {
      openEditModal(tr);
    } else if (t.classList.contains("js-role-del")) {
      M.confirmGoogle({
        title: "删除角色",
        message: "删除后不可恢复，绑定成员需先迁移角色。角色：" + tr.getAttribute("data-name"),
        onVerified: function () {
          M.toast("角色已删除（原型）");
        }
      });
    }
  });
})();
</script>
</body>
</html>
