<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会员白名单 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/admin-pagination.css">
  <link rel="stylesheet" href="css/risk-whitelist.css">
</head>
<body data-admin-page="risk-whitelist">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 风控安全 / 会员白名单</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>风控</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">会员白名单</h1>

      <div class="admin-tabs-bar" id="wlTabs">
        <button type="button" class="active" data-tab="tEmail">邮箱白名单</button>
        <button type="button" data-tab="tFee">手续费白名单</button>
        <button type="button" data-tab="tLive">付费直播观看白名单</button>
        <button type="button" data-tab="tContent">付费内容观看白名单</button>
      </div>

      <!-- 邮箱白名单 -->
      <div id="tEmail" class="admin-tab-panel active">
        <div class="wl-dev-glass-bar" id="emailDevGlass" aria-label="研发批注"></div>
        <div class="admin-toolbar wl-filter-toolbar">
          <label class="wl-filter-item">
            <span class="wl-filter-label">邮箱后缀</span>
            <input class="ant-input" id="emailFilterSuffix" type="text" placeholder="如 @gmail.com" style="width:180px">
          </label>
          <button type="button" class="ant-btn ant-btn-primary" id="btnEmailSearch"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
          <button type="button" class="ant-btn" id="btnEmailReset"><i class="fa-solid fa-rotate-left"></i> 重置</button>
          <button type="button" class="ant-btn ant-btn-primary" id="btnEmailAdd" data-perm="risk-wl-email-add" style="margin-left:auto"><i class="fa-solid fa-plus"></i> 添加邮箱后缀</button>
        </div>
        <div class="ant-card ant-card-bordered wl-table-card">
          <div class="ant-card-body">
            <div class="ant-table ant-table-bordered ant-table-small">
              <table style="width:100%">
                <thead class="ant-table-thead">
                  <tr><th style="width:64px">序号</th><th>邮箱后缀</th><th>创建时间</th><th>备注</th><th style="width:140px">操作</th></tr>
                </thead>
                <tbody class="ant-table-tbody" id="emailTbody"></tbody>
              </table>
            </div>
            <div id="emailPager"></div>
          </div>
        </div>
      </div>

      <!-- 手续费白名单 -->
      <div id="tFee" class="admin-tab-panel">
        <div class="wl-dev-glass-bar" id="feeDevGlass" aria-label="研发批注"></div>
        <div class="admin-toolbar wl-filter-toolbar">
          <label class="wl-filter-item">
            <span class="wl-filter-label">用户 UID</span>
            <input class="ant-input" id="feeFilterUid" type="text" inputmode="numeric" placeholder="如 882910" style="width:120px">
          </label>
          <label class="wl-filter-item">
            <span class="wl-filter-label">适用范围</span>
            <select class="ant-input" id="feeFilterScope" style="width:120px;height:32px">
              <option value="">全部</option>
              <option value="recharge">充值</option>
              <option value="withdraw">提现</option>
            </select>
          </label>
          <button type="button" class="ant-btn ant-btn-primary" id="btnFeeSearch"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
          <button type="button" class="ant-btn" id="btnFeeReset"><i class="fa-solid fa-rotate-left"></i> 重置</button>
          <button type="button" class="ant-btn ant-btn-primary" id="btnFeeAdd" data-perm="risk-wl-fee-add" style="margin-left:auto"><i class="fa-solid fa-plus"></i> 添加 UID</button>
        </div>
        <div class="ant-card ant-card-bordered wl-table-card">
          <div class="ant-card-body">
            <div class="ant-table ant-table-bordered ant-table-small">
              <table style="width:100%">
                <thead class="ant-table-thead">
                  <tr>
                    <th style="width:64px">序号</th><th>用户 UID</th><th>用户昵称</th><th>适用范围</th>
                    <th>创建人</th><th>创建时间</th><th>备注</th><th style="width:140px">操作</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="feeTbody"></tbody>
              </table>
            </div>
            <div id="feePager"></div>
          </div>
        </div>
      </div>

      <!-- 付费直播观看白名单 -->
      <div id="tLive" class="admin-tab-panel">
        <div class="wl-dev-glass-bar" id="liveDevGlass" aria-label="研发批注"></div>
        <div class="admin-toolbar wl-filter-toolbar">
          <label class="wl-filter-item">
            <span class="wl-filter-label">用户 UID</span>
            <input class="ant-input" id="liveFilterUid" type="text" inputmode="numeric" placeholder="如 882910" style="width:120px">
          </label>
          <button type="button" class="ant-btn ant-btn-primary" id="btnLiveSearch"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
          <button type="button" class="ant-btn" id="btnLiveReset"><i class="fa-solid fa-rotate-left"></i> 重置</button>
          <button type="button" class="ant-btn ant-btn-primary" id="btnLiveAdd" data-perm="risk-wl-live-add" style="margin-left:auto"><i class="fa-solid fa-plus"></i> 添加 UID</button>
        </div>
        <div class="ant-card ant-card-bordered wl-table-card">
          <div class="ant-card-body">
            <div class="ant-table ant-table-bordered ant-table-small">
              <table style="width:100%">
                <thead class="ant-table-thead">
                  <tr><th style="width:64px">序号</th><th>用户 UID</th><th>创建人</th><th>创建时间</th><th style="width:100px">操作</th></tr>
                </thead>
                <tbody class="ant-table-tbody" id="liveTbody"></tbody>
              </table>
            </div>
            <div id="livePager"></div>
          </div>
        </div>
      </div>

      <!-- 付费内容观看白名单 -->
      <div id="tContent" class="admin-tab-panel">
        <div class="wl-dev-glass-bar" id="contentDevGlass" aria-label="研发批注"></div>
        <div class="admin-toolbar wl-filter-toolbar">
          <label class="wl-filter-item">
            <span class="wl-filter-label">用户 UID</span>
            <input class="ant-input" id="contentFilterUid" type="text" inputmode="numeric" placeholder="如 882910" style="width:120px">
          </label>
          <button type="button" class="ant-btn ant-btn-primary" id="btnContentSearch"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
          <button type="button" class="ant-btn" id="btnContentReset"><i class="fa-solid fa-rotate-left"></i> 重置</button>
          <button type="button" class="ant-btn ant-btn-primary" id="btnContentAdd" data-perm="risk-wl-content-add" style="margin-left:auto"><i class="fa-solid fa-plus"></i> 添加 UID</button>
        </div>
        <div class="ant-card ant-card-bordered wl-table-card">
          <div class="ant-card-body">
            <div class="ant-table ant-table-bordered ant-table-small">
              <table style="width:100%">
                <thead class="ant-table-thead">
                  <tr><th style="width:64px">序号</th><th>用户 UID</th><th>创建人</th><th>创建时间</th><th style="width:100px">操作</th></tr>
                </thead>
                <tbody class="ant-table-tbody" id="contentTbody"></tbody>
              </table>
            </div>
            <div id="contentPager"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js-web/risk-whitelist-store.js"></script>
<script src="js/settings-rbac.js"></script>
<script src="js/admin-session.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/risk-whitelist-page.js"></script>
</body>
</html>
