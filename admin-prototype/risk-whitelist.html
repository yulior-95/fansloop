<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会员白名单 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="risk-whitelist">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 风控管理 / 会员白名单</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>风控</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">会员白名单</h1>
      <p class="admin-page-desc">添加、移除 UID 使用<strong>弹窗</strong>。</p>
      <div class="admin-tabs-bar" id="wlTabs">
        <button type="button" class="active" data-tab="t1">订阅场景</button>
        <button type="button" data-tab="t2">付费直播观看</button>
      </div>
      <div id="t1" class="admin-tab-panel active">
        <div class="admin-toolbar">
          <button type="button" class="ant-btn ant-btn-primary" id="wlAdd1"><i class="fa-solid fa-plus"></i> 添加 UID</button>
          <span class="ant-input-affix-wrapper" style="width:200px"><input class="ant-input" placeholder="搜索 UID"></span>
        </div>
        <div class="ant-card ant-card-bordered"><div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-small">
            <table style="width:100%"><thead class="ant-table-thead"><tr><th>UID</th><th>备注</th><th>添加人</th><th>时间</th><th>操作</th></tr></thead>
            <tbody class="ant-table-tbody">
              <tr data-uid="882910"><td>882910</td><td>品牌合作账号</td><td>limin</td><td>2026-04-01</td><td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-wl-remove" style="color:#ff4d4f">移除</button></td></tr>
            </tbody>
          </table>
        </div></div>
      </div>
      <div id="t2" class="admin-tab-panel">
        <div class="ant-card ant-card-bordered"><div class="ant-card-body">
          <p style="color:rgba(0,0,0,.45)">与「订阅」白名单数据隔离；可配置生效直播间 ID 范围（后续扩展）。</p>
          <button type="button" class="ant-btn ant-btn-primary" id="wlAdd2"><i class="fa-solid fa-plus"></i> 添加 UID</button>
        </div></div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script>
(function () {
  var M = window.AdminModal;
  var bar = document.getElementById("wlTabs");
  if (bar) {
    bar.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-tab]");
      if (!b) return;
      var id = b.getAttribute("data-tab");
      bar.querySelectorAll("button").forEach(function (x) {
        x.classList.toggle("active", x === b);
      });
      document.querySelectorAll("#t1,#t2").forEach(function (p) {
        p.classList.toggle("active", p.id === id);
      });
    });
  }
  function openAdd(scene) {
    M.open({
      title: "添加白名单 UID · " + scene,
      body:
        "<label style='display:block;margin-bottom:6px'>UID</label><input class='ant-input' style='width:100%;max-width:320px;margin-bottom:12px' placeholder='数字 UID'>" +
        "<label style='display:block;margin-bottom:6px'>备注</label><input class='ant-input' style='width:100%;max-width:320px' placeholder='选填'>",
      footer: [
        { text: "取消", onClick: M.close },
        {
          text: "添加",
          primary: true,
          onClick: function () {
            M.close();
            M.toast("已加入白名单（原型）");
          }
        }
      ]
    });
  }
  document.getElementById("wlAdd1").addEventListener("click", function () {
    openAdd("订阅");
  });
  document.getElementById("wlAdd2").addEventListener("click", function () {
    openAdd("付费直播观看");
  });
  document.querySelector("main.admin-content").addEventListener("click", function (e) {
    if (!e.target.classList.contains("js-wl-remove")) return;
    var uid = e.target.closest("tr").getAttribute("data-uid");
    M.open({
      title: "移除白名单",
      body: "<p style='margin:0'>确认将 UID <strong>" + M.esc(uid) + "</strong> 从当前场景白名单移除？</p>",
      footer: [
        { text: "取消", onClick: M.close },
        {
          text: "确认移除",
          danger: true,
          onClick: function () {
            M.close();
            M.toast("已移除（原型）");
          }
        }
      ]
    });
  });
})();
</script>
</body>
</html>
