<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>积分奖励 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="activities-points-reward">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 积分运营 / 积分奖励</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-primary ant-btn-sm" id="expRew"><i class="fa-solid fa-file-export"></i> 导出</button>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>活动运营</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">积分奖励流水</h1>
      <p class="admin-page-desc">导出、行详情在<strong>弹窗</strong>。</p>
      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:160px"><input class="ant-input" placeholder="UID"></span>
        <span class="ant-input-affix-wrapper" style="width:200px"><input class="ant-input" placeholder="活动 / 规则 ID"></span>
        <button type="button" class="ant-btn ant-btn-primary" id="qRew">查询</button>
      </div>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-small">
            <table style="width:100%">
              <thead class="ant-table-thead">
                <tr><th>时间</th><th>UID</th><th>规则</th><th>积分</th><th>说明</th><th>操作</th></tr>
              </thead>
              <tbody class="ant-table-tbody">
                <tr><td>2026-05-11 07:55</td><td>882910</td><td>观看满 30 分钟</td><td>+50</td><td>直播 room_882</td><td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-row">详情</button></td></tr>
                <tr><td>2026-05-10 22:10</td><td>102938</td><td>首次订阅创作者</td><td>+200</td><td>订阅 creator_12</td><td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-row">详情</button></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script>
(function () {
  var M = window.AdminModal;
  document.getElementById("expRew").addEventListener("click", function () {
    M.open({
      title: "导出积分奖励流水",
      body: "<p style='margin:0'>按筛选条件导出 CSV。</p>",
      footer: [
        { text: "取消", onClick: M.close },
        {
          text: "创建任务",
          primary: true,
          onClick: function () {
            M.close();
            M.toast("导出任务已创建（原型）");
          }
        }
      ]
    });
  });
  document.getElementById("qRew").addEventListener("click", function () {
    M.toast("已查询（原型）");
  });
  document.querySelector("main.admin-content").addEventListener("click", function (e) {
    if (!e.target.classList.contains("js-row")) return;
    M.open({
      title: "奖励流水详情",
      body: "<pre style='margin:0;font-size:12px;background:#fafafa;padding:12px;border-radius:6px'>id: pt_rwd_8821\nrule_id: ACT_WATCH_30\nidempotency_key: ik_00921</pre>",
      footer: [{ text: "关闭", primary: true, onClick: M.close }]
    });
  });
})();
</script>
</body>
</html>
