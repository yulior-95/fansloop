    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 双商城 / 联盟佣金</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">联盟佣金流水</h1>
            <div class="ant-card ant-card-bordered" style="margin-bottom:16px"><div class="ant-card-body" style="font-size:13px;color:rgba(0,0,0,.55);line-height:1.6">第三方成交回传 → GOODFANS 收佣 → 按商城配置分配给创作者。无平台内实体订单履约。<br><span style="color:rgba(0,0,0,.45)">订单号：平台流水号由 GOODFANS 生成；三方订单号来自合作方回传（幂等键）。退货时保留原「已结算」，另记「冲正」负向流水（关联原单），不改写原记录。</span></div></div>
      <div class="ant-card ant-card-bordered"><div class="ant-card-body" style="padding-top:0;overflow-x:auto"><div class="ant-table ant-table-bordered ant-table-middle mall-comm-table"><table style="width:100%;min-width:1180px;font-size:14px"><thead class="ant-table-thead"><tr><th>#</th><th>平台流水号</th><th>三方订单号</th><th>商品</th><th>创作者</th><th>成交额</th><th>佣金率</th><th>联盟佣金</th><th>创作者实得</th><th>平台留存</th><th>状态</th><th>时间</th></tr></thead><tbody id="mallCommBody"></tbody></table></div></div></div>
<style>
