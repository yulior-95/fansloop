<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创作者分成 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="creator-income-split">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 全局参数 / 创作者分成</span></div>
      <div class="admin-header-right">
        <a href="settings-global.html" class="ant-btn ant-btn-sm"><i class="fa-solid fa-sliders"></i> 参数总览</a>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>财务配置</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">创作者分成配置</h1>

      <div class="ant-card ant-card-bordered" style="margin-bottom:16px">
        <div class="ant-card-body">
          <p style="margin:0;font-size:13px;color:rgba(0,0,0,.55)">
            <i class="fa-solid fa-circle-info" style="color:#1677ff;margin-right:6px"></i>
            粉丝侧支付金额为礼物 / 订阅原价；平台抽成在结算给创作者时扣除。变更仅对<strong>新订单</strong>生效，历史订单不回溯。
            若开启「等级加成」，创作者等级可在基础比例上获得更优实得（见 C 端等级说明）。
          </p>
        </div>
      </div>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-head">
          <div class="ant-card-head-title"><i class="fa-solid fa-gift" style="margin-right:8px;color:#eb2f96"></i>收入类型分成</div>
        </div>
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-middle">
            <table style="width:100%" id="splitRulesTable">
              <thead class="ant-table-thead">
                <tr>
                  <th style="width:140px">收入类型</th>
                  <th>说明</th>
                  <th style="width:100px">结算周期</th>
                  <th style="width:160px">创作者实得 (%)</th>
                  <th style="width:120px">平台抽成</th>
                </tr>
              </thead>
              <tbody id="splitRulesBody"></tbody>
            </table>
          </div>
          <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;margin-right:12px">
              <input type="checkbox" id="fldLevelAdjust" checked> 允许创作者等级优化实得比例
            </label>
            <button type="button" class="ant-btn ant-btn-primary" id="btnSplitSave"><i class="fa-solid fa-floppy-disk"></i> 保存分成配置</button>
            <button type="button" class="ant-btn" id="btnSplitReset"><i class="fa-solid fa-rotate-left"></i> 恢复默认</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js-web/creator-income-split-config.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/creator-income-split-admin.js"></script>
</body>
</html>
