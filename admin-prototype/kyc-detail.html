<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KYC 审核详情 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <style>
    .kyc-img-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin:16px 0; }
    @media(max-width:900px){ .kyc-img-grid { grid-template-columns:1fr; } }
    .kyc-img-card { border:1px solid #f0f0f0; border-radius:8px; overflow:hidden; background:#fafafa; }
    .kyc-img-card img { width:100%; height:180px; object-fit:cover; display:block; }
    .kyc-img-card .cap { padding:8px 10px; font-size:12px; color:#666; font-weight:600; }
    .timeline { border-left:2px solid #f0f0f0; margin:12px 0 0 8px; padding-left:16px; }
    .timeline .ti { font-size:12px; color:#333; margin-bottom:10px; }
    .timeline .ti span { color:#999; font-size:11px; margin-left:6px; }
  </style>
</head>
<body data-admin-page="kyc-manage">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 用户管理 / KYC 审核记录 / 详情</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>合规审核</span></div></div>
    </header>
    <main class="admin-content">
      <p><a href="kyc-manage.html" class="ant-btn ant-btn-link" style="padding-left:0"><i class="fa-solid fa-arrow-left"></i> 返回列表</a></p>
      <h1 class="admin-page-title">KYC 审核详情</h1>
      <p class="admin-page-desc">查看用户提交的<strong>身份证正反面</strong>与<strong>人脸识别快照</strong>，结合下方时间线了解机审 / 人工进度与备注。</p>

      <div class="ant-card ant-card-bordered" style="margin-bottom:16px">
        <div class="ant-card-head"><div class="ant-card-head-title">证件与人脸材料</div></div>
        <div class="ant-card-body">
          <div class="kyc-img-grid">
            <div class="kyc-img-card"><img id="imFront" alt="证件人像面" src="https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=600&q=80"><div class="cap">身份证 · 人像面</div></div>
            <div class="kyc-img-card"><img id="imBack" alt="证件国徽面" src="https://images.unsplash.com/photo-1450101499163-c8848c66ca85?w=600&q=80"><div class="cap">身份证 · 国徽面</div></div>
            <div class="kyc-img-card"><img id="imFace" alt="人脸识别快照" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=400&fit=crop&crop=face"><div class="cap">人脸识别快照</div></div>
          </div>
        </div>
      </div>

      <div class="ant-card ant-card-bordered" style="margin-bottom:16px">
        <div class="ant-card-head"><div class="ant-card-head-title">当前用户 KYC 状态（本机）</div></div>
        <div class="ant-card-body" id="kycStateBox" style="font-size:13px;line-height:1.7"></div>
      </div>

      <div class="ant-card ant-card-bordered" style="margin-bottom:16px">
        <div class="ant-card-head"><div class="ant-card-head-title">审核流水</div></div>
        <div class="ant-card-body">
          <div class="timeline" id="timeline"></div>
        </div>
      </div>

      <div class="ant-card ant-card-bordered" style="margin-bottom:16px">
        <div class="ant-card-head"><div class="ant-card-head-title">机器审核（原型）</div></div>
        <div class="ant-card-body">
          <p style="font-size:12px;color:#888;margin-top:0">规则引擎：证件模糊 / 伪证风险 / 人脸与证件不一致 → 可机审不通过；置信度不足 → 转人工。</p>
          <button type="button" class="ant-btn ant-btn-primary" id="btnMachineOk">机审通过</button>
          <button type="button" class="ant-btn" id="btnMachineHuman" style="margin-left:8px">机审无法判断 → 转人工</button>
          <button type="button" class="ant-btn ant-btn-danger" id="btnMachineReject" style="margin-left:8px">机审不通过</button>
        </div>
      </div>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-head"><div class="ant-card-head-title">人工处置（原型）</div></div>
        <div class="ant-card-body">
          <p style="font-size:12px;color:#888;margin-top:0">机审：若 OCR 模糊、伪证风险或人脸不一致 → 可直接判定不通过；若置信度不足 → 转人工。以下为人工审核备注与结论。</p>
          <textarea id="humanNote" class="ant-input" style="width:100%;min-height:72px;margin-bottom:12px" placeholder="审核备注（写入流水 note）"></textarea>
          <button type="button" class="ant-btn ant-btn-primary" id="btnPass"><i class="fa-solid fa-check"></i> 人工通过</button>
          <button type="button" class="ant-btn ant-btn-danger" id="btnReject" style="margin-left:8px"><i class="fa-solid fa-xmark"></i> 人工不通过</button>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js-web/kyc-store.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script>
(function () {
  var KS = window.FansloopKycStore;
  var M = window.AdminModal;
  var id = new URLSearchParams(location.search).get("id") || "";
  var k = KS.readKyc();
  if (k.idCardFront) document.getElementById("imFront").src = k.idCardFront;
  if (k.idCardBack) document.getElementById("imBack").src = k.idCardBack;
  if (k.faceSnapshot) document.getElementById("imFace").src = k.faceSnapshot;

  var st = k.status || "none";
  document.getElementById("kycStateBox").innerHTML =
    "<div><strong>status</strong>：" + st + " &nbsp; <strong>authStatus</strong>：<code>" + (k.authStatus || "—") + "</code> 来源：" + (k.authSource || "—") + " 单号：<code>" + (k.lastId || "—") + "</code></div>" +
    (st === "rejected" && k.rejectReason ? "<div style='margin-top:8px;color:#cf1322'><strong>用户可见原因</strong>：" + k.rejectReason + "</div>" : "");

  var log = KS.readAuditLog();
  var tl = document.getElementById("timeline");
  tl.innerHTML = "";
  log.filter(function (r) { return !id || r.id === id || (r.id && r.id.indexOf(id.replace(/-R|-H/g, "")) === 0); })
    .slice(0, 12)
    .forEach(function (r) {
      var d = document.createElement("div");
      d.className = "ti";
      d.innerHTML = "<strong>" + (r.status || "—") + "</strong><span>" + (r.time || "") + "</span><br><span style='color:#666;font-weight:400'>" + (r.note || "") + " · " + (r.pipeline || "") + "</span>";
      tl.appendChild(d);
    });
  if (!tl.children.length) tl.innerHTML = "<div style='color:#999;font-size:12px'>暂无匹配流水</div>";

  var lid = k.lastId || "KYC";

  document.getElementById("btnMachineOk").addEventListener("click", function () {
    KS.setDocumentApproved("机审通过：清晰度/真伪/人脸比对均通过（后台模拟）");
    KS.pushAudit({ id: lid + "-R", user: "系统", channel: "KYC", pipeline: "机审", status: "机审通过", note: "后台机审通过" });
    M.toast("已通过，已同步用户端");
    location.reload();
  });
  document.getElementById("btnMachineHuman").addEventListener("click", function () {
    KS.writeKyc({ authStatus: "reviewing", status: "submitted", stage: "human" });
    KS.pushAudit({ id: lid + "-R", user: "系统", channel: "KYC", pipeline: "机审", status: "转人工", note: "置信度不足 / 抽检需人工复核（模拟）" });
    M.toast("已标记转人工，用户端仍为审核中");
    location.reload();
  });
  document.getElementById("btnMachineReject").addEventListener("click", function () {
    var reason = prompt("机审不通过原因（用户端可见）", "证件人像模糊，无法完成联网核查。");
    if (reason === null) return;
    KS.setDocumentRejected(reason);
    KS.pushAudit({ id: lid + "-R", user: "系统", channel: "KYC", pipeline: "机审", status: "已驳回", note: reason });
    M.toast("已拒绝，已同步用户端");
    location.reload();
  });

  document.getElementById("btnPass").addEventListener("click", function () {
    var note = document.getElementById("humanNote").value.trim() || "人工核验通过";
    KS.setDocumentApproved(note);
    KS.pushAudit({ id: lid + "-H", user: "审核员", channel: "KYC", pipeline: "人工", status: "人工通过", note: note });
    M.toast("已通过，已同步用户端");
    location.reload();
  });
  document.getElementById("btnReject").addEventListener("click", function () {
    var reason = prompt("审核不通过原因（用户端可见）", document.getElementById("humanNote").value.trim() || "证件与活体比对未通过，请重新提交。");
    if (reason === null) return;
    KS.setDocumentRejected(reason);
    KS.pushAudit({ id: lid + "-H", user: "审核员", channel: "KYC", pipeline: "人工", status: "人工拒绝", note: reason });
    M.toast("已拒绝，已同步用户端");
    location.reload();
  });
})();
</script>
</body>
</html>
