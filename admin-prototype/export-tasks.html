<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导出任务列表 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/export-tasks.css">
</head>
<body data-admin-page="export-tasks">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 订单管理 / 导出任务列表</span></div>
      <div class="admin-header-right">
        <div class="admin-header-user">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt="">
          <span>财务</span>
        </div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">导出任务列表</h1>
      <div class="admin-toolbar exp-tasks-filter">
        <label class="ord-filter-item">
          <span class="ord-filter-label">导出类型</span>
          <input class="ant-input" id="expFilterType" type="text" placeholder="如 充值订单" style="width:140px">
        </label>
        <span class="ord-filter-actions">
          <button type="button" class="ant-btn ant-btn-primary" id="expQuery">查询</button>
          <button type="button" class="ant-btn" id="expReset">重置</button>
        </span>
      </div>
      <div class="ant-card ant-card-bordered ord-list-card">
        <div class="ant-card-body">
          <div class="ord-table-scroll">
            <div class="ant-table ant-table-bordered ant-table-middle exp-tasks-table">
              <table>
                <thead class="ant-table-thead">
                  <tr>
                    <th class="col-sticky-left col-index">序号</th>
                    <th>导出任务单号</th>
                    <th class="col-export-type">导出类型</th>
                    <th class="col-conditions">导出条件</th>
                    <th>导出时间</th>
                    <th>删除时间</th>
                    <th>导出人</th>
                    <th>状态</th>
                    <th class="col-actions">操作</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="expTasksTbody" data-pager="js"></tbody>
              </table>
            </div>
          </div>
          <div id="expTasksPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-export-tasks.js"></script>
<script src="js/export-tasks-page.js"></script>
</body>
</html>
