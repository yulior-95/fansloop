> 产品 / 研发视角 · 2026-06-17  
> 面向：产品、运营、研发、业务评审

---

## 一、积分账户

| 概念 | 业务说明 | 用户查看入口 |
|------|----------|--------------|
| 可用积分 | 可立即用于积分商城兑换的余额 | 首页/积分中心、积分商城/积分账户 |
| 冻结积分 | 部分奖励（如邀请返利）需经冷静期后方可转为可用 | 首页/积分中心「冷静中」、个人主页/邀请拉新数据 |
| 积分明细 | 用户可查看获取、消耗、冻结解冻等账变记录 | 首页/积分中心 → Tab「获取明细」→「查看完整流水页」 |
| 每日获取上限 | 单日通过任务获得的积分总量有上限（默认 480，见「积分风控」）；可用「上限提升卡」临时提高 | 首页/积分中心「今日已获」进度 |
| 分层加成 | 按用户画像对任务基础分追加倍率；只增加「加成部分」，受分层每日加成上限约束 | 积分中心「加成规则」页、任务领取 Toast |

**冷静期规则**：邀请拉新等高风险渠道，奖励先进入冻结池，期满（默认 7 天）自动解冻为可用积分。积分商城 Hero 区展示「积分冷静期说明」。

**分层与风控分工**：「每日任务获取总上限」由积分风控控制（含基础分+加成）；「单用户每日分层加成积分上限」只统计 `实发 − 基础`，两者不重复限同一口径。

---

## 二、活动分类体系

### 2.1 两大渠道

| 渠道 | 方向 | 页面入口 | 典型场景 |
|------|------|----------|----------|
| 积分任务 | 获取积分 | 首页 → 顶栏「我的积分」→ 抽屉「积分中心」；个人主页 →「积分任务」 | 观看直播满 30 分钟、每日签到、邀请好友注册、首次订阅创作者、浏览赚积分（计时） |
| 积分商城 | 消耗积分 | 侧栏「积分商城」；积分中心底部「积分商城」 | 试看券、订阅折扣、加速卡、会员装扮、幸运转盘等（见第五章） |

### 2.2 活动类型（与后台「活动类型」选项一致）

| 类型 | 投放渠道 | 玩法说明 | 运营可独立创建 |
|------|----------|----------|----------------|
| 计时任务 | 任务中心 | 观看/浏览达时长后发放积分 | 是 |
| 邀请拉新 | 任务中心 | 邀请人与被邀请人双向奖励，含风控审核 | 是 |
| 签到链 | 任务中心 | 连续签到按阶梯递增奖励 | 是 |
| 互动行为 | 任务中心 | 点赞、评论等互动触发发奖 | 是 |
| 订阅行为 | 任务中心 | 首订/续订创作者后奖励 | 是 |
| 研发活动 | 任务中心 | 节日分享、专题 H5 等定制玩法（研发绑定触发） | 研发创建 |
| 兑换商品 | 积分商城 | 消耗积分兑换券/权益，写入用户券包 | 是 |
| 幸运转盘 | 积分商城 | 每次消耗积分参与抽奖 | 是 |

### 2.3 商城 Tab 分类

活动可同时归属多个 Tab；封面角标（会员、付费、空投等）与 Tab 独立，用于商品卡视觉强调。

| Tab | 定位 | 典型商品 |
|-----|------|----------|
| 热门推荐 | 高频、高性价比 | 试看券、打赏加成、会员 7 天、SFL 资格 |
| 付费权益 | 内容付费与订阅优惠 | 试看、折扣券、免费订阅、打赏加成 |
| 加速成长 | 提升积分获取效率 | 加速卡、签到翻倍、每日上限、邀请加成 |
| 会员&装扮 | 身份与个性化 | 会员时长、评论高亮、头像框 |
| 资产专区 | Web3 / 链上相关 | 转盘、SFL 资格、空投券、NFT 折扣、质押加成 |

## 三、后台管理 · 积分活动配置

对应后台入口：**积分活动列表 → 新建/编辑活动**。以下字段均指编辑页各区块，与后台表单一致。

### 3.1 基础信息（所有类型）

| 字段 | 业务说明 |
|------|----------|
| 活动名称 | 前台展示标题 |
| 活动编码 | 全局唯一，用于发奖/埋点对接 |
| 活动类型 | 决定下方「触发规则」「奖励与频控」展示哪些字段 |
| 投放渠道 | 任务中心（获取积分）/ 积分商城（消耗积分） |
| 状态 | 草稿 / 启用 / 停用 |
| 排序权重 | 列表与前台展示顺序 |

### 3.2 商城展示（仅投放渠道 = 积分商城）

| 字段 | 业务说明 |
|------|----------|
| 商城分类 | 商品出现在哪些 Tab（可多选） |
| 封面角标 | 商品卡角标，如「付费」「会员」「限量资格」 |
| 封面图 | 商城商品卡头图 |
| 前台描述 | 展示在商城卡片说明区 |

### 3.3 奖励与频控（按活动类型）

编辑页「奖励与频控」区块字段因类型而异；**未列出的字段表示该类型不出现或固定，无需填写**。

**积分值填写规则**：获取类填**正数**（如 `50` → 展示「+50 积分」）；兑换类填**负数**（如 `-1600` → 保存后自动生成「消耗 1,600 积分」文案）。

#### 计时任务

| 区块 | 需填写字段 |
|------|------------|
| 触发规则 | 触发时长（分钟） |
| 奖励与频控 | 积分值、奖励文案、频控周期、次数上限、频控展示文案、日积分上限 |

#### 邀请拉新

| 区块 | 需填写字段 |
|------|------------|
| 触发规则 | 邀请人积分、被邀请人积分、是否需风控审核 |
| 奖励与频控 | 频控周期、次数上限、频控展示文案、日积分上限、累计上限（可选） |
| 不出现 | 积分值（由双方分值决定）；冷静期跟随风控配置，单活动不可改 |

#### 签到链

| 区块 | 需填写字段 |
|------|------------|
| 触发规则 | 连续签到天数、阶梯奖励（逗号分隔每日积分）、链重置周期 |
| 奖励与频控 | 奖励展示文案（可选，留空按阶梯自动生成） |
| 固定/不出现 | 签到频控固定「每日 1 次」；无积分值、无频控周期、无日积分上限 |

#### 互动行为

| 区块 | 需填写字段 |
|------|------------|
| 触发规则 | 互动行为类型（点赞/评论等） |
| 奖励与频控 | 积分值、频控周期、次数上限、频控展示文案、日积分上限 |

#### 订阅行为

| 区块 | 需填写字段 |
|------|------------|
| 触发规则 | 首订奖励积分、续订奖励积分 |
| 奖励与频控 | 频控周期、次数上限、频控展示文案、累计上限（可选）、奖励展示文案（可选） |
| 不出现 | 积分值；首订活动建议频控选「终身 1 次」 |

#### 研发活动

| 区块 | 需填写字段 |
|------|------------|
| 触发规则 | 开始时间、结束时间、活动积分总预算 |
| 奖励与频控 | 积分值、频控周期、次数上限、频控展示文案 |
| 不出现 | 日积分上限；触发逻辑由研发绑定活动编码，运营不可改 |

#### 兑换商品

| 区块 | 需填写字段 |
|------|------------|
| 触发规则 | 库存、商品模板对应权益参数（如持券天数、折扣比例、可用次数等） |
| 奖励与频控 | 积分值（负数）、频控周期、次数上限、频控展示文案 |
| 不出现 | 奖励文案（保存时按模板自动生成「消耗 X 积分 · …」）；日积分上限 |

#### 幸运转盘

| 区块 | 需填写字段 |
|------|------------|
| 触发规则 | 单次消耗积分、每日抽奖次数 |
| 奖励与频控 | 频控展示文案（可选，留空按每日次数自动生成） |
| 不出现 | 积分值、频控周期、次数上限、奖励文案（由上方消耗与次数推导） |

| 活动 | 类型 | 上线默认奖励规则 | 频控 | 冷静期 | 状态 | 页面路径 | 触发按钮 |

| 每日签到 | 签到链 | +20 积分/日（原型） | 每日 1 次 | 无 | 启用 | 首页/个人主页 → 积分中心/积分活动 | 任务卡「领取」 |

**任务抽屉公共按钮**：Tab「赚积分任务」/「获取明细」；底部「积分商城」「关闭」。

## 五、消耗积分 · 积分商城

| 订阅 8 折券 | 6,800 | 订阅 8 折，券有效 2 天 | 每周 1 次 | 启用 | 同上 | 同上 | 选 8 折券 →「确认订阅并支付」 |

### 5.2 加速成长

| 兑换扣减 | 仅扣减「可用积分」；冻结积分不可用于兑换 |

## 八、积分分层配置

> **后台入口**：全局参数 → 参数总览（`../settings-global.html`）→ **积分分层**（`../activities-points-tier.html`）  
> **关联配置**：积分风控（`../risk-limits.html`）、积分活动类型（`../activities-points-types.html`）、积分加速卡等活动（第五章）

### 8.1 产品定位

| 维度 | 说明 |
|------|------|
| 是什么 | 按**用户画像**（新用户、连登、互动、订阅等）对任务类积分发放追加**倍率加成** |
| 不是什么 | 不是单活动奖励数值（那是「积分活动」配置）；不是日总上限（那是「积分风控」） |
| 何时生效 | 用户点击任务「领取」时，在**任务基础分**之上结算加成 |
| 谁可读配置 | C 端只读**已发布**版本；运营「保存草稿」≠ 用户端生效，须点「发布上线」 |

### 8.2 发布流程（运营 / 研发）

| 步骤 | 动作 | 存储 / API |
|------|------|------------|
| 1 | 运营编辑参数 → **保存草稿** | `PUT /api/v1/admin/points-tier-config` |
| 2 | 校验通过 → **发布上线** | `PUT /api/v1/admin/points-tier-config/publish` |
| 3 | C 端发奖读取已发布配置 | `GET /api/v1/points/tier-config-published` |
| 4 | 用户领取任务 | `POST /api/v1/points/tasks/:taskId/claim`（服务端算 `finalPoints`） |

未发布时，C 端使用内置**默认防薅配置**（非运营草稿）。

### 8.3 全局参数字段

| 字段 | 类型 | 业务含义 | 规则逻辑（研发） |
|------|------|----------|------------------|
| `maxCombinedMultiplier` | number | **分层封顶倍率** | 多条分层规则连乘后的**单笔**上限，如 1.5；非单日累计 |
| `globalMaxMultiplier` | number | **全局封顶倍率** | 分层结果与积分加速卡合并后的**单笔**上限，如 1.65；须 ≥ 分层封顶 |
| `dailyTierBonusCap` | int | **单用户每日加成积分上限** | 自然日内，所有发奖累计的「加成部分」上限（`实发 − 基础`）；不含基础分本身；与风控 `dailyPointsCap` 分工 |
| `externalBoostStackMode` | enum | **与积分加速卡叠加方式** | `max_only`（推荐）：`max(分层倍率, 加速卡倍率)`；`multiply_capped`：连乘后受全局封顶；`tier_only`：忽略加速卡 |
| `excludedActivityTypes` | string[] | **不参与分层的活动类型** | 命中则 `effectiveMultiplier = 1`，只发基础分；默认含 `earn_invite`、`campaign` |
| `rules` | object | 四条画像规则，见 8.4 | 命中多条时**连乘**，再受分层封顶截断 |

**活动类型 ID**（与活动类型、积分风控冷静期同源）：`earn_task` 计时任务 · `earn_invite` 邀请拉新 · `earn_checkin` 签到链 · `earn_interaction` 互动行为 · `earn_subscription` 订阅行为 · `campaign` 研发活动 · `custom_wheel` 幸运转盘

### 8.4 分层规则字段（`rules.*`）

四条规则结构一致：可 `enabled` 开关 + `multiplier` 倍率；命中条件由**服务端用户画像**判定，客户端不可写。

#### 8.4.1 新用户注册 `registerDaysLte`

| 字段 | 业务说明 | 规则逻辑 |
|------|----------|----------|
| `enabled` | 是否启用 | false 时不参与命中 |
| `days` | 新用户窗口（天） | 注册后 ≤ N 天可享加成 |
| `multiplier` | 加成倍率 | 建议 ≤ 1.1；注册时**锁定**天数与倍率到用户档案 |

**锁定规则（重要）**：用户注册时把当时后台配置的 `days`、`multiplier` 写入 `newUserTierDaysAtRegister`、`newUserTierMultiplierAtRegister`。之后运营改短/改长配置，**已注册用户不追溯**，只按锁定值判断是否在窗口内。

#### 8.4.2 连续登录 `consecutiveLoginGte`

| 字段 | 业务说明 | 规则逻辑 |
|------|----------|----------|
| `enabled` | 是否启用 | — |
| `days` | 连登门槛 | `consecutiveLoginDays ≥ days` 才命中 |
| `multiplier` | 加成倍率 | 连乘进分层 |
| `bonusMaxDays` | 加成最多享（天） | 达标后最多享受 N 天加成；服务端维护 `consecutiveLoginBonusDaysUsed`，用尽后须重新连登达标；**断签失效** |

**与积分加速卡互斥（固定产品规则）**：用户持有有效期内积分加速卡时，**连续登录分层不参与结算**（从命中列表剔除）；其余分层仍可与加速卡按 `externalBoostStackMode` 合并。

#### 8.4.3 互动行为 `hasEngagement`

| 字段 | 业务说明 | 规则逻辑 |
|------|----------|----------|
| `enabled` | 是否启用 | — |
| `multiplier` | 加成倍率 | — |
| `windowDays` | 统计窗口 | 近 N 日有效互动 |
| `minActions` | 最少互动次数 | 点赞/评论等计数 |
| `minDistinctPosts` | 最少不同内容数 | 防单帖刷量 |
| `minDistinctAuthors` | 最少不同作者数 | 防小号互刷 |
| `minAccountAgeDays` | 账号最低龄 | 注册满 N 天才可命中 |
| `excludeSelfContent` | 排除自刷 | 仅互动自己内容时不命中 |

#### 8.4.4 订阅用户 `hasSubscription`

| 字段 | 业务说明 | 规则逻辑 |
|------|----------|----------|
| `enabled` | 是否启用 | — |
| `multiplier` | 加成倍率 | — |
| `requireActive` | 须有效付费订阅 | 取消订阅立即失去加成 |
| `minPaidAmount` | 最低实付（USDT） | 免费试用不计 |
| `minSubscribedDays` | 最少连续订阅天数 | 防订一天即取消 |

### 8.5 单笔发奖结算逻辑（研发实现要点）

**输入**：`taskId`、任务目录中的 `baseReward`、`activityTypeId`、用户画像、已发布分层配置、券包状态、当日账本。

**计算顺序**（伪代码）：

```
1. 若 activityTypeId ∈ excludedActivityTypes → final = base，结束
2. 若签到且消耗「签到翻倍卡」→ base = base × 翻倍倍率；tierExcluded = true（只走翻倍，不叠分层）
3. matched = 命中 rules（加速卡生效时剔除 consecutiveLoginGte）
4. tierMul = min(∏ matched.multiplier, maxCombinedMultiplier)
5. 按 externalBoostStackMode 合并积分加速卡 → effectiveMul = min(..., globalMaxMultiplier)
6. bonus = round(base × effectiveMul) − base
7. bonus = min(bonus, dailyTierBonusCap − 今日已用加成配额)
8. final = base + bonus
9. 校验积分风控 dailyPointsCap；超限拒绝或截断
10. 写账本：今日总获取、今日加成已用、连登加成天数（若命中连登）
```

**输出字段建议**（流水 / 监控）：`basePoints`、`tierMultiplier`、`externalMultiplier`、`effectiveMultiplier`、`bonusPoints`、`finalPoints`、`tierExcluded`、`bonusCapped`、`dailyCapTrimmed`

### 8.6 与商城权益的固定互斥规则

| 权益 | 与分层关系 | 说明 |
|------|------------|------|
| 积分加速卡 · 24h | 取较高者（默认） | 与分层倍率 `max` 后受全局封顶；连登分层在加速卡有效期内**不生效** |
| 连续签到翻倍卡 | **不叠分层** | 翻倍后 `effectiveMultiplier = 1`，只发翻倍后基础分 |
| 每日上限提升卡 | 无关 | 只改风控展示的上限，不参与倍率 |
| 邀请加成卡 | 无关 | 作用于邀请返利比例，非任务分层 |

| 全局封顶 | ×1.65 |

| 积分加成规则页 | 命中规则列表、加速卡状态、今日加成/总获取进度 |

</script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function () {
  var raw = document.getElementById('mdContent').textContent.trim();
  var source = document.getElementById('mdSource');
  var preview = document.getElementById('mdPreview');
  var render = document.getElementById('docRender');
  var toast = document.getElementById('toast');
  var showMd = false;

  source.value = raw;
  if (window.marked) {
    render.innerHTML = marked.parse(raw, { gfm: true, breaks: false });
  } else {
    render.innerHTML = '<pre>' + raw.replace(/</g, '&lt;') + '</pre>';
  }

  function showToast(msg) {
    toast.textContent = msg || '已复制到剪贴板';
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  document.getElementById('btnCopyMd').addEventListener('click', function () {
    var text = source.value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast(); }).catch(fallback);
    } else {
      fallback();
    }
    function fallback() {
      source.style.position = 'fixed';
      source.style.left = '0';
      source.style.top = '0';
      source.style.width = '100%';
      source.style.height = '120px';
      source.style.opacity = '1';
      source.style.zIndex = '9999';
      source.select();
      try {
        document.execCommand('copy');
        showToast();
      } catch (e) {
        showToast('复制失败，请手动全选 Markdown 源码');
      }
      source.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;opacity:0';
    }
  });

  document.getElementById('btnToggleMd').addEventListener('click', function () {
    showMd = !showMd;
    preview.style.display = showMd ? 'block' : 'none';
    render.style.display = showMd ? 'none' : 'block';
    this.innerHTML = showMd
      ? '<i class="fa-solid fa-eye"></i> 显示渲染文档'
      : '<i class="fa-solid fa-code"></i> 显示 Markdown 源码';
    if (showMd) preview.textContent = raw;
  });
})();
</script>
</body>
</html>
