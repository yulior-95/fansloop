<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户功能控制开关 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/admin-pagination.css">
  <link rel="stylesheet" href="css/risk-user-features.css">
</head>
<body data-admin-page="risk-user-features">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 风控安全 / 用户功能控制开关</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>风控</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">用户功能控制开关</h1>
      <p class="ufc-scope-hint"><i class="fa-solid fa-circle-info" style="color:#1677ff;margin-right:6px"></i>按用户单独限制平台功能；未配置时默认<b>全部开放</b>。关闭某功能仅影响该用户，不影响全站与其他用户。</p>

      <div class="admin-toolbar ufc-filter-toolbar">
        <label class="ufc-filter-item">
          <span class="ufc-filter-label">用户 UID</span>
          <input class="ant-input" id="ufcFilterUid" type="text" inputmode="numeric" placeholder="如 882910" style="width:120px">
        </label>
        <label class="ufc-filter-item">
          <span class="ufc-filter-label">昵称</span>
          <input class="ant-input" id="ufcFilterNickname" type="text" placeholder="用户昵称" style="width:160px">
        </label>
        <label class="ufc-filter-item">
          <span class="ufc-filter-label">邮箱</span>
          <input class="ant-input" id="ufcFilterEmail" type="text" placeholder="邮箱地址" style="width:200px">
        </label>
        <button type="button" class="ant-btn ant-btn-primary" id="ufcSearch"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
        <button type="button" class="ant-btn" id="ufcReset"><i class="fa-solid fa-rotate-left"></i> 重置</button>
      </div>

      <div class="ant-card ant-card-bordered ufc-table-card">
        <div class="ant-card-body">
          <div class="ant-table ant-table-bordered ant-table-middle">
            <table style="width:100%">
              <thead class="ant-table-thead">
                <tr>
                  <th style="width:64px">序号</th>
                  <th style="width:100px">UID</th>
                  <th style="width:140px">用户昵称</th>
                  <th>邮箱</th>
                  <th style="width:120px">已限制功能</th>
                  <th style="width:168px">最近修改</th>
                  <th style="width:120px">操作</th>
                </tr>
              </thead>
              <tbody class="ant-table-tbody" id="ufcTbody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="ufcPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/risk-user-features-store.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/risk-user-features-page.js"></script>
</body>
</html>
