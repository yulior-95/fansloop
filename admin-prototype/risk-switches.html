<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全局系统开关 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <style>
    [data-admin-page="risk-switches"] .rsw-switch { vertical-align: middle; }
    [data-admin-page="risk-switches"] td .rsw-switch { margin: 0; }
  </style>
</head>
<body data-admin-page="risk-switches">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 全局参数 / 系统开关</span></div>
      <div class="admin-header-right">
        <a href="settings-global.html" class="ant-btn ant-btn-sm"><i class="fa-solid fa-sliders"></i> 参数总览</a>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>系统管理员</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">全局系统开关</h1>
      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:200px"><input class="ant-input" id="rswFilterName" placeholder="功能名称"></span>
        <span class="ant-input-affix-wrapper" style="width:240px"><input class="ant-input" id="rswFilterKey" placeholder="参数名称"></span>
        <button type="button" class="ant-btn ant-btn-primary" id="rswSearch"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
        <button type="button" class="ant-btn" id="rswReset"><i class="fa-solid fa-rotate-left"></i> 重置</button>
      </div>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-middle">
            <table style="width:100%">
              <thead class="ant-table-thead"><tr><th>序号</th><th>功能名称</th><th>参数名称</th><th>描述</th><th>状态</th></tr></thead>
              <tbody class="ant-table-tbody" id="rswTbody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="rswPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/risk-switches-page.js"></script>
</body>
</html>
