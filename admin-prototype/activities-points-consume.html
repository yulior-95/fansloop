<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>积分消耗 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="activities-points-consume">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 活动管理 / 积分消耗</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-primary ant-btn-sm" id="expCon"><i class="fa-solid fa-file-export"></i> 导出</button>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>活动运营</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">积分消耗流水</h1>
      <p class="admin-page-desc">导出、详情为<strong>弹窗</strong>。</p>
      <div class="admin-toolbar">
        <select class="ant-input" style="width:160px"><option>全部场景</option><option>商城兑换</option><option>解锁内容</option><option>直播互动</option></select>
        <button type="button" class="ant-btn ant-btn-primary" id="qCon">查询</button>
      </div>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-small">
            <table style="width:100%">
              <thead class="ant-table-thead"><tr><th>时间</th><th>UID</th><th>场景</th><th>积分</th><th>关联对象</th><th>操作</th></tr></thead>
              <tbody class="ant-table-tbody">
                <tr><td>2026-05-10 22:15</td><td>882910</td><td>商城兑换</td><td>-500</td><td>商品 SKU_009</td><td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-row">详情</button></td></tr>
                <tr><td>2026-05-09 19:02</td><td>445201</td><td>解锁付费帖</td><td>-120</td><td>内容 post_7712</td><td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-row">详情</button></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script>
(function () {
  var M = window.AdminModal;
  document.getElementById("expCon").addEventListener("click", function () {
    M.open({
      title: "导出积分消耗流水",
      body: "<p style='margin:0'>含场景、订单号、余额快照字段。</p>",
      footer: [
        { text: "取消", onClick: M.close },
        {
          text: "创建任务",
          primary: true,
          onClick: function () {
            M.close();
            M.toast("导出任务已创建（原型）");
          }
        }
      ]
    });
  });
  document.getElementById("qCon").addEventListener("click", function () {
    M.toast("已查询（原型）");
  });
  document.querySelector("main.admin-content").addEventListener("click", function (e) {
    if (!e.target.classList.contains("js-row")) return;
    M.open({
      title: "消耗流水详情",
      body: "<p style='margin:0'>幂等键、风控命中、回滚状态等（原型占位）。</p>",
      footer: [{ text: "关闭", primary: true, onClick: M.close }]
    });
  });
})();
</script>
</body>
</html>
