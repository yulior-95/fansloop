<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>广告主管理 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/ads-admin.css">
  <link rel="stylesheet" href="css/ads-admin-hifi.css">
</head>
<body data-admin-page="ads-advertisers">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 广告管理 / 广告主管理</span></div>
      <div class="admin-header-right">
        <a href="ads-advertiser-qual.html" class="ant-btn ant-btn-sm"><i class="fa-solid fa-id-badge"></i> 资质审核</a>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&h=80&fit=crop&crop=face" alt=""><span>广告运营 · Mia</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">广告主管理</h1>
      <p class="admin-page-desc">复用平台 UID，不重复建设用户体系。账户状态影响创建广告、支付与投放（见 FLAdService.canCreatePaidAd）。</p>

      <div class="admin-toolbar">
        <div class="field field-grow"><label>UID / 主体名称</label><input class="ant-input" placeholder="搜索广告主" style="width:100%"></div>
        <div class="field"><label>账户状态</label><select class="ant-input" style="width:140px"><option>全部</option><option>正常</option><option>受限</option><option>禁用</option></select></div>
        <button type="button" class="ant-btn ant-btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-small ant-table-bordered">
            <table style="width:100%">
              <thead class="ant-table-thead"><tr><th class="admin-col-index">#</th><th>UID</th><th>主体名称</th><th>账户状态</th><th>广告数</th><th>累计充值</th><th>累计消耗</th><th>违规次数</th><th style="width:180px">操作</th></tr></thead>
              <tbody class="ant-table-tbody" id="adAdvBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="adAdvPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/ad-system-store.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/ad-admin-layout.js"></script>
<script src="js/ad-admin-pages.js"></script>
</body>
</html>
