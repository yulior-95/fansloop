<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地址簿管理 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/users-address-book.css">
</head>
<body data-admin-page="users-address-book">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 用户管理 / 地址簿</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">地址簿管理</h1>
      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:140px"><input class="ant-input" id="addrFilterUid" placeholder="用户 UID"></span>
        <span class="ant-input-affix-wrapper" style="width:280px"><input class="ant-input" id="addrFilterKw" placeholder="提现地址 / 网络 / 备注"></span>
        <button type="button" class="ant-btn ant-btn-primary" id="addrQ">查询</button>
        <button type="button" class="ant-btn" id="addrReset">重置</button>
      </div>
      <div class="ant-card ant-card-bordered addr-list-card">
        <div class="ant-card-body">
          <div class="addr-table-scroll">
            <div class="ant-table ant-table-bordered ant-table-middle addr-audit-table">
              <table>
                <thead class="ant-table-thead">
                  <tr>
                    <th class="col-sticky-left">UID</th>
                    <th>网络</th>
                    <th>提现地址</th>
                    <th>备注</th>
                    <th>创建时间</th>
                    <th>最近使用</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="addrTbody" data-pager="js"></tbody>
              </table>
            </div>
          </div>
          <div id="addrPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/users-address-book-page.js"></script>
</body>
</html>
