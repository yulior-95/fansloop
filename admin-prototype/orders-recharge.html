<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>充值订单 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/orders-list.css">
</head>
<body data-admin-page="orders-recharge">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 订单管理 / 充值订单</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-primary ant-btn-sm" id="ordRchExport"><i class="fa-solid fa-file-export"></i> 导出</button>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>财务</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">充值订单</h1>
      <div class="admin-toolbar ord-filter-toolbar">
        <label class="ord-filter-item">
          <span class="ord-filter-label">用户 UID</span>
          <input class="ant-input" id="ordRchFilterUid" type="text" inputmode="numeric" placeholder="如 882910" style="width:120px">
        </label>
        <label class="ord-filter-item">
          <span class="ord-filter-label">订单号</span>
          <input class="ant-input" id="ordRchFilterOrderNo" type="text" placeholder="RCH…" style="width:160px">
        </label>
        <label class="ord-filter-item">
          <span class="ord-filter-label">订单状态</span>
          <select class="ant-input" id="ordRchFilterStatus" style="width:120px">
            <option value="">全部</option>
            <option>处理中</option>
            <option>成功</option>
            <option>失败</option>
          </select>
        </label>
        <label class="ord-filter-item">
          <span class="ord-filter-label">下单时间</span>
          <span class="ord-filter-range">
            <input class="ant-input" id="ordRchFilterOrderStart" type="datetime-local" aria-label="下单开始时间">
            <span class="ord-filter-range-sep">—</span>
            <input class="ant-input" id="ordRchFilterOrderEnd" type="datetime-local" aria-label="下单结束时间">
          </span>
        </label>
        <label class="ord-filter-item">
          <span class="ord-filter-label">完成时间</span>
          <span class="ord-filter-range">
            <input class="ant-input" id="ordRchFilterFinishStart" type="datetime-local" aria-label="完成开始时间">
            <span class="ord-filter-range-sep">—</span>
            <input class="ant-input" id="ordRchFilterFinishEnd" type="datetime-local" aria-label="完成结束时间">
          </span>
        </label>
        <span class="ord-filter-actions">
          <button type="button" class="ant-btn ant-btn-primary" id="ordRchQuery">查询</button>
          <button type="button" class="ant-btn" id="ordRchReset">重置</button>
        </span>
      </div>
      <div class="ant-card ant-card-bordered ord-list-card">
        <div class="ant-card-body">
          <div class="ord-table-scroll">
            <div class="ant-table ant-table-bordered ant-table-middle ord-audit-table">
              <table>
                <thead class="ant-table-thead">
                  <tr>
                    <th class="col-sticky-left">序号</th>
                    <th class="col-sticky-left-2">用户UID</th>
                    <th>汇率</th>
                    <th>下单数量(个)</th>
                    <th>下单金额(CNY)</th>
                    <th>手续费</th>
                    <th>实际成交数量</th>
                    <th>实际成交金额(CNY)</th>
                    <th>订单号</th>
                    <th>交易哈希</th>
                    <th>操作设备</th>
                    <th>交易IP</th>
                    <th>地区</th>
                    <th>下单时间</th>
                    <th>完成时间</th>
                    <th>订单状态</th>
                    <th>错误描述</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="ordRchTbody" data-pager="js"></tbody>
                <tfoot id="ordRchTfoot"></tfoot>
              </table>
            </div>
          </div>
          <div id="ordRchPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/orders-recharge-page.js"></script>
</body>
</html>
