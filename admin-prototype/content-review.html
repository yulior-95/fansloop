<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容审核 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/content-review.css">
</head>
<body data-admin-page="content-review">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 内容管理 / 内容审核</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>审核员</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">内容审核</h1>

      <div class="cr-toolbar">
        <div class="cr-field">
          <label for="crFilterStatus">状态</label>
          <select class="ant-input" id="crFilterStatus" style="width:130px">
            <option value="">全部</option>
            <option value="machine_review">机审中</option>
            <option value="manual_review">人工审核</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option>
          </select>
        </div>
        <div class="cr-field">
          <label for="crFilterType">类型</label>
          <select class="ant-input" id="crFilterType" style="width:120px">
            <option value="">全部</option>
            <option value="图文">图文</option>
            <option value="视频">视频</option>
            <option value="纯文字">纯文字</option>
          </select>
        </div>
        <div class="cr-field">
          <label>提交时间</label>
          <input type="date" class="ant-input" id="crSubmitStart" style="width:140px" aria-label="提交开始日期">
          <span style="color:rgba(0,0,0,.35)">—</span>
          <input type="date" class="ant-input" id="crSubmitEnd" style="width:140px" aria-label="提交结束日期">
        </div>
        <div class="cr-field">
          <label>审核时间</label>
          <input type="date" class="ant-input" id="crAuditStart" style="width:140px" aria-label="审核开始日期">
          <span style="color:rgba(0,0,0,.35)">—</span>
          <input type="date" class="ant-input" id="crAuditEnd" style="width:140px" aria-label="审核结束日期">
        </div>
        <button type="button" class="ant-btn ant-btn-primary" id="btnCrFilter">查询</button>
        <button type="button" class="ant-btn" id="btnCrReset">重置</button>
      </div>

      <div class="ant-card ant-card-bordered">
        <div class="cr-card-tabs" role="tablist">
          <button type="button" role="tab" data-cr-tab="manual" class="active">
            人工审核<span class="cr-tab-badge" id="crManualBadge">0</span>
          </button>
          <button type="button" role="tab" data-cr-tab="all">全部</button>
        </div>
        <div class="ant-card-body" style="padding-top:0">
          <div class="cr-table-wrap">
            <table class="ant-table ant-table-bordered ant-table-small cr-audit-table" style="width:100%">
              <thead class="ant-table-thead">
                <tr>
                  <th class="col-sticky-left-1" style="width:52px">序号</th>
                  <th style="width:150px">标题</th>
                  <th style="width:200px">内容</th>
                  <th style="width:80px">类型</th>
                  <th style="width:100px">审核进度</th>
                  <th style="width:168px">提交时间</th>
                  <th style="width:88px">提交用户UID</th>
                  <th style="width:110px">提交用户昵称</th>
                  <th style="width:168px">审核更新时间</th>
                  <th style="width:100px">最后审核人</th>
                  <th class="col-sticky-right" style="width:120px">操作</th>
                </tr>
              </thead>
              <tbody class="ant-table-tbody" id="crTableBody"></tbody>
            </table>
          </div>
          <div class="cr-empty" id="crTableEmpty" hidden>暂无符合条件的审核记录</div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/content-review-page.js"></script>
</body>
</html>
