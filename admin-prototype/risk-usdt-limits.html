<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>充提限额 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="risk-usdt-limits">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 风控安全 / 充提限额</span></div>
      <div class="admin-header-right">
        <a href="settings-global.html" class="ant-btn ant-btn-sm"><i class="fa-solid fa-sliders"></i> 参数总览</a>
        <a href="orders-recharge.html" class="ant-btn ant-btn-sm"><i class="fa-solid fa-arrow-down"></i> 充值订单</a>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>风控</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">USDT 充提限额</h1>
      <p class="admin-page-desc">
        链上资产充值 / 提现的单笔与单日累计上限，与<strong>积分风控</strong>（虚拟积分额度、冷静期）分域管理。
        映射 <code>PUT /api/v1/admin/asset-limits</code>；订单侧见 <a href="orders-recharge.html">充值订单</a>、<a href="orders-withdraw.html">提现订单</a>。
      </p>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-head"><div class="ant-card-head-title">充值 / 提现（USDT）</div></div>
        <div class="ant-card-body">
          <div class="ant-row" style="max-width:900px">
            <div class="ant-col ant-col-12" style="padding:8px">
              <div class="ant-form-item"><label>单日单笔最高充值（USDT）</label><input class="ant-input" type="number" value="10000" style="width:100%;margin-top:6px"></div>
              <div class="ant-form-item"><label>单日累计最高充值（USDT）</label><input class="ant-input" type="number" value="50000" style="width:100%;margin-top:6px"></div>
            </div>
            <div class="ant-col ant-col-12" style="padding:8px">
              <div class="ant-form-item"><label>单日单笔最高提现（USDT）</label><input class="ant-input" type="number" value="10000" style="width:100%;margin-top:6px"></div>
              <div class="ant-form-item"><label>单日累计最高提现（USDT）</label><input class="ant-input" type="number" value="50000" style="width:100%;margin-top:6px"></div>
            </div>
          </div>
          <button type="button" class="ant-btn ant-btn-primary" id="btnLimSave">保存充提限额</button>
        </div>
      </div>

      <div class="ant-card ant-card-bordered" style="margin-top:16px">
        <div class="ant-card-head"><div class="ant-card-head-title"><i class="fa-solid fa-clock-rotate-left" style="margin-right:8px;color:#1890ff"></i>大额提现冷静期</div></div>
        <div class="ant-card-body">
          <p style="margin:0 0 16px;color:rgba(0,0,0,.55);font-size:13px;line-height:1.6">
            平台级策略，由运营后台统一配置，<strong>用户端不可自行开关</strong>。单笔提现达到阈值后延迟到账，期间用户可在 C 端撤销。
          </p>
          <div class="ant-row" style="max-width:900px">
            <div class="ant-col ant-col-8" style="padding:8px">
              <div class="ant-form-item">
                <label><input type="checkbox" checked style="margin-right:6px">启用大额提现冷静期</label>
              </div>
            </div>
            <div class="ant-col ant-col-8" style="padding:8px">
              <div class="ant-form-item"><label>触发阈值（USDT）</label><input class="ant-input" type="number" value="5000" style="width:100%;margin-top:6px"></div>
            </div>
            <div class="ant-col ant-col-8" style="padding:8px">
              <div class="ant-form-item"><label>延迟到账（小时）</label><input class="ant-input" type="number" value="24" style="width:100%;margin-top:6px"></div>
            </div>
          </div>
          <button type="button" class="ant-btn ant-btn-primary" id="btnCoolingSave">保存冷静期策略</button>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script>
(function () {
  var M = window.AdminModal;
  document.getElementById("btnLimSave").addEventListener("click", function () {
    M.confirmGoogle({
      title: "保存充提限额",
      message: "将影响全站 USDT 充提风控判定。请输入谷歌验证码确认保存。",
      onVerified: function () {
        M.toast("充提限额已保存（原型）");
      }
    });
  });
  document.getElementById("btnCoolingSave").addEventListener("click", function () {
    M.confirmGoogle({
      title: "保存大额提现冷静期",
      message: "将更新全站大额提现延迟到账规则，用户端不可自行修改。请输入谷歌验证码确认保存。",
      onVerified: function () {
        M.toast("大额提现冷静期已保存（原型）");
      }
    });
  });
})();
</script>
</body>
</html>
