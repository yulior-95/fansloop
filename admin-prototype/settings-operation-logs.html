<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>操作日志 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/settings-rbac.css">
</head>
<body data-admin-page="settings-operation-logs">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 系统设置 / 操作日志</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-sm" id="btnLogExport"><i class="fa-solid fa-file-export"></i> 导出</button>
        <div class="admin-header-user">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt="">
          <span>超级管理员</span>
        </div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">操作日志</h1>
      <div class="admin-toolbar admin-log-filter-row">
        <span class="ant-input-affix-wrapper" style="width:160px"><input class="ant-input" type="text" placeholder="操作人账号"></span>
        <select id="logFilterModule" class="ant-input-like" style="width:160px">
          <option value="">全部一级模块</option>
          <option value="用户管理">用户管理</option>
          <option value="订单管理">订单管理</option>
          <option value="风控中心">风控中心</option>
          <option value="系统设置">系统设置</option>
          <option value="登录">登录</option>
        </select>
        <select id="logFilterResult" class="ant-input-like" style="width:120px">
          <option value="">全部结果</option>
          <option value="success">成功</option>
          <option value="fail">失败</option>
        </select>
        <input type="datetime-local" class="ant-input" style="width:200px">
        <span style="opacity:.5">—</span>
        <input type="datetime-local" class="ant-input" style="width:200px">
        <button type="button" class="ant-btn ant-btn-primary" id="btnLogQuery">查询</button>
      </div>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-small ant-table-bordered">
            <table style="width:100%">
              <thead class="ant-table-thead">
                <tr>
                  <th class="admin-col-index">序号</th>
                  <th>时间</th>
                  <th>操作人</th>
                  <th>一级模块</th>
                  <th>二级模块</th>
                  <th>功能操作</th>
                  <th>对象</th>
                  <th>IP</th>
                  <th>结果</th>
                  <th style="width:72px">操作</th>
                </tr>
              </thead>
              <tbody class="ant-table-tbody" id="logsTableBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="logsPager"></div>
          <div style="margin-top:16px;text-align:right;color:rgba(0,0,0,.45);font-size:12px">共记录后台敏感操作，保留 180 天 · 支持按模块与结果筛选</div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/settings-rbac.js"></script>
<script src="js/settings-operation-logs-page.js"></script>
</body>
</html>
