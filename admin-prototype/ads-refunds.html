<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../js/force-http-preview.js"></script>

<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>退款管理 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/ads-admin.css">
  <link rel="stylesheet" href="css/ads-admin-hifi.css">
</head>
<body data-admin-page="ads-refunds">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
<div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 广告管理 / 退款管理</span></div>
      <div class="admin-header-right">
        <select class="ant-input ant-input-sm ad-header-role" id="adAdminRole"><option value="finance">财务</option><option value="super">超管</option><option value="operator">运营</option></select>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=80&h=80&fit=crop&crop=face" alt=""><span>财务 · Wang</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">退款管理</h1>
      <p class="admin-page-desc">用户申请进入待审；财务通过后按套餐剩余天数解冻退回。运营角色默认无退款权限。</p>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-small ant-table-bordered">
            <table style="width:100%">
              <thead class="ant-table-thead"><tr><th>退款单</th><th>订单</th><th>UID</th><th>金额</th><th>状态</th><th>申请理由</th><th>申请时间</th><th>操作</th></tr></thead>
              <tbody class="ant-table-tbody" id="adRfBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="adRfPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/ad-system-store.js"></script>
<script src="../js/ad-system-api.js"></script>
<script src="js/admin-nav.js?v=20261104c"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/ad-admin-layout.js"></script>
<script src="js/ad-admin-actions.js"></script>
<script src="js/ad-admin-pages.js"></script>
</body>
</html>
