<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数字商品管理 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="mall-digital-products">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 双商城 / 数字商品管理</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">数字商品管理</h1>
            <div style="margin-bottom:12px"><select class="ant-input" id="mallProductStatus" style="width:160px"><option value="">全部状态</option><option value="pending_review">待审核</option><option value="listed">已上架</option><option value="sold_out">已售罄</option><option value="rejected">已驳回</option><option value="delisted">已下架</option><option value="draft">草稿</option></select></div>
      <div class="ant-card ant-card-bordered"><div class="ant-card-body" style="padding-top:0"><div class="ant-table ant-table-bordered ant-table-middle"><table style="width:100%"><thead class="ant-table-thead"><tr><th>#</th><th>标题</th><th>创作者</th><th>类型</th><th>价格</th><th>商品个数</th><th>状态</th><th>操作</th></tr></thead><tbody id="mallProductsBody"></tbody></table></div></div></div>
    </main>
  </div>
</div>
<script src="../js-web/mall-commerce-config-store.js"></script>
<script src="../js-web/digital-assets-store.js"></script>
<script src="../js-web/digital-asset-orders-store.js"></script>
<script src="../js-web/affiliate-catalog-store.js"></script>
<script src="../js-web/affiliate-showcase-store.js"></script>
<script src="../js-web/creator-income-split-config.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/mall-admin-pages.js"></script>
</body>
</html>
