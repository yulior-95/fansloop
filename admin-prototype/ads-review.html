<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>广告审核 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/ads-admin.css">
  <link rel="stylesheet" href="css/ads-admin-hifi.css">
</head>
<body data-admin-page="ads-review">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 广告管理 / 广告审核</span></div>
      <div class="admin-header-right">
        <a href="ads-list.html" class="ant-btn ant-btn-sm"><i class="fa-solid fa-list"></i> 全部广告</a>
        <select class="ant-input ant-input-sm ad-header-role" id="adAdminRole"><option value="reviewer">审核员</option><option value="operator">运营</option><option value="super">超管</option></select>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&h=80&fit=crop&crop=face" alt=""><span>审核 · Chen</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">广告审核</h1>
      <p class="admin-page-desc">待审核队列；拒绝须填写原因。审核通过与投放、支付状态独立，用户广告需支付成功后方可进入投放调度。</p>

      <div class="ad-review-banner">
        <i class="fa-solid fa-circle-info"></i>
        <div>
          <strong>审核 SLA（演示）</strong>
          <p style="margin:4px 0 0;font-size:13px;color:rgba(0,0,0,.65)">工作时间内 4 小时内处理；素材变更会触发内容版本复审（见需求文档状态机）。</p>
        </div>
      </div>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-small ant-table-bordered">
            <table style="width:100%">
              <thead class="ant-table-thead"><tr><th class="admin-col-index">#</th><th>编号</th><th>名称 / 素材</th><th>UID</th><th>来源</th><th>类型</th><th>广告位</th><th>预算</th><th>支付</th><th>审核</th><th>投放</th><th>创建</th><th style="width:160px">操作</th></tr></thead>
              <tbody class="ant-table-tbody" id="adReviewBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="adReviewPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/ad-system-store.js"></script>
<script src="../js/ad-system-api.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/ad-admin-layout.js"></script>
<script src="js/ad-admin-actions.js"></script>
<script src="js/ad-admin-pages.js"></script>
</body>
</html>
