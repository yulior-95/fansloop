<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统公告 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="system-announcements">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 系统消息 / 公告管理</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-primary ant-btn-sm" id="btnAnnNew"><i class="fa-solid fa-plus"></i> 新建公告</button>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">公告管理</h1>
      <p class="admin-page-desc">新建、编辑、下线、预览均为<strong>弹窗</strong>。</p>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-middle">
            <table style="width:100%">
              <thead class="ant-table-thead"><tr><th>标题</th><th>渠道</th><th>优先级</th><th>生效时间</th><th>状态</th><th>操作</th></tr></thead>
              <tbody class="ant-table-tbody">
                <tr data-title="五一活动积分加倍"><td>五一活动积分加倍</td><td>全端</td><td><span class="ant-tag ant-tag-red">P0</span></td><td>2026-04-28 ~ 2026-05-05</td><td><span class="ant-tag ant-tag-green">已发布</span></td><td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-ann-edit">编辑</button><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-ann-off">下线</button></td></tr>
                <tr data-title="钱包维护通知"><td>钱包维护通知</td><td>Web</td><td><span class="ant-tag ant-tag-orange">P1</span></td><td>2026-05-12 02:00 起</td><td><span class="ant-tag ant-tag-blue">定时</span></td><td><button type="button" class="ant-btn ant-btn-link ant-btn-sm js-ann-preview">预览</button></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script>
(function () {
  var M = window.AdminModal;
  function editor(title) {
    return (
      "<label style='display:block;margin-bottom:6px'>标题</label><input class='ant-input' style='width:100%;margin-bottom:12px' value='" +
      M.esc(title || "") +
      "'>" +
      "<label style='display:block;margin-bottom:6px'>正文（Markdown）</label><textarea class='ant-input' rows='6' style='width:100%;resize:vertical'>活动规则说明…</textarea>"
    );
  }
  document.getElementById("btnAnnNew").addEventListener("click", function () {
    M.open({
      title: "新建公告",
      wide: true,
      body: editor(""),
      footer: [
        { text: "取消", onClick: M.close },
        {
          text: "保存草稿",
          onClick: function () {
            M.close();
            M.toast("草稿已保存（原型）");
          }
        },
        {
          text: "发布",
          primary: true,
          onClick: function () {
            M.close();
            M.toast("公告已发布（原型）");
          }
        }
      ]
    });
  });
  document.querySelector("main.admin-content").addEventListener("click", function (e) {
    var t = e.target;
    var tr = t.closest("tr");
    if (t.classList.contains("js-ann-edit") && tr) {
      M.open({
        title: "编辑公告",
        wide: true,
        body: editor(tr.getAttribute("data-title")),
        footer: [
          { text: "取消", onClick: M.close },
          {
            text: "保存",
            primary: true,
            onClick: function () {
              M.close();
              M.toast("公告已更新（原型）");
            }
          }
        ]
      });
    }
    if (t.classList.contains("js-ann-off")) {
      M.open({
        title: "下线公告",
        body: "<p style='margin:0'>下线后用户端将不再展示该条，是否继续？</p>",
        footer: [
          { text: "取消", onClick: M.close },
          {
            text: "确认下线",
            danger: true,
            onClick: function () {
              M.close();
              M.toast("已下线（原型）");
            }
          }
        ]
      });
    }
    if (t.classList.contains("js-ann-preview")) {
      M.open({
        title: "公告预览 · 钱包维护通知",
        wide: true,
        body: "<div style='padding:16px;background:#f5f5f5;border-radius:8px;border:1px solid #eee'><h3 style='margin:0 0 8px'>系统维护</h3><p style='margin:0;color:#666'>2026-05-12 02:00 起钱包模块升级，预计 30 分钟。</p></div>",
        footer: [{ text: "关闭", primary: true, onClick: M.close }]
      });
    }
  });
})();
</script>
</body>
</html>
