<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统公告 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/system-announcements.css">
</head>
<body data-admin-page="system-announcements">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 系统消息 / 公告管理</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-primary ant-btn-sm" id="btnAnnNew"><i class="fa-solid fa-plus"></i> 新建公告</button>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">公告管理</h1>
      <div class="ant-card ant-card-bordered">
        <div class="ann-card-tabs" role="tablist">
          <button type="button" role="tab" data-ann-tab="draft" class="active">发送申请</button>
          <button type="button" role="tab" data-ann-tab="audit">发送审核</button>
        </div>
        <div class="ant-card-body" style="padding-top:0">
          <div id="annDraftPanel">
            <div class="ann-table-wrap">
              <table class="ant-table ant-table-bordered ant-table-small ann-audit-table" style="width:100%">
                <thead class="ant-table-thead">
                  <tr>
                    <th class="col-sticky-left-1" style="width:52px">序号</th>
                    <th style="width:100px">发布账号</th>
                    <th style="width:90px">渠道</th>
                    <th style="width:90px">发送对象</th>
                    <th style="width:120px">用户ID</th>
                    <th style="width:88px">消息类型</th>
                    <th style="width:160px">内容</th>
                    <th style="width:80px">创建人</th>
                    <th style="width:168px">添加时间</th>
                    <th style="width:168px">更新时间</th>
                    <th style="width:80px">修改人</th>
                    <th style="width:72px">状态</th>
                    <th class="col-sticky-right" style="width:140px">操作</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="annDraftBody" data-pager="js"></tbody>
              </table>
            </div>
            <div class="ann-empty" id="annDraftEmpty" hidden>暂无发送申请记录</div>
          </div>
          <div id="annAuditPanel" hidden>
            <div class="ann-table-wrap">
              <table class="ant-table ant-table-bordered ant-table-small ann-audit-table" style="width:100%">
                <thead class="ant-table-thead">
                  <tr>
                    <th class="col-sticky-left-1" style="width:52px">序号</th>
                    <th style="width:100px">发布账号</th>
                    <th style="width:90px">渠道</th>
                    <th style="width:90px">发送对象</th>
                    <th style="width:120px">用户ID</th>
                    <th style="width:88px">消息类型</th>
                    <th style="width:160px">内容</th>
                    <th style="width:80px">创建人</th>
                    <th style="width:168px">创建时间</th>
                    <th style="width:168px">提交时间</th>
                    <th style="width:80px">审核人</th>
                    <th style="width:168px">审核时间</th>
                    <th style="width:72px">状态</th>
                    <th class="col-sticky-right" style="width:88px">操作</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="annAuditBody" data-pager="js"></tbody>
              </table>
            </div>
            <div class="ann-empty" id="annAuditEmpty" hidden>暂无发送审核记录</div>
          </div>
          <div id="annPager" class="admin-pager-mount"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/system-announcements-page.js"></script>
</body>
</html>
