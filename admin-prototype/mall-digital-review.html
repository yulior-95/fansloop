<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="mall-digital-review">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 双商城 / 数字商品审核</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">数字商品审核</h1>
            <div class="ant-card ant-card-bordered" style="margin-bottom:16px"><div class="ant-card-body" style="font-size:13px;color:rgba(0,0,0,.55)"><i class="fa-solid fa-circle-info" style="color:#1677ff;margin-right:6px"></i>审核创作者上传的图片合集 / 视频作品（数字商品，非内容流 PPV）。通过后上架 Creator Store；驳回须填写原因，创作者端可见。数字商品无物流审核项。</div></div>
      <div class="ant-card ant-card-bordered"><div class="ant-card-body" style="padding-top:0"><div class="ant-table ant-table-bordered ant-table-middle"><table style="width:100%"><thead class="ant-table-thead"><tr><th style="width:52px">#</th><th style="width:70px">首图</th><th>商品</th><th style="width:120px">创作者</th><th style="width:110px">价格</th><th style="width:150px">商品个数</th><th style="width:110px">通过后</th><th style="width:150px">提交时间</th><th style="width:160px">操作</th></tr></thead><tbody id="mallReviewBody"></tbody></table></div></div></div>
    </main>
  </div>
</div>
