<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数字商品审核 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
</head>
<body data-admin-page="mall-digital-review">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 双商城 / 数字商品审核</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">数字商品审核</h1>
      <div class="ant-space ant-space-horizontal" style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">
        <input class="ant-input" id="mallReviewQ" placeholder="搜索商品 ID / 标题 / 创作者" style="width:280px">
      </div>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-middle ant-table-scroll">
            <table style="width:100%">
              <thead class="ant-table-thead">
                <tr>
                  <th style="width:48px">#</th>
                  <th style="width:150px">商品 ID</th>
                  <th style="width:70px">首图</th>
                  <th>商品</th>
                  <th style="width:110px">创作者</th>
                  <th style="width:90px">价格</th>
                  <th style="width:80px">总量</th>
                  <th style="width:70px">已售</th>
                  <th style="width:70px">剩余</th>
                  <th style="width:80px">通过后</th>
                  <th style="width:140px">提交时间</th>
                  <th style="width:100px">操作</th>
                </tr>
              </thead>
              <tbody id="mallReviewBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js-web/mall-commerce-config-store.js"></script>
<script src="../js-web/digital-assets-store.js"></script>
<script src="../js-web/digital-asset-orders-store.js"></script>
<script src="../js-web/affiliate-catalog-store.js"></script>
<script src="../js-web/affiliate-showcase-store.js"></script>
<script src="../js-web/creator-income-split-config.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/mall-admin-pages.js"></script>
</body>
</html>
