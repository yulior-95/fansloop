<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成员账号 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/settings-rbac.css">
</head>
<body data-admin-page="settings-members">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 系统设置 / 成员账号</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-primary ant-btn-sm" id="btnNewMember"><i class="fa-solid fa-user-plus"></i> 新建成员</button>
        <div class="admin-header-user">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt="">
          <span>超级管理员</span>
        </div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">成员账号</h1>
      <div class="admin-alert-google"><i class="fa-brands fa-google" style="margin-top:2px"></i><div><strong>谷歌验证</strong>：新建成员自动分配 TOTP 密钥；编辑、禁用及敏感保存前须输入谷歌验证码（6 位）。创建成员无需邮件邀请，直接生效。</div></div>
      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:180px"><input class="ant-input" type="text" id="memFilterKeyword" placeholder="账号 / 显示名称"></span>
        <span class="ant-input-affix-wrapper" style="width:200px"><input class="ant-input" type="text" id="memFilterEmail" placeholder="邮箱（选填）"></span>
        <select id="memFilterRole" class="ant-input-like" style="width:160px;height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 8px">
          <option value="">全部角色</option>
          <option value="ROLE_OPS">运营</option>
          <option value="ROLE_RISK">风控</option>
          <option value="ROLE_ROOT">超级管理员</option>
        </select>
        <select id="memFilterStatus" class="ant-input-like" style="width:140px;height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 8px">
          <option value="">全部状态</option>
          <option value="enabled">启用</option>
          <option value="disabled">禁用</option>
        </select>
        <button type="button" class="ant-btn ant-btn-primary" id="btnQueryMembers">查询</button>
        <button type="button" class="ant-btn" id="btnResetMembers">重置</button>
        <div class="admin-toolbar-spacer"></div>
      </div>
      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-bordered ant-table-middle">
            <table style="width:100%">
              <thead class="ant-table-thead">
                <tr>
                  <th class="admin-col-index">序号</th>
                  <th>成员</th>
                  <th>账号</th>
                  <th>邮箱</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>绑定 IP</th>
                  <th>最近登录</th>
                  <th style="width:220px">操作</th>
                </tr>
              </thead>
              <tbody class="ant-table-tbody" id="membersTableBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="membersPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-session.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/settings-rbac.js"></script>
<script src="js/settings-members-page.js"></script>
</body>
</html>
