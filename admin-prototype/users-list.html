<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户列表 · FansLoop 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <style>
    [data-admin-page="users-list"] .admin-content { padding-left: 0; padding-right: 0; }
    [data-admin-page="users-list"] .admin-page-title,
    [data-admin-page="users-list"] .admin-toolbar { padding-left: 20px; padding-right: 20px; }
    [data-admin-page="users-list"] .users-list-card { border-left: none; border-right: none; border-radius: 0; }
    [data-admin-page="users-list"] .users-list-card > .ant-card-body { padding: 0; }
    .admin-users-table-scroll { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; }
    .admin-users-table { font-size: 13px; }
    .admin-users-table table { width: 100%; min-width: 1280px; border-collapse: separate; border-spacing: 0; }
    .admin-users-table th,
    .admin-users-table td { white-space: nowrap; padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .admin-users-table thead th { background: #fafafa; font-weight: 500; }
    .admin-users-table .col-wrap { white-space: normal; max-width: 160px; }
    .admin-users-table .col-sticky-left-1 { position: sticky; left: 0; z-index: 2; min-width: 92px; border-right: 1px solid #f0f0f0; }
    .admin-users-table .col-sticky-left-2 { position: sticky; left: 92px; z-index: 2; min-width: 120px; border-right: 1px solid #f0f0f0; box-shadow: 4px 0 6px -2px rgba(0,0,0,.08); }
    .admin-users-table .col-sticky-right { position: sticky; right: 0; z-index: 2; min-width: 148px; border-left: 1px solid #f0f0f0; box-shadow: -4px 0 6px -2px rgba(0,0,0,.08); }
    .admin-users-table thead .col-sticky-left-1,
    .admin-users-table thead .col-sticky-left-2,
    .admin-users-table thead .col-sticky-right { z-index: 3; background: #fafafa; }
    .fl-inv-stat-link:hover > div { border-color: #91caff; box-shadow: 0 2px 8px rgba(22,119,255,.12); }
  </style>
</head>
<body data-admin-page="users-list">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 用户管理 / 用户列表</span></div>
      <div class="admin-header-right">
        <div class="admin-header-user">
          <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt="">
          <span>运营 · 王一</span>
        </div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">用户列表</h1>
      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:180px"><input class="ant-input" id="filterKeyword" placeholder="UID / 昵称"></span>
        <span class="ant-input-affix-wrapper" style="width:200px"><input class="ant-input" id="filterEmail" placeholder="邮箱地址"></span>
        <span class="ant-input-affix-wrapper" style="width:220px"><input class="ant-input" id="filterWallet" placeholder="钱包地址"></span>
        <select class="ant-input" id="filterAccountStatus" style="width:130px">
          <option value="">全部账号状态</option>
          <option value="正常">正常</option>
          <option value="禁用">禁用</option>
        </select>
        <select class="ant-input" id="filterKycStatus" style="width:130px">
          <option value="">全部 KYC 状态</option>
          <option value="已认证">已认证</option>
          <option value="尚未认证">尚未认证</option>
        </select>
        <button type="button" class="ant-btn ant-btn-primary" id="btnQueryUsers">查询</button>
        <button type="button" class="ant-btn" id="btnResetUsers">重置</button>
        <div class="admin-toolbar-spacer"></div>
      </div>
      <div class="ant-card ant-card-bordered users-list-card">
        <div class="ant-card-body">
          <div class="ant-table ant-table-bordered ant-table-middle admin-users-table">
            <div class="admin-users-table-scroll">
              <table>
                <thead class="ant-table-thead">
                  <tr>
                    <th class="col-sticky-left-1">UID</th>
                    <th class="col-sticky-left-2">用户昵称</th>
                    <th>用户名</th>
                    <th>邮箱地址</th>
                    <th>KYC 审核状态</th>
                    <th>邀请码</th>
                    <th>更新时间</th>
                    <th>注册时间</th>
                    <th>注册地</th>
                    <th>注册 IP</th>
                    <th>账号状态</th>
                    <th>钱包状态</th>
                    <th class="col-sticky-right">操作</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="usersTableBody" data-pager="js"></tbody>
              </table>
            </div>
          </div>
          <div id="usersPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/invite-data-store.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/users-list-page.js"></script>
<script src="js/admin-uid-link.js"></script>
</body>
</html>
