<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>套餐配置 · 广告管理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/ads-admin.css">
  <link rel="stylesheet" href="css/ads-admin-hifi.css">
</head>
<body data-admin-page="ads-packages">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 广告管理 / 套餐配置</span></div>
      <div class="admin-header-right">
        <select class="ant-input ant-input-sm ad-header-role" id="adAdminRole" title="改价需超管"><option value="operator">运营</option><option value="finance">财务</option><option value="super">超管</option></select>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=80&h=80&fit=crop&crop=face" alt=""><span>产品 · Leo</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">固定套餐配置</h1>
      <p class="admin-page-desc">改价写入操作日志；历史订单保留 <code>priceSnapshot</code>，不受新价影响。可售开关控制 C 端套餐列表展示。</p>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-small ant-table-bordered">
            <table style="width:100%">
              <thead class="ant-table-thead"><tr><th>套餐 ID</th><th>广告位</th><th>名称</th><th>周期</th><th>价格 USDT</th><th>可售</th><th>操作</th></tr></thead>
              <tbody class="ant-table-tbody" id="adPkgBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="adPkgPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/ad-system-store.js"></script>
<script src="../js/ad-system-api.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/ad-admin-layout.js"></script>
<script src="js/ad-admin-actions.js"></script>
<script src="js/ad-admin-pages.js"></script>
</body>
</html>
