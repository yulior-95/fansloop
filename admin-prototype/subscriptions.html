<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订阅管理 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/subscriptions.css">
</head>
<body data-admin-page="subscriptions">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 订阅管理</span></div>
      <div class="admin-header-right">
        <button type="button" class="ant-btn ant-btn-primary ant-btn-sm" id="subExp"><i class="fa-solid fa-file-export"></i> 导出</button>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>会员运营</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">订阅记录</h1>
      <div class="admin-toolbar ord-filter-toolbar">
        <label class="ord-filter-item">
          <span class="ord-filter-label">用户 UID</span>
          <input class="ant-input" id="subFilterUserUid" type="text" inputmode="numeric" placeholder="如 882910" style="width:120px">
        </label>
        <label class="ord-filter-item">
          <span class="ord-filter-label">创作者 UID</span>
          <input class="ant-input" id="subFilterCreatorUid" type="text" inputmode="numeric" placeholder="如 440012" style="width:120px">
        </label>
        <label class="ord-filter-item">
          <span class="ord-filter-label">状态</span>
          <select class="ant-input" id="subFilterStatus" style="width:120px">
            <option value="">全部</option>
            <option>生效中</option>
            <option>已过期</option>
            <option>已取消</option>
          </select>
        </label>
        <label class="ord-filter-item">
          <span class="ord-filter-label">剩余天数</span>
          <span class="ord-filter-range">
            <input class="ant-input" id="subFilterRemainMin" type="number" min="0" placeholder="最小" style="width:72px" aria-label="剩余天数最小值">
            <span class="ord-filter-range-sep">—</span>
            <input class="ant-input" id="subFilterRemainMax" type="number" min="0" placeholder="最大" style="width:72px" aria-label="剩余天数最大值">
          </span>
        </label>
        <span class="ord-filter-actions">
          <button type="button" class="ant-btn ant-btn-primary" id="subQ">查询</button>
          <button type="button" class="ant-btn" id="subReset">重置</button>
        </span>
      </div>
      <div class="ant-card ant-card-bordered sub-list-card">
        <div class="ant-card-body">
          <div class="ord-table-scroll">
            <div class="ant-table ant-table-bordered ant-table-middle sub-audit-table">
              <table>
                <thead class="ant-table-thead">
                  <tr>
                    <th class="col-sticky-left">序号</th>
                    <th>用户UID</th>
                    <th>用户昵称</th>
                    <th>创作者UID</th>
                    <th>创作者昵称</th>
                    <th>套餐</th>
                    <th>订阅时间</th>
                    <th>结束时间</th>
                    <th>剩余天数</th>
                    <th>是否开启自动续约</th>
                    <th>订单号</th>
                    <th class="col-remark">备注</th>
                    <th class="col-actions">操作</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="subTbody" data-pager="js"></tbody>
              </table>
            </div>
          </div>
          <div id="subPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/subscriptions-page.js"></script>
</body>
</html>
