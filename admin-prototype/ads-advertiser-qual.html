<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>广告主资质审核 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <link rel="stylesheet" href="css/ads-admin.css">
  <link rel="stylesheet" href="css/ads-admin-hifi.css">
</head>
<body data-admin-page="ads-advertiser-qual">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 广告管理 / 资质审核</span></div>
      <div class="admin-header-right">
        <a href="ads-advertisers.html" class="ant-btn ant-btn-sm"><i class="fa-solid fa-user-tag"></i> 广告主列表</a>
        <div class="admin-header-user"><img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&h=80&fit=crop&crop=face" alt=""><span>审核 · Chen</span></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">广告主资质审核</h1>
      <p class="admin-page-desc">用户端提交主体与联系信息后进入待审核；通过后 accountStatus = approved，方可创建付费广告。</p>

      <div class="ant-card ant-card-bordered">
        <div class="ant-card-body" style="padding-top:0">
          <div class="ant-table ant-table-small ant-table-bordered">
            <table style="width:100%">
              <thead class="ant-table-thead"><tr><th>UID</th><th>主体名称</th><th>联系方式</th><th>状态</th><th>申请时间</th><th style="width:140px">操作</th></tr></thead>
              <tbody class="ant-table-tbody" id="advQualBody" data-pager="js"></tbody>
            </table>
          </div>
          <div id="advQualPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/ad-system-store.js"></script>
<script src="../js/ad-system-api.js"></script>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/admin-pagination.js"></script>
<script src="js/ad-admin-layout.js"></script>
<script src="js/ad-admin-pages.js"></script>
</body>
</html>
