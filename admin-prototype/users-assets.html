<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户资产 · GOODFANS 运营后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@4.24.15/dist/antd.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="stylesheet" href="css/admin-modals.css">
  <style>
    [data-admin-page="users-assets"] .admin-content { padding-left: 0; padding-right: 0; }
    [data-admin-page="users-assets"] .admin-page-title,
    [data-admin-page="users-assets"] .admin-toolbar { padding-left: 20px; padding-right: 20px; }
    [data-admin-page="users-assets"] .users-assets-card { border-left: none; border-right: none; border-radius: 0; }
    [data-admin-page="users-assets"] .users-assets-card > .ant-card-body { padding: 0; }
    .admin-assets-table-scroll { overflow-x: auto; width: 100%; }
    .admin-assets-table { font-size: 13px; }
    .admin-assets-table table { width: 100%; min-width: 960px; border-collapse: separate; border-spacing: 0; }
    .admin-assets-table th,
    .admin-assets-table td { white-space: nowrap; padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .admin-assets-table thead th { background: #fafafa; font-weight: 500; }
    .admin-assets-table td[rowspan] { background: #fff; border-right: 1px solid #f0f0f0; }
  </style>
</head>
<body data-admin-page="users-assets">
<div class="admin-app">
  <aside class="admin-sider" id="adminSider"></aside>
  <div class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left"><i class="fa-solid fa-bars" style="opacity:.45"></i><span>/ 用户管理 / 用户资产</span></div>
      <div class="admin-header-right"><div class="admin-header-user"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop&crop=face" alt=""><span>运营 · 王一</span></div></div>
    </header>
    <main class="admin-content">
      <h1 class="admin-page-title">用户资产</h1>
      <div class="admin-toolbar">
        <span class="ant-input-affix-wrapper" style="width:200px"><input class="ant-input" id="filterAssetUid" placeholder="UID / 昵称"></span>
        <button type="button" class="ant-btn ant-btn-primary" id="btnAstQuery">查询</button>
        <button type="button" class="ant-btn" id="btnAstReset">重置</button>
      </div>
      <div class="ant-card ant-card-bordered users-assets-card">
        <div class="ant-card-body">
          <div class="ant-table ant-table-bordered ant-table-middle admin-assets-table">
            <div class="admin-assets-table-scroll">
              <table>
                <thead class="ant-table-thead">
                  <tr>
                    <th>UID</th>
                    <th>用户昵称</th>
                    <th>链名称</th>
                    <th>钱包地址</th>
                    <th>积分余额</th>
                    <th>冻结积分</th>
                    <th>更新时间</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="assetsTableBody" data-pager="js"></tbody>
              </table>
            </div>
          </div>
          <div id="assetsPager"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="js/admin-nav.js"></script>
<script src="js/admin-modal.js"></script>
<script src="js/users-list-page.js"></script>
<script src="js/admin-uid-link.js"></script>
<script src="js/users-assets-page.js"></script>
</body>
</html>
